# CI validation harness for the generic/ package suite — see .ci/README.md
# Bundles wifi.yml + api_ota.yml + mqtt.yml + restartbutton.yml +
# generic_sensors.yml, the generic/ suite as a device would include it.
substitutions:
  device_name: "generic-ci"
  friendly_name: "Generic CI"
  WIFI_passwd: "ci-dummy-password"
  fallback_passwd: "ci-dummy-password"
  device_key: "ZGADVtIpvtmMT0gQEAIiwsZjP8q/s6AuQFxiZI4mxj4="  # CI-only dummy; real devices set device_key via !secret
  MQTT_passwd: "ci-dummy-password"

esphome:
  name: ${device_name}

esp8266:
  board: d1_mini

api:

packages:
  wifi: !include ../generic/wifi.yml
  api_ota: !include ../generic/api_ota.yml
  mqtt: !include ../generic/mqtt.yml
  restart_button: !include ../generic/restartbutton.yml
  generic_sensors: !include ../generic/generic_sensors.yml
