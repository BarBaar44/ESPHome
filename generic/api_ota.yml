# API and OTA encryption for every device, Wi-Fi (with generic/wifi.yml)
# or Ethernet. Needs the ${device_key} substitution (the API encryption key).

ota:
  - platform: esphome
    # id lets a device file extend this entry (ota: - id: !extend ota_esphome).
    # An OTA password can't be added: ESPHome refuses it next to encryption.
    id: ota_esphome
    # Encrypt OTA uploads with the API encryption key (device_key below).
    # No separate secret. Replaces an OTA password, which ESPHome no
    # longer recommends; without this block uploads are plaintext and
    # unauthenticated.
    # Plaintext uploads are refused: a device whose firmware can't decrypt
    # yet needs a serial (USB) flash.
    encryption: {}

# Enable Home Assistant API
api:
  encryption:
    key: "${device_key}"
