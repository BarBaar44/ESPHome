# API and OTA encryption for devices that cannot use wifi.yml, such as the
# Ethernet Bluetooth proxies. Same blocks as in wifi.yml: keep the two in
# step. Needs the ${device_key} substitution (the API encryption key).

ota:
  - platform: esphome
    # id lets a device file extend this entry, e.g. to add its old OTA
    # password for the one migration upload:
    #   ota:
    #     - id: !extend ota_esphome
    #       password: !secret <device>_ota
    id: ota_esphome
    # Encrypt OTA uploads with the API encryption key (device_key below).
    # Plaintext uploads are refused: a device whose firmware can't decrypt
    # yet needs a serial (USB) flash.
    encryption: {}

# Enable Home Assistant API
api:
  encryption:
    key: "${device_key}"
