# Wi-Fi with a fallback hotspot. API and OTA encryption live in
# generic/api_ota.yml, so include both (Ethernet devices only need
# api_ota.yml).

wifi:
  ssid: "BarBaar_IoT"
  password: '${WIFI_passwd}'
  min_auth_mode: WPA2
  fast_connect: on
  power_save_mode: light
  ap:
    ssid: '${device_name} Fallback Hotspot'
    password: '${fallback_passwd}'

captive_portal:
