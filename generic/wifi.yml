wifi:
  ssid: "BarBaar_IoT"
  password: '${WIFI_passwd}'
  min_auth_mode: WPA2
  fast_connect: on
  power_save_mode: light
  ap:
    ssid: '${device_name} Fallback Hotspot'
    password: '${fallback_passwd}'
  
captive_portal:

ota:
  - platform: esphome
    # id lets a device file extend this entry, e.g. to add its old OTA
    # password for the one migration upload:
    #   ota:
    #     - id: !extend ota_esphome
    #       password: !secret <device>_ota
    id: ota_esphome
    # Encrypt OTA uploads with the API encryption key (device_key below).
    # No separate secret. Replaces an OTA password, which ESPHome no
    # longer recommends; without this block uploads are plaintext and
    # unauthenticated.
    # Plaintext uploads are refused: a device whose firmware can't decrypt
    # yet needs a serial (USB) flash.
    encryption: {}

# Enable Home Assistant API
api:
  encryption:
    key: "${device_key}"

time:
  - platform: homeassistant
    id: time_homeassistant
    on_time_sync:
      - component.update: sensor_uptime_timestamp

