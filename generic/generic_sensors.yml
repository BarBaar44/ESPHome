# Uptime and Wi-Fi signal, plus the Home Assistant time source they and
# other packages (Plug S daily energy, LVGL panels) use as time_homeassistant.

time:
  - platform: homeassistant
    id: time_homeassistant

sensor:
  # Boot time as a timestamp. The native uptime timestamp sensor replaces
  # the old template lambda, which could latch NaN for good when the first
  # time sync came before the uptime sensor had a value.
  - platform: uptime
    type: timestamp
    id: sensor_uptime_timestamp
    name: "${friendly_name} Uptime"
    time_id: time_homeassistant
  - platform: wifi_signal # Reports the WiFi signal strength/RSSI in dB
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic"
