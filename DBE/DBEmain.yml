######################################################
# ESPHome: Interval-based fan control with HARD OFF
######################################################

globals:
  - id: fanspeed
    type: float
    restore_value: false
    initial_value: '0'

  # millis() timestamp of the last GOOD reading from each Dallas sensor.
  # filter_out: nan means a dropped reading is never published, so .state
  # stays pinned to the last value - these let control_fans notice a
  # sensor that has silently stopped reporting.
  - id: temp_1_last_update
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: temp_2_last_update
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # Last fan speed we emitted a log line for, so the 5s control loop only
  # logs when something actually changed instead of every cycle.
  - id: last_log_speed
    type: float
    restore_value: false
    initial_value: '-1'

logger:
  # INFO by default. NOTE: each base/dbe-*.yaml wrapper currently sets
  # `logger: level: DEBUG`, which overrides this - drop those to INFO too
  # for a quiet production device.
  level: INFO

######################################################
# OneWire bus
######################################################
one_wire:
  - platform: gpio
    pin: D1
    id: dallas_1

######################################################
# Sensors
######################################################
sensor:
  - platform: dallas_temp
    address: '${dallas_1_ID}'
    name: '${device_name} Dallas 1'
    id: temp_1
    update_interval: 30s
    accuracy_decimals: 1
    filters:
      - filter_out: nan
    on_value:
      - lambda: 'id(temp_1_last_update) = millis();'

  - platform: dallas_temp
    address: '${dallas_2_ID}'
    name: '${device_name} Dallas 2'
    id: temp_2
    update_interval: 30s
    accuracy_decimals: 1
    filters:
      - filter_out: nan
    on_value:
      - lambda: 'id(temp_2_last_update) = millis();'

  - platform: pulse_counter
    pin: D5
    name: '${device_name} Fan RPM'
    unit_of_measurement: 'RPM'
    update_interval: 5s
    filters:
      - multiply: 0.5

######################################################
# Physical power relay (HARD OFF)
######################################################
switch:
  - platform: gpio
    pin: D0
    id: powerswitch
    internal: true
    restore_mode: ALWAYS_OFF

######################################################
# PWM output + Fan
######################################################
output:
  - platform: esp8266_pwm
    pin: D6
    frequency: 1000 Hz
    max_power: 90%
    id: pwm_output

fan:
  - platform: speed
    id: fancontrol
    name: "${device_name} Fan"
    internal: true
    output: pwm_output
    speed_count: 100
    on_turn_on:
      - switch.turn_on: powerswitch
      - logger.log: "Fan turned ON"
    on_turn_off:
      - switch.turn_off: powerswitch
      - logger.log: "Fan turned OFF"

######################################################
# Home Assistant controls
######################################################
select:
  - platform: template
    name: "${device_name} Fan Mode"
    id: fan_mode
    optimistic: true
    options:
      - AUTO
      - MANUAL
    initial_option: AUTO

number:
  - platform: template
    name: "${device_name} Manual Fan Speed"
    id: manual_fanspeed
    min_value: 0
    max_value: 100
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 0

######################################################
# Interval trigger
######################################################
interval:
  - interval: 5s
    then:
      - script.execute: control_fans

######################################################
# Fan control logic
######################################################
script:
  - id: control_fans
    mode: restart
    then:
      - lambda: |-
          // ==============================
          // MANUAL MODE
          // ==============================
          if (strcmp(id(fan_mode).current_option().c_str(), "MANUAL") == 0) {
            float manual = id(manual_fanspeed).state;
            if (!isfinite(manual)) {
              id(fanspeed) = 0.0f;
            } else {
              id(fanspeed) = (manual < 1.0f) ? 0.0f : manual;
            }
            return;
          }

          // ==============================
          // AUTOMATIC MODE
          // ==============================
          float t1 = id(temp_1).state;
          float t2 = id(temp_2).state;

          // --- Sensor sanity ---
          // Reject non-finite readings, the DS18B20 power-on-reset
          // sentinel (85.0), bus-error values (-127), and anything
          // outside a plausible radiator-pipe range. Any bad reading
          // fails safe to fan OFF.
          const float t_lo = 0.0f;
          const float t_hi = 95.0f;
          bool t1_ok = isfinite(t1) && t1 > t_lo && t1 < t_hi && t1 != 85.0f;
          bool t2_ok = isfinite(t2) && t2 > t_lo && t2 < t_hi && t2 != 85.0f;

          // --- Staleness ---
          // filter_out: nan keeps .state at the last good value when a
          // sensor drops out, so without this a sustained failure would
          // freeze deltaT and leave the fan running indefinitely. Fail
          // if a sensor has not produced a fresh value in 3x its 30s
          // update interval. (millis() wraps after ~49 days; the
          // unsigned subtraction stays correct across a single wrap.)
          const uint32_t max_age_ms = 90000;
          uint32_t now = millis();
          if (t1_ok && (now - id(temp_1_last_update)) > max_age_ms) t1_ok = false;
          if (t2_ok && (now - id(temp_2_last_update)) > max_age_ms) t2_ok = false;

          if (!t1_ok || !t2_ok) {
            id(fanspeed) = 0;
            return;
          }

          float deltaT = fabsf(t1 - t2);

          // --- HARD OFF hysteresis ---
          const float off_threshold = 0.8f;
          const float on_threshold  = 1.5f;

          bool fan_is_on = id(fancontrol).state;

          if (!fan_is_on && deltaT < on_threshold) {
            id(fanspeed) = 0;
          } else if (fan_is_on && deltaT < off_threshold) {
            id(fanspeed) = 0;
          } else {
            // --- Exponential fan curve ---
            const float dt_min = 2.0f;
            const float dt_max = 20.0f;
            const float speed_min = 25.0f;
            const float speed_max = 80.0f;
            const float exponent = 1.1f;

            float x = (deltaT - dt_min) / (dt_max - dt_min);
            x = fmaxf(0.0f, fminf(1.0f, x));

            float curve = powf(x, exponent);
            id(fanspeed) = speed_min + curve * (speed_max - speed_min);
          }

          id(fanspeed) = fmaxf(0.0f, fminf(100.0f, id(fanspeed)));

      # ==============================
      # APPLY FAN STATE
      # ==============================
      - if:
          condition:
            lambda: 'return id(fanspeed) > 0;'
          then:
            - fan.turn_on:
                id: fancontrol
                speed: !lambda 'return id(fanspeed);'
          else:
            - fan.turn_off: fancontrol

      # ==============================
      # LOGGING - only when the commanded speed actually changed, so a
      # steady-state fan doesn't emit a line every 5s.
      # ==============================
      - if:
          condition:
            lambda: 'return fabsf(id(fanspeed) - id(last_log_speed)) >= 1.0f;'
          then:
            - logger.log:
                format: "Mode=%s ΔT=%.2f Fanspeed=%.1f"
                args:
                  - 'id(fan_mode).current_option().c_str()'
                  - 'fabs(id(temp_1).state - id(temp_2).state)'
                  - 'id(fanspeed)'
            - lambda: 'id(last_log_speed) = id(fanspeed);'
