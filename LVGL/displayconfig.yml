# Define a PWM output on the ESP32
output:
  - platform: ledc
    pin: 2
    frequency: 1220
    id: gpio_backlight_pwm

light:
  - platform: monochromatic # Define a monochromatic, dimmable light for the backlight
    output: gpio_backlight_pwm
    name: ${device_name} Display Backlight
    id: back_light
    # Screen ON after every boot / power cycle. The on_boot automation in
    # LVGL/Masterbedroom/lvglsensors.yml then runs wake_screen, which keeps
    # it on for screen_timeout seconds and afterwards hands control back to
    # update_screen_state (motion / ceiling light / night-mode rules).
    # Previously this was ALWAYS_OFF, which left the panel dark after a
    # reboot until motion or the ceiling light happened to trigger it.
    restore_mode: ALWAYS_ON

display:
  - platform: rpi_dpi_rgb
    id: main_display
    color_order: RGB
    invert_colors: True
    # Panel mounted upside down -> rotate the whole UI 180 degrees.
    # This is a software rotation: RGB (DPI) panels have no MADCTL-style
    # hardware mirror like SPI controllers do, and rpi_dpi_rgb hands
    # rendering off to the generic Display::draw_pixels_at path whenever
    # rotation != 0, which is slower than its direct blit. 180 needs no
    # change to `dimensions` below (only 90/270 swap the axes).
    rotation: 180
    update_interval: never
    auto_clear_enabled: false # takes 2.8 seconds to clear the display
    dimensions:
      width: 800
      height: 480
    de_pin: 40
    hsync_pin: 39
    vsync_pin: 41
    pclk_pin: 0
    pclk_frequency: 12MHz
    data_pins:
      red:
        - 45 #r1
        - 48 #r2
        - 47 #r3
        - 21 #r4
        - 14 #r5
      green:
        - 5 #g0
        - 6 #g1
        - 7 #g2
        - 15 #g3
        - 16 #g4
        - 4 #g5
      blue:
        - 8 #b1
        - 3 #b2
        - 46 #b3
        - 9 #b4
        - 1 #b5

i2c:
  sda: GPIO19
  scl: GPIO20
  scan: true

touchscreen:
  platform: gt911
  # The GT911 reports raw panel coordinates, and this transform is applied
  # independently of the display's `rotation: 180` above - so it has to be
  # mirrored here too, otherwise the UI would look correct but every touch
  # would land at the point-mirrored spot (top-left press hits bottom-right).
  # mirror_x + mirror_y == 180; swap_xy is only needed for 90/270.
  # If touch comes out inverted after flashing, this block is the thing to
  # remove.
  transform:
    mirror_x: true
    mirror_y: true
  on_touch:
    # Wake the screen on any touch (keeps it awake for a while via the wake_screen script)
    - script.execute: wake_screen
