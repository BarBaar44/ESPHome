# Define a PWM output on the ESP32
output:
  - platform: ledc
    pin: 2
    frequency: 1220
    id: gpio_backlight_pwm

light:
  - platform: monochromatic # Define a monochromatic, dimmable light for the backlight
    output: gpio_backlight_pwm
    name: ${device_name} Display Backlight
    id: back_light
    # Screen ON after every boot / power cycle. The on_boot automation in
    # LVGL/Masterbedroom/lvglsensors.yml then runs wake_screen, which keeps
    # it on for screen_timeout seconds and afterwards hands control back to
    # update_screen_state (motion / ceiling light / night-mode rules).
    # Previously this was ALWAYS_OFF, which left the panel dark after a
    # reboot until motion or the ceiling light happened to trigger it.
    restore_mode: ALWAYS_ON

display:
    # Migrated from the deprecated 'rpi_dpi_rgb' platform.
    #
    # 'mipi_rgb' is model-driven, so 'model' is now required. RPI is the
    # model registered with an empty init sequence, which makes it the
    # direct equivalent of the old rpi_dpi_rgb component: no SPI bus, no
    # cs_pin / dc_pin and no init sequence. The other mipi_rgb models
    # (ST7701S, Guition, Sunton, Waveshare) do need an spi: section - RPI
    # does not, which is why none is defined here.
  - platform: mipi_rgb
    model: RPI
    id: main_display
    # Default flipped from BGR (rpi_dpi_rgb) to RGB (mipi_rgb), so this is
    # kept explicit to stay independent of the platform default.
    color_order: RGB
    invert_colors: True
    update_interval: never
    auto_clear_enabled: false # takes 2.8 seconds to clear the display
    dimensions:
      width: 800
      height: 480
    de_pin: 40
    hsync_pin: 39
    vsync_pin: 41
    pclk_pin: 0
    pclk_frequency: 12MHz
    # These six were implicit defaults under rpi_dpi_rgb, which hardcoded
    # them in its schema. mipi_rgb looks them up on the model instead and
    # the RPI model defines no defaults, so leaving them out makes them
    # validate to 0 - resulting in tearing or a rolling / shifted image.
    # Set explicitly to the previous rpi_dpi_rgb defaults so the pixel
    # timing is identical to what was running before.
    hsync_pulse_width: 10
    hsync_back_porch: 10
    hsync_front_porch: 20
    vsync_pulse_width: 10
    vsync_back_porch: 10
    vsync_front_porch: 10
    # Pin order is unchanged on purpose. rpi_dpi_rgb ordered the bus
    # conditionally on color_order (red->green->blue for BGR,
    # blue->green->red otherwise); mipi_rgb always uses blue->green->red.
    # Because color_order is RGB, the old code already took the
    # blue->green->red branch, so the resulting bus order - and therefore
    # the colours - stay the same.
    data_pins:
      red:
        - 45 #r1
        - 48 #r2
        - 47 #r3
        - 21 #r4
        - 14 #r5
      green:
        - 5 #g0
        - 6 #g1
        - 7 #g2
        - 15 #g3
        - 16 #g4
        - 4 #g5
      blue:
        - 8 #b1
        - 3 #b2
        - 46 #b3
        - 9 #b4
        - 1 #b5

i2c:
  sda: GPIO19
  scl: GPIO20
  scan: true

touchscreen:
  platform: gt911
  on_touch:
    # Wake the screen on any touch (keeps it awake for a while via the wake_screen script)
    - script.execute: wake_screen
