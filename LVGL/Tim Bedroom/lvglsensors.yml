# =====================================================================
# Scripts, globals en Home Assistant koppelingen voor het wandpaneel.
# Overgenomen van LVGL/Masterbedroom/lvglsensors.yml.
#
# Verschil met de Master Bedroom: screen_timeout en climate_setpoint_value
# worden HIER gedeclareerd, niet in de per-device hoofdconfig. Op de
# Master Bedroom staan die twee alleen in de lokale hoofdconfig, wat
# betekent dat ze nergens in de repo terug te vinden zijn en dat de
# CI-harness ze moet nabouwen. Zet ze dus NIET nog een keer in de
# hoofdconfig van dit paneel, dat geeft een dubbele id.
# =====================================================================

# =========================
# BOOT-TIME UI SYNC
# =========================
# Drie taken bij het opstarten:
#
# 1. Scherm aan en de normale inactiviteitscyclus starten. De backlight
#    zelf komt op via restore_mode: ALWAYS_ON (zie LVGL/displayconfig.yml),
#    maar dat alleen zou hem eeuwig aan laten: update_screen_state draait
#    uitsluitend vanuit een trigger (beweging, plafondlamp, of het einde
#    van wake_screen) en niets evalueert hem na een reboot.
#
# 2. De schermtimeout- en nachtmodus-dropdowns terugzetten naar de
#    globals uit flash. LVGL-widgets bewaren hun eigen state niet over een
#    reboot; alleen de globals doen dat (restore_value: yes).
#
# 3. Controleren of de HA-helpers uberhaupt bestaan, en daarna hun
#    waarden opnieuw toepassen op de widgets. Zie check_ha_settings.
#
#    WAAROM DIE HER-TOEPASSING NODIG IS. LVGL-widgetstate overleeft geen
#    reboot. Het enige dat de gordijnknoppen ooit kleurde was de on_value
#    van de bijbehorende homeassistant text_sensor, dus het paneel was
#    afhankelijk van het opvangen van dat ene event tijdens de
#    API-handshake - terwijl LVGL nog aan het opstarten was en er geen
#    tweede kans kwam. Opnieuw toepassen vanuit de gecachete state sluit
#    dat gat.
#
# Draait laat (priority -100, na het opzetten van LVGL).
esphome:
  on_boot:
    priority: -100
    then:
      # Scherm aan en de screen_timeout-teller starten. Voor de delay
      # hieronder, zodat het aftellen meteen begint.
      - script.execute: wake_screen
      - delay: 2s
      - lvgl.dropdown.update:
          id: screen_timeout_dropdown
          selected_index: !lambda |-
            int secs[] = {30, 60, 120, 300, 600, 1800};
            for (int i = 0; i < 6; i++) {
              if (secs[i] == id(screen_timeout)) return i;
            }
            return 3;  // standaard 5 min
      - lvgl.dropdown.update:
          id: night_mode_start_dropdown
          selected_index: !lambda 'return id(night_mode_start_hour);'
      - lvgl.dropdown.update:
          id: night_mode_end_dropdown
          selected_index: !lambda 'return id(night_mode_end_hour);'
      # Eerste gezondheidscheck en de boot-hersync. De extra vertraging is
      # bewust: op 2s kan de API nog niet klaar zijn met het sturen van de
      # initiele states, en elke helper dan als ontbrekend markeren leert
      # mensen de waarschuwing negeren. sync_settings_from_ha is
      # has_state()-gated, dus te vroeg draaien zou simpelweg elke widget
      # overslaan.
      - delay: 20s
      - script.execute: check_ha_settings

# =========================
# GLOBALS
# =========================
globals:
  # Voorkomt de feedback-loop uit esphome/esphome#17161:
  # lvgl.widget.update op een widget vuurt ook zijn on_value af, ook als
  # de wijziging puur programmatisch is. Zonder guard wordt elke
  # HA-statuswijziging meteen als nieuwe gebruikersactie teruggekaatst.
  #
  # Alleen de lichtschakelaars hebben dit nodig: de gordijn- en
  # ventilatorknoppen zijn buttons met on_click, en die vuren niet af bij
  # een programmatische update.
  - id: mirroring_light_switches
    type: bool
    restore_value: no
    initial_value: 'false'

  # Of de backlight UIT was op het moment dat de huidige aanraking
  # binnenkwam, bemonsterd door wake_screen VOORDAT die de backlight
  # aanzet. Dit onderscheidt een "wek-aanraking" van een normale
  # aanraking op een al verlicht scherm. Een wek-aanraking brengt de UI
  # terug naar de hoofdpagina; een normale niet, zodat de
  # instellingenpagina niet onder je vinger vandaan springt.
  #
  # Moet voor light.turn_on bemonsterd worden, anders is de state al
  # omgeslagen en lijkt elke aanraking een wek-aanraking.
  - id: screen_was_off
    type: bool
    restore_value: no
    initial_value: 'false'

  # Hoeveel van de HA-helpers op dit moment helemaal geen state hebben
  # (zie evaluate_helper_health). Start op -1 en niet op 0, zodat "nog
  # niet gekeken" te onderscheiden is van "gekeken en alles in orde".
  - id: helpers_missing_count
    type: int
    restore_value: no
    initial_value: '-1'

  - id: helpers_status_text
    type: std::string
    restore_value: no
    initial_value: '"HA-instellingen controleren..."'

  # Nachtmodus: venster (uur van de dag, 0-23) waarin PIR-beweging het
  # scherm niet wekt. Wrapt over middernacht als start > eind.
  - id: night_mode_start_hour
    type: int
    restore_value: yes
    initial_value: '22'

  - id: night_mode_end_hour
    type: int
    restore_value: yes
    initial_value: '7'

  # Hoe lang het scherm aanblijft na de laatste aanraking. Bewerkbaar via
  # de dropdown op de instellingenpagina.
  - id: screen_timeout
    type: int
    restore_value: yes
    initial_value: '300'  # 5 min, komt overeen met de standaardindex

  # Lokale setpoint-teller voor de +/- knoppen. Wordt bij elke HA-update
  # overschreven met de werkelijke waarde, zodat snel tikken niet
  # wegloopt van wat de thermostaat echt doet.
  - id: climate_setpoint_value
    type: float
    restore_value: no
    initial_value: '21.0'

# =========================
# BUTTONS
# =========================
button:
  # Herstart het paneel. Aangestuurd door de Reboot-knop op de
  # instellingenpagina, en ook als gewone button-entity in HA zodat het
  # paneel op afstand herstart kan worden.
  - platform: restart
    name: "${friendly_name} Restart"
    id: btn_restart
    entity_category: "diagnostic"

# =========================
# SCRIPTS
# =========================
script:
  # Backlight aan/uit op basis van beweging OF plafondlamp. Scherm is aan
  # als de plafondlamp aan is, OF er beweging is buiten het ingestelde
  # nachtvenster.
  - id: update_screen_state
    then:
      - if:
          condition:
            lambda: |-
              // De plafondlamp wekt/houdt het scherm altijd aan,
              // ongeacht nachtmodus.
              if (id(ceiling_light_on).state) return true;
              // Geen licht en geen beweging -> scherm uit.
              if (!id(motion_occupancy).state) return false;
              // Beweging: onderdruk het automatisch wekken tijdens de
              // ingestelde nachturen. Als de HA-tijd nog niet
              // gesynchroniseerd is, fail open (wel wekken) in plaats van
              // het scherm uit te laten hangen.
              auto t = id(time_homeassistant).now();
              if (!t.is_valid()) return true;
              int hour = t.hour;
              int start = id(night_mode_start_hour);
              int end = id(night_mode_end_hour);
              bool is_night;
              if (start == end) {
                is_night = false;
              } else if (start < end) {
                is_night = (hour >= start && hour < end);
              } else {
                is_night = (hour >= start || hour < end);
              }
              return !is_night;
          then:
            - light.turn_on: back_light
            # Veilig om hier aan te roepen: apply_brightness past alleen
            # de helderheid aan terwijl back_light al aan is, hij zet hem
            # nooit aan of uit, dus hij kan het besluit hierboven niet
            # overrulen.
            - script.execute: apply_brightness
          else:
            - light.turn_off: back_light

  # Wek het scherm bij aanraking en houd het aan gedurende de ingestelde
  # timeout. mode: restart, dus elke aanraking herstart de teller.
  - id: wake_screen
    mode: restart
    then:
      # STAP 1 - bemonster de backlight-state VOORDAT je hem aanraakt.
      # Volgorde is hier essentieel.
      - if:
          condition:
            light.is_on: back_light
          then:
            - globals.set:
                id: screen_was_off
                value: 'false'
          else:
            - globals.set:
                id: screen_was_off
                value: 'true'

      - light.turn_on: back_light
      - script.execute: apply_brightness

      # STAP 2 - een aanraking die het scherm uit stand-by haalde brengt
      # de UI ook terug naar de hoofdpagina, zodat het paneel altijd in
      # een bekende toestand wordt aangetroffen. Een aanraking op een al
      # verlicht scherm wordt bewust met rust gelaten.
      - if:
          condition:
            lambda: 'return id(screen_was_off);'
          then:
            - script.execute: return_to_main_page_now

      - script.execute: return_to_main_page

      - delay: !lambda 'return id(screen_timeout) * 1000;'
      - script.execute: update_screen_state

  # Automatische terugkeer: 30s na de laatste aanraking terug van de
  # instellingenpagina naar de hoofdpagina.
  #
  # Bewust onafhankelijk van screen_timeout: de pagina keert na 30s
  # inactiviteit terug, terwijl de backlight veel langer aan mag blijven.
  # Een pagina terugzetten is gratis en onzichtbaar als er niemand kijkt;
  # de backlight uitzetten is dat niet.
  - id: return_to_main_page
    mode: restart
    then:
      - delay: 30s
      # Alleen handelen als de hoofdpagina NIET al getoond wordt. Zonder
      # deze guard roept de timer 30s na elke aanraking lvgl.page.show aan
      # op de al actieve pagina, wat een zinloze volledige 800x480
      # schermopbouw en mogelijk zichtbaar flikkeren oplevert.
      #
      # is_showing() is de eigen accessor van LvPageType hiervoor. Let op:
      # lv_scr_act() vergelijken met id(main_page) compileert NIET -
      # id(main_page) is een esphome::lvgl::LvPageType*, niet de ruwe
      # lv_obj_t* die lv_scr_act() teruggeeft.
      - if:
          condition:
            lambda: 'return !id(main_page)->is_showing();'
          then:
            - script.execute: return_to_main_page_now

  - id: return_to_main_page_now
    then:
      - lvgl.page.show: main_page

  # Helderheid op basis van omgevingslicht. Lineaire ramp tussen twee
  # klemwaarden:
  #   <= 5 lux   -> 20%
  #   >= 200 lux -> 100%
  #
  # BELANGRIJK: dit past alleen de helderheid aan terwijl back_light al
  # AAN is. Het zet de backlight nooit aan of uit, zodat
  # update_screen_state de enige eigenaar van dat besluit blijft.
  - id: apply_brightness
    mode: restart
    then:
      - if:
          condition:
            light.is_on: back_light
          then:
            - light.turn_on:
                id: back_light
                brightness: !lambda |-
                  // Als de sensor nog niets gerapporteerd heeft (NaN),
                  // laat de backlight dan op vol staan in plaats van te
                  // gokken.
                  float lux = id(ha_room_illuminance).state;
                  if (isnan(lux)) return 1.0f;
                  const float lux_min = 5.0f;
                  const float lux_max = 200.0f;
                  const float b_min = 0.20f;
                  const float b_max = 1.00f;
                  if (lux <= lux_min) return b_min;
                  if (lux >= lux_max) return b_max;
                  float frac = (lux - lux_min) / (lux_max - lux_min);
                  return b_min + frac * (b_max - b_min);

  # =========================
  # HA HELPER GEZONDHEIDSCHECK
  # =========================
  # WAAROM DIT BESTAAT. Op de Master Bedroom verwijderde een corrupte
  # HA-database ooit een aantal input_* helpers. Het paneel liet daar
  # niets van zien: elke dropdown viel terug op de standaardwaarde uit
  # zijn eigen widgetdefinitie, dus het scherm toonde zelfverzekerde,
  # plausibele waarden voor entities die niet meer bestonden. Mensen
  # wijzigden instellingen, er gebeurde niets, en er was geen manier om
  # te zien waarom. De API was de hele tijd verbonden, dus het HA-icoon
  # in de header bleef wit.
  #
  # WAAROM EEN HER-SYNC-KNOP DAT NIET OPLOST. Opnieuw kopieren van de
  # HA-waarde veronderstelt dat er EEN waarde is. Als de helper weg is
  # valt er niets te kopieren, en een knop die stilletjes slaagt is
  # slechter dan geen knop: die fabriceert vertrouwen dat het probleem
  # net opgelost is. Rapporteren, niet kopieren, is hier de hoofdtaak.
  #
  # BEPERKING, en een echte: has_state() vangt alleen helpers die NOOIT
  # gerapporteerd hebben. Een helper die verdwijnt terwijl het paneel
  # draait wordt niet gevangen, want de homeassistant sensor houdt zijn
  # laatst ontvangen waarde vast en has_state() blijft true. Het
  # boot-geval is het geval dat zich daadwerkelijk voordeed.
  - id: evaluate_helper_health
    mode: restart
    then:
      - lambda: |-
          // De namen zijn de labels zoals ze op het scherm staan, niet
          // de entity_ids, zodat de waarschuwing wijst naar wat de
          // gebruiker daadwerkelijk kan zien.
          struct HelperCheck {
            const char *label;
            bool present;
          };
          const HelperCheck checks[] = {
            {"Open",  id(ha_cover_open_time).has_state()},
            {"Dicht", id(ha_cover_close_time).has_state()},
          };
          const int total = sizeof(checks) / sizeof(checks[0]);

          int missing = 0;
          std::string names;
          for (int i = 0; i < total; i++) {
            if (!checks[i].present) {
              missing++;
              if (!names.empty()) names += ", ";
              names += checks[i].label;
            }
          }
          id(helpers_missing_count) = missing;

          char buf[48];
          if (missing == 0) {
            snprintf(buf, sizeof(buf), "Instellingen OK (%d/%d)", total, total);
            id(helpers_status_text) = buf;
          } else {
            snprintf(buf, sizeof(buf), "%d/%d ontbreekt: ", missing, total);
            id(helpers_status_text) = std::string(buf) + names;
            ESP_LOGW("ha_helpers", "%d van %d HA-helpers ontbreken: %s",
                     missing, total, names.c_str());
          }
      - lvgl.label.update:
          id: lbl_settings_status
          text: !lambda 'return id(helpers_status_text);'
          text_color: !lambda 'return lv_color_hex(id(helpers_missing_count) > 0 ? 0xC62828 : 0x4CAF50);'

  # Wat de Check-knop draait: eerst rapporteren, dan opnieuw toepassen.
  # De volgorde is het punt. evaluate_helper_health bepaalt en toont wat
  # er werkelijk mis is; sync_settings_from_ha doet daarna zijn best met
  # de state die er wel is.
  - id: check_ha_settings
    mode: restart
    then:
      - script.execute: evaluate_helper_health
      - script.execute: sync_settings_from_ha

  # Pas de gecachete HA-state opnieuw toe op de widgets.
  #
  # HOME ASSISTANT WINT, ALTIJD. Dit schrijft alleen HA-state naar de
  # widgets, nooit een widgetwaarde terug naar HA.
  #
  # WAAROM HET GECACHETE STATE LEEST IN PLAATS VAN HA OM EEN HERZENDING
  # TE VRAGEN: ESPHome's homeassistant sensors vuren on_value alleen af
  # als de ontvangen waarde VERSCHILT van wat ze al hebben. Een
  # identieke state opnieuw pushen vuurt dus helemaal niets af - en
  # identieke-state-maar-verkeerde-widget is precies het geval waarvoor
  # je een handmatige her-toepassing zou willen. De gecachete state
  # lezen kost geen round-trip en kan niet stilletjes niets doen.
  - id: sync_settings_from_ha
    mode: restart
    then:
      - script.execute: update_close_time_buttons
      - script.execute: update_open_time_buttons

      # Klimaat-setpoint. Geen mirror-loop-risico: de +/- knoppen
      # schrijven climate_setpoint_value rechtstreeks en vuren geen
      # on_value af die naar HA doorstuurt. Alleen opnieuw toegepast
      # zodat het label en de global niet de eerste seconden na een
      # reboot op de 21.0 uit de YAML blijven staan.
      - if:
          condition:
            lambda: 'return id(ha_climate_setpoint).has_state();'
          then:
            - globals.set:
                id: climate_setpoint_value
                value: !lambda 'return id(ha_climate_setpoint).state;'
            - lvgl.label.update:
                id: climate_setpoint_label
                text: !lambda |-
                  char buf[16];
                  snprintf(buf, sizeof(buf), "%.1f °C", id(ha_climate_setpoint).state);
                  return buf;

      # Lichtschakelaars. Onder de guard, want lvgl.widget.update vuurt
      # hun on_value af (esphome/esphome#17161).
      - lambda: 'id(mirroring_light_switches) = true;'
      - if:
          condition:
            lambda: 'return id(ceiling_light_on).has_state();'
          then:
            - lvgl.widget.update:
                id: switch_licht_kamer
                state:
                  checked: !lambda 'return id(ceiling_light_on).state;'
                shadow_width: !lambda 'return id(ceiling_light_on).state ? 15 : 0;'
      - if:
          condition:
            lambda: 'return id(ha_licht_bed).has_state();'
          then:
            - lvgl.widget.update:
                id: switch_licht_bed
                state:
                  checked: !lambda 'return id(ha_licht_bed).state;'
                shadow_width: !lambda 'return id(ha_licht_bed).state ? 15 : 0;'
      - lambda: 'id(mirroring_light_switches) = false;'

  # Kleurt de gordijn-sluittijdknoppen. Donkerblauw = de tijd die in Home
  # Assistant geselecteerd staat, standaardblauw = de rest.
  #
  # Idempotent en zonder guard: dit zijn buttons met alleen on_click, dus
  # een programmatische kleurwijziging kaatst niets terug naar HA. Wordt
  # aangeroepen vanuit ha_cover_close_time en vanuit sync_settings_from_ha
  # bij het opstarten.
  - id: update_close_time_buttons
    then:
      - lvgl.widget.update:
          id: btn_dicht_2100
          bg_color: !lambda 'return lv_color_hex(id(ha_cover_close_time).state == "21:00" ? 0x005782 : 0x2F8CD8);'
      - lvgl.widget.update:
          id: btn_dicht_2130
          bg_color: !lambda 'return lv_color_hex(id(ha_cover_close_time).state == "21:30" ? 0x005782 : 0x2F8CD8);'
      - lvgl.widget.update:
          id: btn_dicht_2200
          bg_color: !lambda 'return lv_color_hex(id(ha_cover_close_time).state == "22:00" ? 0x005782 : 0x2F8CD8);'
      - lvgl.widget.update:
          id: btn_dicht_2230
          bg_color: !lambda 'return lv_color_hex(id(ha_cover_close_time).state == "22:30" ? 0x005782 : 0x2F8CD8);'

  - id: update_open_time_buttons
    then:
      - lvgl.widget.update:
          id: btn_open_0700
          bg_color: !lambda 'return lv_color_hex(id(ha_cover_open_time).state == "7:00" ? 0x005782 : 0x2F8CD8);'
      - lvgl.widget.update:
          id: btn_open_0730
          bg_color: !lambda 'return lv_color_hex(id(ha_cover_open_time).state == "7:30" ? 0x005782 : 0x2F8CD8);'
      - lvgl.widget.update:
          id: btn_open_0800
          bg_color: !lambda 'return lv_color_hex(id(ha_cover_open_time).state == "8:00" ? 0x005782 : 0x2F8CD8);'
      - lvgl.widget.update:
          id: btn_open_0830
          bg_color: !lambda 'return lv_color_hex(id(ha_cover_open_time).state == "8:30" ? 0x005782 : 0x2F8CD8);'
      - lvgl.widget.update:
          id: btn_open_0900
          bg_color: !lambda 'return lv_color_hex(id(ha_cover_open_time).state == "9:00" ? 0x005782 : 0x2F8CD8);'
      - lvgl.widget.update:
          id: btn_open_0930
          bg_color: !lambda 'return lv_color_hex(id(ha_cover_open_time).state == "9:30" ? 0x005782 : 0x2F8CD8);'

  # Stuurt de twee statusiconen in de header op beide pagina's, en de
  # enabled-state van de Check-knop.
  #
  # De Check-knop hangt aan dezelfde conditie als het HA-icoon, zodat de
  # twee nooit iets anders kunnen beweren terwijl ze een paar centimeter
  # uit elkaar staan. Met de API plat is er geen gecachete state om te
  # beoordelen, dus een knop die er levend uitziet zou een leugen zijn.
  #
  # LET OP: dit is een ANDER soort storing dan waar de helpercheck over
  # gaat. api.connected bewijst dat het TRANSPORT werkt; het zegt niets
  # over de vraag of de entities daarachter nog bestaan.
  - id: update_connectivity_icons
    then:
      # Wifi: lvgl.label.update, want `text` (de glyph) is een
      # label-eigenschap, geen generieke stijleigenschap die
      # lvgl.widget.update begrijpt.
      - if:
          condition:
            wifi.connected:
          then:
            - lvgl.label.update:
                id: lbl_wifistatus
                text: "\U000F05A9"
                text_color: 0xFFFFFF
            - lvgl.label.update:
                id: lbl_wifistatus_2
                text: "\U000F05A9"
                text_color: 0xFFFFFF
          else:
            - lvgl.label.update:
                id: lbl_wifistatus
                text: "\U000F16B5"
                text_color: 0xFF0000
            - lvgl.label.update:
                id: lbl_wifistatus_2
                text: "\U000F16B5"
                text_color: 0xFF0000
      - if:
          condition:
            api.connected:
          then:
            - lvgl.widget.update:
                id: lbl_hastatus
                text_color: 0xFFFFFF
            - lvgl.widget.update:
                id: lbl_hastatus_2
                text_color: 0xFFFFFF
            - lvgl.widget.update:
                id: btn_check_settings
                state:
                  disabled: false
          else:
            - lvgl.widget.update:
                id: lbl_hastatus
                text_color: 0xFF0000
            - lvgl.widget.update:
                id: lbl_hastatus_2
                text_color: 0xFF0000
            - lvgl.widget.update:
                id: btn_check_settings
                state:
                  disabled: true

# =========================
# INTERVALS
# =========================
interval:
  - interval: 5s
    then:
      - script.execute: update_connectivity_icons

  # Proactieve helpercheck. Het hele punt is dat niemand een knop hoeft
  # in te drukken om te ontdekken dat een helper verdwenen is.
  #
  # Bewust evaluate_helper_health en NIET check_ha_settings: dit mag niet
  # naar de widgets schrijven. Elke 60s de HA-state opnieuw toepassen zou
  # met de gebruiker vechten terwijl die zit te bedienen; de hersync bij
  # boot is een eenmalige actie op een moment dat niemand bezig kan zijn.
  - interval: 60s
    then:
      - script.execute: evaluate_helper_health

# =========================
# TEXT SENSORS
# =========================
text_sensor:
  - platform: homeassistant
    id: ha_weather_condition
    entity_id: ${ent_weer}
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_weather_condition
            text: !lambda |-
              std::map<std::string, std::string> namen = {
                {"clear-night",     "Heldere nacht"},
                {"cloudy",          "Bewolkt"},
                {"exceptional",     "Uitzonderlijk"},
                {"fog",             "Mist"},
                {"hail",            "Hagel"},
                {"lightning",       "Onweer"},
                {"lightning-rainy", "Onweer en regen"},
                {"partlycloudy",    "Half bewolkt"},
                {"pouring",         "Stortregen"},
                {"rainy",           "Regen"},
                {"snowy",           "Sneeuw"},
                {"snowy-rainy",     "Natte sneeuw"},
                {"sunny",           "Zonnig"},
                {"windy",           "Winderig"},
                {"windy-variant",   "Winderig"}
              };
              std::string c = x;
              if (namen.count(c)) return namen[c];
              return c;

        - lvgl.label.update:
            id: lbl_weather_icon
            text: !lambda |-
              std::map<std::string, std::string> weather_icons = {
                {"clear-night",     "\U000F0594"},
                {"cloudy",          "\U000F0590"},
                {"exceptional",     "\U000F0F2F"},
                {"fog",             "\U000F0591"},
                {"hail",            "\U000F0592"},
                {"lightning",       "\U000F0593"},
                {"lightning-rainy", "\U000F067E"},
                {"partlycloudy",    "\U000F0595"},
                {"pouring",         "\U000F0596"},
                {"rainy",           "\U000F0597"},
                {"snowy",           "\U000F0598"},
                {"snowy-rainy",     "\U000F067F"},
                {"sunny",           "\U000F0599"},
                {"windy",           "\U000F059D"},
                {"windy-variant",   "\U000F059E"}
              };
              std::string c = x;
              if (weather_icons.count(c)) return weather_icons[c];
              return std::string("\U000F0599");

  # Gordijnen: geselecteerde openingstijd.
