# =====================================================================
# Scripts, globals en Home Assistant koppelingen voor het wandpaneel
# Kamer Tim. Overgenomen van LVGL/Masterbedroom/lvglsensors.yml.
#
# Entity-ids staan direct in de code, NIET als substitutions.
#
# Verschillen met de Master Bedroom:
#  * screen_timeout en climate_setpoint_value worden HIER gedeclareerd,
#    niet in de per-device hoofdconfig. Zet ze daar dus NIET nog een keer
#    neer, dat geeft een dubbele id.
#  * Geen bewegingssensor en geen luxsensor in deze kamer. Het scherm
#    gaat aan bij aanraking of als het kamerlicht aan is, en uit na de
#    schermtimeout. De helderheid is vast (100%).
# =====================================================================

# =========================
# BOOT-TIME UI SYNC
# =========================
# Drie taken bij het opstarten:
#
# 1. Scherm aan en de normale inactiviteitscyclus starten. De backlight
#    zelf komt op via restore_mode: ALWAYS_ON (zie LVGL/displayconfig.yml),
#    maar dat alleen zou hem eeuwig aan laten: update_screen_state draait
#    uitsluitend vanuit een trigger (plafondlamp of het einde van
#    wake_screen).
#
# 2. De schermtimeout- en nachtmodus-dropdowns terugzetten naar de
#    globals uit flash. LVGL-widgets bewaren hun eigen state niet over een
#    reboot; alleen de globals doen dat (restore_value: yes).
#
# 3. Controleren of de HA-helpers bestaan, en daarna hun waarden opnieuw
#    toepassen op de widgets. Zie check_ha_settings.
#
# Draait laat (priority -100, na het opzetten van LVGL).
esphome:
  on_boot:
    priority: -100
    then:
      - script.execute: wake_screen
      - delay: 2s
      - lvgl.dropdown.update:
          id: screen_timeout_dropdown
          selected_index: !lambda |-
            int secs[] = {30, 60, 120, 300, 600, 1800};
            for (int i = 0; i < 6; i++) {
              if (secs[i] == id(screen_timeout)) return i;
            }
            return 3;  // standaard 5 min
      - lvgl.dropdown.update:
          id: night_mode_start_dropdown
          selected_index: !lambda 'return id(night_mode_start_hour);'
      - lvgl.dropdown.update:
          id: night_mode_end_dropdown
          selected_index: !lambda 'return id(night_mode_end_hour);'
      # Eerste gezondheidscheck en de boot-hersync. De extra vertraging is
      # bewust: op 2s kan de API nog niet klaar zijn met het sturen van de
      # initiele states.
      - delay: 20s
      - script.execute: check_ha_settings

# =========================
# GLOBALS
# =========================
globals:
  # Voorkomt de feedback-loop uit esphome/esphome#17161:
  # lvgl.widget.update op een widget vuurt ook zijn on_value af, ook als
  # de wijziging puur programmatisch is.
  #
  # Alleen de lichtschakelaars hebben dit nodig: de gordijn- en
  # ventilatorknoppen zijn buttons met on_click, en die vuren niet af bij
  # een programmatische update.
  - id: mirroring_light_switches
    type: bool
    restore_value: no
    initial_value: 'false'

  # Of de backlight UIT was op het moment dat de huidige aanraking
  # binnenkwam, bemonsterd door wake_screen VOORDAT die de backlight
  # aanzet. Een wek-aanraking brengt de UI terug naar de hoofdpagina; een
  # normale niet.
  - id: screen_was_off
    type: bool
    restore_value: no
    initial_value: 'false'

  # Hoeveel van de HA-helpers op dit moment geen state hebben. Start op
  # -1 zodat "nog niet gekeken" te onderscheiden is van "alles in orde".
  - id: helpers_missing_count
    type: int
    restore_value: no
    initial_value: '-1'

  - id: helpers_status_text
    type: std::string
    restore_value: no
    initial_value: '"HA-instellingen controleren..."'

  # Nachtmodus: venster (uur van de dag, 0-23). Heeft zonder
  # bewegingssensor op dit moment geen effect; blijft staan voor als die
  # er later bijkomt.
  - id: night_mode_start_hour
    type: int
    restore_value: yes
    initial_value: '22'

  - id: night_mode_end_hour
    type: int
    restore_value: yes
    initial_value: '7'

  # Hoe lang het scherm aanblijft na de laatste aanraking.
  - id: screen_timeout
    type: int
    restore_value: yes
    initial_value: '300'  # 5 min, komt overeen met de standaardindex

  # Lokale setpoint-teller voor de +/- knoppen. Wordt bij elke HA-update
  # overschreven met de werkelijke waarde.
  - id: climate_setpoint_value
    type: float
    restore_value: no
    initial_value: '21.0'

# =========================
# BUTTONS
# =========================
button:
  - platform: restart
    name: "${friendly_name} Restart"
    id: btn_restart
    entity_category: "diagnostic"

# =========================
# SCRIPTS
# =========================
script:
  # Backlight aan/uit. Zonder bewegingssensor is de regel simpel: aan
  # zolang de plafondlamp aan is, anders uit. Aanraken wekt het scherm
  # los hiervan via wake_screen, en wake_screen roept dit script aan na
  # afloop van de timeout.
  - id: update_screen_state
    then:
      - if:
          condition:
            lambda: 'return id(ceiling_light_on).state;'
          then:
            - light.turn_on:
                id: back_light
                brightness: 100%
          else:
            - light.turn_off: back_light

  # Wek het scherm bij aanraking en houd het aan gedurende de ingestelde
  # timeout. mode: restart, dus elke aanraking herstart de teller.
  - id: wake_screen
    mode: restart
    then:
      # STAP 1: bemonster de backlight-state VOORDAT je hem aanraakt.
      - if:
          condition:
            light.is_on: back_light
          then:
            - globals.set:
                id: screen_was_off
                value: 'false'
          else:
            - globals.set:
                id: screen_was_off
                value: 'true'

      - light.turn_on:
          id: back_light
          brightness: 100%

      # STAP 2: een aanraking die het scherm uit stand-by haalde brengt de
      # UI ook terug naar de hoofdpagina.
      - if:
          condition:
            lambda: 'return id(screen_was_off);'
          then:
            - script.execute: return_to_main_page_now

      - script.execute: return_to_main_page

      - delay: !lambda 'return id(screen_timeout) * 1000;'
      - script.execute: update_screen_state

  # Automatische terugkeer: 30s na de laatste aanraking terug van de
  # instellingenpagina naar de hoofdpagina.
  - id: return_to_main_page
    mode: restart
    then:
      - delay: 30s
      # is_showing() is de eigen accessor van LvPageType. lv_scr_act()
      # vergelijken met id(main_page) compileert NIET.
      - if:
          condition:
            lambda: 'return !id(main_page)->is_showing();'
          then:
            - script.execute: return_to_main_page_now

  - id: return_to_main_page_now
    then:
      - lvgl.page.show: main_page

  # Kleurt de ventilatorknoppen. Donkerblauw = actieve stand.
  #   - ventilator uit            -> knop 0
  #   - aan, "Level 1".."Level 4" -> knop 1..4
  # Zolang de aan/uit-state nog onbekend is (vlak na boot) wordt alleen
  # naar de level gekeken.
  - id: update_vent_buttons
    then:
      - lvgl.widget.update:
          id: btn_vent_0
          bg_color: !lambda |-
            bool off = id(ha_vent_power).has_state() && !id(ha_vent_power).state;
            return lv_color_hex(off ? 0x005782 : 0x2F8CD8);
      - lvgl.widget.update:
          id: btn_vent_1
          bg_color: !lambda |-
            bool off = id(ha_vent_power).has_state() && !id(ha_vent_power).state;
            return lv_color_hex(!off && id(ha_vent_level).state == "Level 1" ? 0x005782 : 0x2F8CD8);
      - lvgl.widget.update:
          id: btn_vent_2
          bg_color: !lambda |-
            bool off = id(ha_vent_power).has_state() && !id(ha_vent_power).state;
            return lv_color_hex(!off && id(ha_vent_level).state == "Level 2" ? 0x005782 : 0x2F8CD8);
      - lvgl.widget.update:
          id: btn_vent_3
          bg_color: !lambda |-
            bool off = id(ha_vent_power).has_state() && !id(ha_vent_power).state;
            return lv_color_hex(!off && id(ha_vent_level).state == "Level 3" ? 0x005782 : 0x2F8CD8);
      - lvgl.widget.update:
          id: btn_vent_4
          bg_color: !lambda |-
            bool off = id(ha_vent_power).has_state() && !id(ha_vent_power).state;
            return lv_color_hex(!off && id(ha_vent_level).state == "Level 4" ? 0x005782 : 0x2F8CD8);

  # =========================
  # HA HELPER GEZONDHEIDSCHECK
  # =========================
  # Op de Master Bedroom verwijderde een corrupte HA-database ooit een
  # aantal input_* helpers, zonder dat het paneel dat liet zien. Dit
  # script rapporteert ontbrekende helpers op de instellingenpagina en
  # als diagnostische binary_sensor in HA.
  #
  # BEPERKING: has_state() vangt alleen helpers die NOOIT gerapporteerd
  # hebben, niet een helper die verdwijnt terwijl het paneel draait.
  - id: evaluate_helper_health
    mode: restart
    then:
      - lambda: |-
          struct HelperCheck {
            const char *label;
            bool present;
          };
          const HelperCheck checks[] = {
            {"Open",  id(ha_cover_open_time).has_state()},
            {"Dicht", id(ha_cover_close_time).has_state()},
          };
          const int total = sizeof(checks) / sizeof(checks[0]);

          int missing = 0;
          std::string names;
          for (int i = 0; i < total; i++) {
            if (!checks[i].present) {
              missing++;
              if (!names.empty()) names += ", ";
              names += checks[i].label;
            }
          }
          id(helpers_missing_count) = missing;

          char buf[48];
          if (missing == 0) {
            snprintf(buf, sizeof(buf), "Instellingen OK (%d/%d)", total, total);
            id(helpers_status_text) = buf;
          } else {
            snprintf(buf, sizeof(buf), "%d/%d ontbreekt: ", missing, total);
            id(helpers_status_text) = std::string(buf) + names;
            ESP_LOGW("ha_helpers", "%d van %d HA-helpers ontbreken: %s",
                     missing, total, names.c_str());
          }
      - lvgl.label.update:
          id: lbl_settings_status
          text: !lambda 'return id(helpers_status_text);'
          text_color: !lambda 'return lv_color_hex(id(helpers_missing_count) > 0 ? 0xC62828 : 0x4CAF50);'

  # Wat de Check-knop draait: eerst rapporteren, dan opnieuw toepassen.
  - id: check_ha_settings
    mode: restart
    then:
      - script.execute: evaluate_helper_health
      - script.execute: sync_settings_from_ha

  # Pas de gecachete HA-state opnieuw toe op de widgets. HOME ASSISTANT
  # WINT, ALTIJD: dit schrijft alleen HA-state naar de widgets, nooit
  # andersom.
  - id: sync_settings_from_ha
    mode: restart
    then:
      - script.execute: update_close_time_buttons
      - script.execute: update_open_time_buttons
      - script.execute: update_vent_buttons

      - if:
          condition:
            lambda: 'return id(ha_climate_setpoint).has_state();'
          then:
            - globals.set:
                id: climate_setpoint_value
                value: !lambda 'return id(ha_climate_setpoint).state;'
            - lvgl.label.update:
                id: climate_setpoint_label
                text: !lambda |-
                  char buf[16];
                  snprintf(buf, sizeof(buf), "%.1f °C", id(ha_climate_setpoint).state);
                  return buf;

      # Lichtschakelaars. Onder de guard, want lvgl.widget.update vuurt
      # hun on_value af (esphome/esphome#17161).
      - lambda: 'id(mirroring_light_switches) = true;'
      - if:
          condition:
            lambda: 'return id(ceiling_light_on).has_state();'
          then:
            - lvgl.widget.update:
                id: switch_licht_kamer
                state:
                  checked: !lambda 'return id(ceiling_light_on).state;'
                shadow_width: !lambda 'return id(ceiling_light_on).state ? 15 : 0;'
      - if:
          condition:
            lambda: 'return id(ha_licht_bed).has_state();'
          then:
            - lvgl.widget.update:
                id: switch_licht_bed
                state:
                  checked: !lambda 'return id(ha_licht_bed).state;'
                shadow_width: !lambda 'return id(ha_licht_bed).state ? 15 : 0;'
      - lambda: 'id(mirroring_light_switches) = false;'

  # Kleurt de gordijn-sluittijdknoppen. Donkerblauw = de tijd die in Home
  # Assistant geselecteerd staat, standaardblauw = de rest.
  - id: update_close_time_buttons
    then:
      - lvgl.widget.update:
          id: btn_dicht_2100
          bg_color: !lambda 'return lv_color_hex(id(ha_cover_close_time).state == "21:00" ? 0x005782 : 0x2F8CD8);'
      - lvgl.widget.update:
          id: btn_dicht_2130
          bg_color: !lambda 'return lv_color_hex(id(ha_cover_close_time).state == "21:30" ? 0x005782 : 0x2F8CD8);'
      - lvgl.widget.update:
          id: btn_dicht_2200
          bg_color: !lambda 'return lv_color_hex(id(ha_cover_close_time).state == "22:00" ? 0x005782 : 0x2F8CD8);'
      - lvgl.widget.update:
          id: btn_dicht_2230
          bg_color: !lambda 'return lv_color_hex(id(ha_cover_close_time).state == "22:30" ? 0x005782 : 0x2F8CD8);'

  - id: update_open_time_buttons
    then:
      - lvgl.widget.update:
          id: btn_open_0700
          bg_color: !lambda 'return lv_color_hex(id(ha_cover_open_time).state == "7:00" ? 0x005782 : 0x2F8CD8);'
      - lvgl.widget.update:
          id: btn_open_0730
          bg_color: !lambda 'return lv_color_hex(id(ha_cover_open_time).state == "7:30" ? 0x005782 : 0x2F8CD8);'
      - lvgl.widget.update:
          id: btn_open_0800
          bg_color: !lambda 'return lv_color_hex(id(ha_cover_open_time).state == "8:00" ? 0x005782 : 0x2F8CD8);'
      - lvgl.widget.update:
          id: btn_open_0830
          bg_color: !lambda 'return lv_color_hex(id(ha_cover_open_time).state == "8:30" ? 0x005782 : 0x2F8CD8);'
      - lvgl.widget.update:
          id: btn_open_0900
          bg_color: !lambda 'return lv_color_hex(id(ha_cover_open_time).state == "9:00" ? 0x005782 : 0x2F8CD8);'
      - lvgl.widget.update:
          id: btn_open_0930
          bg_color: !lambda 'return lv_color_hex(id(ha_cover_open_time).state == "9:30" ? 0x005782 : 0x2F8CD8);'

  # Stuurt de twee statusiconen in de header op beide pagina's, en de
  # enabled-state van de Check-knop.
  - id: update_connectivity_icons
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - lvgl.label.update:
                id: lbl_wifistatus
                text: "\U000F05A9"
                text_color: 0xFFFFFF
            - lvgl.label.update:
                id: lbl_wifistatus_2
                text: "\U000F05A9"
                text_color: 0xFFFFFF
          else:
            - lvgl.label.update:
                id: lbl_wifistatus
                text: "\U000F16B5"
                text_color: 0xFF0000
            - lvgl.label.update:
                id: lbl_wifistatus_2
                text: "\U000F16B5"
                text_color: 0xFF0000
      - if:
          condition:
            api.connected:
          then:
            - lvgl.widget.update:
                id: lbl_hastatus
                text_color: 0xFFFFFF
            - lvgl.widget.update:
                id: lbl_hastatus_2
                text_color: 0xFFFFFF
            - lvgl.widget.update:
                id: btn_check_settings
                state:
                  disabled: false
          else:
            - lvgl.widget.update:
                id: lbl_hastatus
                text_color: 0xFF0000
            - lvgl.widget.update:
                id: lbl_hastatus_2
                text_color: 0xFF0000
            - lvgl.widget.update:
                id: btn_check_settings
                state:
                  disabled: true

# =========================
# INTERVALS
# =========================
interval:
  - interval: 5s
    then:
      - script.execute: update_connectivity_icons

  # Proactieve helpercheck. Bewust evaluate_helper_health en NIET
  # check_ha_settings: dit mag niet naar de widgets schrijven.
  - interval: 60s
    then:
      - script.execute: evaluate_helper_health

# =========================
# TEXT SENSORS
# =========================
text_sensor:
  - platform: homeassistant
    id: ha_weather_condition
    entity_id: weather.openweathermap
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_weather_condition
            text: !lambda |-
              std::map<std::string, std::string> namen = {
                {"clear-night",     "Heldere nacht"},
                {"cloudy",          "Bewolkt"},
                {"exceptional",     "Uitzonderlijk"},
                {"fog",             "Mist"},
                {"hail",            "Hagel"},
                {"lightning",       "Onweer"},
                {"lightning-rainy", "Onweer en regen"},
                {"partlycloudy",    "Half bewolkt"},
                {"pouring",         "Stortregen"},
                {"rainy",           "Regen"},
                {"snowy",           "Sneeuw"},
                {"snowy-rainy",     "Natte sneeuw"},
                {"sunny",           "Zonnig"},
                {"windy",           "Winderig"},
                {"windy-variant",   "Winderig"}
              };
              std::string c = x;
              if (namen.count(c)) return namen[c];
              return c;

        - lvgl.label.update:
            id: lbl_weather_icon
            text: !lambda |-
              std::map<std::string, std::string> weather_icons = {
                {"clear-night",     "\U000F0594"},
                {"cloudy",          "\U000F0590"},
                {"exceptional",     "\U000F0F2F"},
                {"fog",             "\U000F0591"},
                {"hail",            "\U000F0592"},
                {"lightning",       "\U000F0593"},
                {"lightning-rainy", "\U000F067E"},
                {"partlycloudy",    "\U000F0595"},
                {"pouring",         "\U000F0596"},
                {"rainy",           "\U000F0597"},
                {"snowy",           "\U000F0598"},
                {"snowy-rainy",     "\U000F067F"},
                {"sunny",           "\U000F0599"},
                {"windy",           "\U000F059D"},
                {"windy-variant",   "\U000F059E"}
              };
              std::string c = x;
              if (weather_icons.count(c)) return weather_icons[c];
              return std::string("\U000F0599");

  # Gordijnen: geselecteerde openingstijd.
  - platform: homeassistant
    id: ha_cover_open_time
    entity_id: input_select.cover_bedroom_tim_open_time
    on_value:
      then:
        - script.execute: update_open_time_buttons

  # Gordijnen: geselecteerde sluitingstijd.
  - platform: homeassistant
    id: ha_cover_close_time
    entity_id: input_select.cover_bedroom_tim_close_time
    on_value:
      then:
        - script.execute: update_close_time_buttons

  # Ventilator: huidige stand ("Level 1".."Level 4").
  - platform: homeassistant
    id: ha_vent_level
    entity_id: select.zhimi_za4_f804_gear_fan_level
    on_value:
      then:
        - script.execute: update_vent_buttons

  # Agenda: zeven regels uit de attributen regel_1..regel_7 van de HA
  # template sensor sensor.agenda_tim (vandaag en morgen uit
  # calendar.gijs_tim). Een lege regel is gewoon een lege string.
  - platform: homeassistant
    id: ha_agenda_1
    entity_id: sensor.agenda_tim
    attribute: regel_1
    on_value:
      - lvgl.label.update:
          id: lbl_agenda_1
          text: !lambda 'return x;'

  - platform: homeassistant
    id: ha_agenda_2
    entity_id: sensor.agenda_tim
    attribute: regel_2
    on_value:
      - lvgl.label.update:
          id: lbl_agenda_2
          text: !lambda 'return x;'

  - platform: homeassistant
    id: ha_agenda_3
    entity_id: sensor.agenda_tim
    attribute: regel_3
    on_value:
      - lvgl.label.update:
          id: lbl_agenda_3
          text: !lambda 'return x;'

  - platform: homeassistant
    id: ha_agenda_4
    entity_id: sensor.agenda_tim
    attribute: regel_4
    on_value:
      - lvgl.label.update:
          id: lbl_agenda_4
          text: !lambda 'return x;'

  - platform: homeassistant
    id: ha_agenda_5
    entity_id: sensor.agenda_tim
    attribute: regel_5
    on_value:
      - lvgl.label.update:
          id: lbl_agenda_5
          text: !lambda 'return x;'

  - platform: homeassistant
    id: ha_agenda_6
    entity_id: sensor.agenda_tim
    attribute: regel_6
    on_value:
      - lvgl.label.update:
          id: lbl_agenda_6
          text: !lambda 'return x;'

  - platform: homeassistant
    id: ha_agenda_7
    entity_id: sensor.agenda_tim
    attribute: regel_7
    on_value:
      - lvgl.label.update:
          id: lbl_agenda_7
          text: !lambda 'return x;'

# =========================
# BINARY SENSORS
# =========================
binary_sensor:
  - platform: status
    name: "${friendly_name} Status"

  # Maakt de helpercheck zichtbaar in Home Assistant. Rapporteert false
  # tot de eerste evaluatie klaar is (helpers_missing_count start op -1).
  - platform: template
    name: "${friendly_name} HA Helpers Missing"
    id: ha_helpers_missing
    device_class: problem
    entity_category: "diagnostic"
    lambda: 'return id(helpers_missing_count) > 0;'

  # Plafondlamp (Shelly). Stuurt de schakelaar, het lampicoon en het
  # scherm.
  - platform: homeassistant
    id: ceiling_light_on
    entity_id: switch.shelly1_tim_shelly1_shelly1_tim
    on_state:
      then:
        - lambda: 'id(mirroring_light_switches) = true;'
        - lvgl.widget.update:
            id: switch_licht_kamer
            state:
              checked: !lambda return x;
            shadow_width: !lambda 'return x ? 15 : 0;'
        - lvgl.label.update:
            id: lbl_bulb_kamer
            text: !lambda 'return std::string(x ? "\U000F0335" : "\U000F0336");'
            text_color: !lambda 'return lv_color_hex(x ? 0xFDB813 : 0xBBBBBB);'
        - lambda: 'id(mirroring_light_switches) = false;'
        - script.execute: update_screen_state

  # Bedlamp (Sonoff).
  - platform: homeassistant
    id: ha_licht_bed
    entity_id: switch.sonoff_tim_sonoff_tim
    on_state:
      then:
        - lambda: 'id(mirroring_light_switches) = true;'
        - lvgl.widget.update:
            id: switch_licht_bed
            state:
              checked: !lambda return x;
            shadow_width: !lambda 'return x ? 15 : 0;'
        - lvgl.label.update:
            id: lbl_bulb_bed
            text: !lambda 'return std::string(x ? "\U000F0335" : "\U000F0336");'
            text_color: !lambda 'return lv_color_hex(x ? 0xFDB813 : 0xBBBBBB);'
        - lambda: 'id(mirroring_light_switches) = false;'

  # Ventilator aan/uit.
  - platform: homeassistant
    id: ha_vent_power
    entity_id: fan.zhimi_za4_f804_fan
    on_state:
      then:
        - script.execute: update_vent_buttons

# =========================
# SENSORS
# =========================
sensor:
  - platform: homeassistant
    id: ha_weather_temp_now
    entity_id: weather.openweathermap
    attribute: temperature
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_weather_temp
            text: !lambda |-
              char buf[16];
              snprintf(buf, sizeof(buf), "%.1f °C", x);
              return buf;

  - platform: homeassistant
    id: ha_weather_feels_like
    entity_id: weather.openweathermap
    attribute: apparent_temperature
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_weather_feels
            text: !lambda |-
              char buf[24];
              snprintf(buf, sizeof(buf), "voelt als %.1f °C", x);
              return buf;

  # Setpoint van HA naar het display. Overschrijft ook
  # climate_setpoint_value, zodat de +/- knoppen altijd verder rekenen
  # vanaf wat de thermostaat werkelijk doet.
  - platform: homeassistant
    id: ha_climate_setpoint
    entity_id: climate.virtual_thermostat_room_tim
    attribute: temperature
    on_value:
      then:
        - globals.set:
            id: climate_setpoint_value
            value: !lambda 'return x;'
        - lvgl.label.update:
            id: climate_setpoint_label
            text: !lambda |-
              char buf[16];
              snprintf(buf, sizeof(buf), "%.1f °C", x);
              return buf;

  - platform: homeassistant
    id: ha_climate_current_temp
    entity_id: climate.virtual_thermostat_room_tim
    attribute: current_temperature
    on_value:
      then:
        - lvgl.label.update:
            id: climate_current_temp
            text: !lambda |-
              char buf[16];
              snprintf(buf, sizeof(buf), "%.1f °C", x);
              return buf;
