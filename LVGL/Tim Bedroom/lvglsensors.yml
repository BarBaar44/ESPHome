# =========================
# BINARY SENSORS
# =========================
binary_sensor:
  - platform: status
    name: "${friendly_name} Status"

  # Maakt de helpercheck zichtbaar in Home Assistant, zodat een
  # ontbrekende helper een melding kan geven in plaats van te wachten
  # tot iemand het paneel bekijkt. device_class: problem laat HA dit
  # renderen als OK / Probleem in plaats van uit / aan.
  #
  # Rapporteert false tot de eerste evaluatie klaar is
  # (helpers_missing_count start op -1), zodat een normale boot geen
  # loos alarm afvuurt.
  - platform: template
    name: "${friendly_name} HA Helpers Missing"
    id: ha_helpers_missing
    device_class: problem
    entity_category: "diagnostic"
    lambda: 'return id(helpers_missing_count) > 0;'

  # Bewegingssensor - stuurt de backlight aan.
  - platform: homeassistant
    id: motion_occupancy
    entity_id: ${ent_beweging}
    on_state:
      then:
        - script.execute: update_screen_state

  # Plafondlamp. Stuurt de schakelaar, het lampicoon en het scherm.
  - platform: homeassistant
    id: ceiling_light_on
    entity_id: ${ent_licht_kamer}
    on_state:
      then:
        - lambda: 'id(mirroring_light_switches) = true;'
        - lvgl.widget.update:
            id: switch_licht_kamer
            state:
              checked: !lambda return x;
            shadow_width: !lambda 'return x ? 15 : 0;'
        - lvgl.label.update:
            id: lbl_bulb_kamer
            text: !lambda 'return std::string(x ? "\U000F0335" : "\U000F0336");'
            text_color: !lambda 'return lv_color_hex(x ? 0xFDB813 : 0xBBBBBB);'
        - lambda: 'id(mirroring_light_switches) = false;'
        - script.execute: update_screen_state

  # Bedlamp.
  - platform: homeassistant
    id: ha_licht_bed
    entity_id: ${ent_licht_bed}
    on_state:
      then:
        - lambda: 'id(mirroring_light_switches) = true;'
        - lvgl.widget.update:
            id: switch_licht_bed
            state:
              checked: !lambda return x;
            shadow_width: !lambda 'return x ? 15 : 0;'
        - lvgl.label.update:
            id: lbl_bulb_bed
            text: !lambda 'return std::string(x ? "\U000F0335" : "\U000F0336");'
            text_color: !lambda 'return lv_color_hex(x ? 0xFDB813 : 0xBBBBBB);'
        - lambda: 'id(mirroring_light_switches) = false;'

# =========================
# SENSORS
# =========================
sensor:
  # Omgevingslicht (lux). Stuurt de helderheid van de backlight via
  # apply_brightness.
  - platform: homeassistant
    id: ha_room_illuminance
    entity_id: ${ent_lux}
    on_value:
      then:
        - script.execute: apply_brightness

  # Ventilatorsnelheid uit het percentage-attribuut van de fan zelf, NIET
  # uit een off/low/mid/high text sensor - deze ventilator kent alleen
  # 0/25/50/75/100%. Kleurt de actieve knop, ongeacht wie de fan
  # schakelde: het paneel, de fysieke afstandsbediening of een
  # HA-automatisering.
  - platform: homeassistant
    id: ha_vent_percentage
    entity_id: ${ent_ventilator}
    attribute: percentage
    on_value:
      then:
        - lvgl.widget.update:
            id: [btn_vent_0, btn_vent_1, btn_vent_2, btn_vent_3, btn_vent_4]
            bg_color: 0x2F8CD8
            bg_opa: COVER
        - if:
            condition:
              lambda: 'return x == 0;'
            then:
              - lvgl.widget.update:
                  id: btn_vent_0
                  bg_color: 0x005782
        - if:
            condition:
              lambda: 'return x > 0 && x <= 25;'
            then:
              - lvgl.widget.update:
                  id: btn_vent_1
                  bg_color: 0x005782
        - if:
            condition:
              lambda: 'return x > 25 && x <= 50;'
            then:
              - lvgl.widget.update:
                  id: btn_vent_2
                  bg_color: 0x005782
        - if:
            condition:
              lambda: 'return x > 50 && x <= 75;'
            then:
              - lvgl.widget.update:
                  id: btn_vent_3
                  bg_color: 0x005782
        - if:
            condition:
              lambda: 'return x > 75;'
            then:
              - lvgl.widget.update:
                  id: btn_vent_4
                  bg_color: 0x005782

  - platform: homeassistant
    id: ha_weather_temp_now
    entity_id: ${ent_weer}
    attribute: temperature
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_weather_temp
            text: !lambda |-
              char buf[16];
              snprintf(buf, sizeof(buf), "%.1f °C", x);
              return buf;

  - platform: homeassistant
    id: ha_weather_feels_like
    entity_id: ${ent_weer}
    attribute: apparent_temperature
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_weather_feels
            text: !lambda |-
              char buf[24];
              snprintf(buf, sizeof(buf), "voelt als %.1f °C", x);
              return buf;

  # Setpoint van HA naar het display. Overschrijft ook
  # climate_setpoint_value, zodat de +/- knoppen altijd verder rekenen
  # vanaf wat de thermostaat werkelijk doet.
  - platform: homeassistant
    id: ha_climate_setpoint
    entity_id: ${ent_klimaat}
    attribute: temperature
    on_value:
      then:
        - globals.set:
            id: climate_setpoint_value
            value: !lambda 'return x;'
        - lvgl.label.update:
            id: climate_setpoint_label
            text: !lambda |-
              char buf[16];
              snprintf(buf, sizeof(buf), "%.1f °C", x);
              return buf;

  - platform: homeassistant
    id: ha_climate_current_temp
    entity_id: ${ent_klimaat}
    attribute: current_temperature
    on_value:
      then:
        - lvgl.label.update:
            id: climate_current_temp
            text: !lambda |-
              char buf[16];
              snprintf(buf, sizeof(buf), "%.1f °C", x);
              return buf;
