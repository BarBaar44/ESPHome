                                    id: btn_vent_4
                                    flex_grow: 1
                                    height: 46
                                    bg_color: 0x2F8CD8
                                    bg_opa: COVER
                                    widgets:
                                      - label:
                                          text: "4"
                                          align: CENTER
                                          text_font: montserrat_20
                                    on_click:
                                      - homeassistant.action:
                                          action: fan.set_percentage
                                          data:
                                            entity_id: ${ent_ventilator}
                                            percentage: "100"

                    # =========================
                    # GORDIJNEN
                    #
                    # Een gedeeld vak in plaats van twee losse omkaderde
                    # vakken: dicht boven, een dunne scheidingslijn, open
                    # onder. Dat geeft de open-tijdenrij (zes knoppen)
                    # meer ademruimte dan twee even grote losse vakken
                    # zouden bieden. Elke helft heeft een directe
                    # bedieningsknop (Sluit nu / Open nu) los van het
                    # tijdschema, plus de tijdknoppen zelf.
                    #
                    # De tijdknoppen zijn bewust NIET checkable. Een
                    # checkable knop schakelt zichzelf om bij aanraking en
                    # wordt daarna alsnog overschreven zodra HA de
                    # werkelijke waarde terugstuurt; bij snel tikken zie
                    # je dan twee knoppen oplichten. Nu stuurt een tik
                    # alleen de input_select-actie, en bepaalt de HA-state
                    # welke knop gekleurd is (zie update_close_time_buttons
                    # en update_open_time_buttons in lvglsensors.yml).
                    # Home Assistant is de enige bron van waarheid.
                    # =========================
                    - obj:
                        id: cover_obj
                        bg_color: 0xFFFFFF
                        radius: 6
                        pad_all: 10
                        scrollable: false
                        scrollbar_mode: "off"

                        grid_cell_row_pos: 2
                        grid_cell_column_pos: 0
                        grid_cell_column_span: 2
                        grid_cell_x_align: STRETCH
                        grid_cell_y_align: STRETCH

                        layout:
                          type: FLEX
                          flex_flow: COLUMN
                          flex_align_main: START
                          flex_align_cross: STRETCH
                          pad_row: 6

                        widgets:
                          - label:
                              text: "Gordijnen"
                              text_font: montserrat_16
                              text_color: 0x0B0A0A

                          # ---- groep: dicht ----
                          - obj:
                              width: 100%
                              flex_grow: 1
                              bg_opa: TRANSP
                              border_width: 0
                              pad_all: 0
                              scrollable: false
                              scrollbar_mode: "off"
                              layout:
                                type: FLEX
                                flex_flow: COLUMN
                                flex_align_main: SPACE_BETWEEN
                                flex_align_cross: STRETCH
                                pad_row: 4

                              widgets:
                                - obj:
                                    width: 100%
                                    height: 22
                                    bg_opa: TRANSP
                                    border_width: 0
                                    pad_all: 0
                                    scrollable: false
                                    scrollbar_mode: "off"
                                    layout:
                                      type: FLEX
                                      flex_flow: ROW
                                      flex_align_main: SPACE_BETWEEN
                                      flex_align_cross: CENTER
                                    widgets:
                                      - label:
                                          text: "dicht"
                                          text_font: montserrat_14
                                          text_color: 0x666666
                                      - button:
                                          id: btn_gordijn_sluit_nu
                                          width: 96
                                          height: 22
                                          bg_color: 0x005782
                                          bg_opa: COVER
                                          widgets:
                                            - label:
                                                text: "Sluit nu"
                                                align: CENTER
                                                text_font: montserrat_12
                                          on_click:
                                            - homeassistant.action:
                                                action: cover.close_cover
                                                data:
                                                  entity_id: ${ent_gordijn}

                                - obj:
                                    width: 100%
                                    flex_grow: 1
                                    bg_opa: TRANSP
                                    border_width: 0
                                    pad_all: 0
                                    scrollable: false
                                    scrollbar_mode: "off"
                                    layout:
                                      type: FLEX
                                      flex_flow: ROW
                                      flex_align_main: SPACE_EVENLY
                                      flex_align_cross: CENTER
                                      pad_column: 6
                                    widgets:
                                      - button:
                                          id: btn_dicht_2100
                                          flex_grow: 1
                                          height: 40
                                          bg_color: 0x2F8CD8
                                          bg_opa: COVER
                                          widgets:
                                            - label:
                                                text: "21:00"
                                                align: CENTER
                                                text_font: montserrat_16
                                          on_click:
                                            - homeassistant.action:
                                                action: input_select.select_option
                                                data:
                                                  entity_id: ${ent_tijd_dicht}
                                                  option: "21:00"

                                      - button:
                                          id: btn_dicht_2130
                                          flex_grow: 1
                                          height: 40
                                          bg_color: 0x2F8CD8
                                          bg_opa: COVER
                                          widgets:
                                            - label:
                                                text: "21:30"
                                                align: CENTER
                                                text_font: montserrat_16
                                          on_click:
                                            - homeassistant.action:
                                                action: input_select.select_option
                                                data:
                                                  entity_id: ${ent_tijd_dicht}
                                                  option: "21:30"

                                      - button:
                                          id: btn_dicht_2200
                                          flex_grow: 1
                                          height: 40
                                          bg_color: 0x2F8CD8
                                          bg_opa: COVER
                                          widgets:
                                            - label:
                                                text: "22:00"
                                                align: CENTER
                                                text_font: montserrat_16
                                          on_click:
                                            - homeassistant.action:
                                                action: input_select.select_option
                                                data:
                                                  entity_id: ${ent_tijd_dicht}
                                                  option: "22:00"

                                      - button:
                                          id: btn_dicht_2230
                                          flex_grow: 1
                                          height: 40
                                          bg_color: 0x2F8CD8
                                          bg_opa: COVER
                                          widgets:
                                            - label:
                                                text: "22:30"
                                                align: CENTER
                                                text_font: montserrat_16
                                          on_click:
                                            - homeassistant.action:
                                                action: input_select.select_option
                                                data:
                                                  entity_id: ${ent_tijd_dicht}
                                                  option: "22:30"

                          # ---- dunne scheidingslijn tussen dicht en open ----
                          - obj:
                              width: 100%
                              height: 1
                              bg_color: 0xE5E7EA
                              bg_opa: COVER
                              border_width: 0
                              pad_all: 0
                              scrollable: false
                              scrollbar_mode: "off"

                          # ---- groep: open ----
                          - obj:
                              width: 100%
                              flex_grow: 1
                              bg_opa: TRANSP
                              border_width: 0
                              pad_all: 0
                              scrollable: false
                              scrollbar_mode: "off"
                              layout:
                                type: FLEX
                                flex_flow: COLUMN
                                flex_align_main: SPACE_BETWEEN
                                flex_align_cross: STRETCH
                                pad_row: 4

                              widgets:
                                - obj:
                                    width: 100%
                                    height: 22
                                    bg_opa: TRANSP
                                    border_width: 0
                                    pad_all: 0
                                    scrollable: false
                                    scrollbar_mode: "off"
                                    layout:
                                      type: FLEX
                                      flex_flow: ROW
                                      flex_align_main: SPACE_BETWEEN
                                      flex_align_cross: CENTER
                                    widgets:
                                      - label:
                                          text: "open"
                                          text_font: montserrat_14
                                          text_color: 0x666666
                                      - button:
                                          id: btn_gordijn_open_nu
                                          width: 96
                                          height: 22
                                          bg_color: 0x005782
                                          bg_opa: COVER
                                          widgets:
                                            - label:
                                                text: "Open nu"
                                                align: CENTER
                                                text_font: montserrat_12
                                          on_click:
                                            - homeassistant.action:
                                                action: cover.open_cover
                                                data:
                                                  entity_id: ${ent_gordijn}

                                - obj:
                                    width: 100%
                                    flex_grow: 1
                                    bg_opa: TRANSP
                                    border_width: 0
                                    pad_all: 0
                                    scrollable: false
                                    scrollbar_mode: "off"
                                    layout:
                                      type: FLEX
                                      flex_flow: ROW
                                      flex_align_main: SPACE_EVENLY
                                      flex_align_cross: CENTER
                                      pad_column: 4
                                    widgets:
                                      - button:
                                          id: btn_open_0700
                                          flex_grow: 1
                                          height: 40
                                          bg_color: 0x2F8CD8
                                          bg_opa: COVER
                                          widgets:
                                            - label:
                                                text: "7:00"
                                                align: CENTER
                                                text_font: montserrat_14
                                          on_click:
                                            - homeassistant.action:
                                                action: input_select.select_option
                                                data:
                                                  entity_id: ${ent_tijd_open}
                                                  option: "7:00"

                                      - button:
                                          id: btn_open_0730
                                          flex_grow: 1
                                          height: 40
                                          bg_color: 0x2F8CD8
                                          bg_opa: COVER
                                          widgets:
                                            - label:
                                                text: "7:30"
                                                align: CENTER
                                                text_font: montserrat_14
                                          on_click:
                                            - homeassistant.action:
                                                action: input_select.select_option
                                                data:
                                                  entity_id: ${ent_tijd_open}
                                                  option: "7:30"

                                      - button:
                                          id: btn_open_0800
                                          flex_grow: 1
                                          height: 40
                                          bg_color: 0x2F8CD8
                                          bg_opa: COVER
                                          widgets:
                                            - label:
                                                text: "8:00"
                                                align: CENTER
                                                text_font: montserrat_14
                                          on_click:
                                            - homeassistant.action:
                                                action: input_select.select_option
                                                data:
                                                  entity_id: ${ent_tijd_open}
                                                  option: "8:00"

                                      - button:
                                          id: btn_open_0830
                                          flex_grow: 1
                                          height: 40
                                          bg_color: 0x2F8CD8
                                          bg_opa: COVER
                                          widgets:
                                            - label:
                                                text: "8:30"
                                                align: CENTER
                                                text_font: montserrat_14
                                          on_click:
                                            - homeassistant.action:
                                                action: input_select.select_option
                                                data:
                                                  entity_id: ${ent_tijd_open}
                                                  option: "8:30"

                                      - button:
                                          id: btn_open_0900
                                          flex_grow: 1
                                          height: 40
                                          bg_color: 0x2F8CD8
                                          bg_opa: COVER
                                          widgets:
                                            - label:
                                                text: "9:00"
                                                align: CENTER
                                                text_font: montserrat_14
                                          on_click:
                                            - homeassistant.action:
                                                action: input_select.select_option
                                                data:
                                                  entity_id: ${ent_tijd_open}
                                                  option: "9:00"

                                      - button:
                                          id: btn_open_0930
                                          flex_grow: 1
                                          height: 40
                                          bg_color: 0x2F8CD8
                                          bg_opa: COVER
                                          widgets:
                                            - label:
                                                text: "9:30"
                                                align: CENTER
                                                text_font: montserrat_14
                                          on_click:
                                            - homeassistant.action:
                                                action: input_select.select_option
                                                data:
                                                  entity_id: ${ent_tijd_open}
                                                  option: "9:30"

    # =========================
    # TWEEDE PAGINA - SYSTEEM EN INSTELLINGEN
    #
    # Overgenomen van second_page van de Master Bedroom, zonder de
    # woonkamerlamp en zonder de cover-positie dropdowns (dit paneel
    # heeft geen pre-open / door-open logica).
    # =========================
    - id: second_page
      bg_color: 0x0B0A0A
      pad_all: 0
      scrollable: false
      scrollbar_mode: "off"

      widgets:

        - obj:
            align: TOP_MID
            styles: header_footer
            width: 100%
            height: 40
            scrollable: false
            scrollbar_mode: "off"

            widgets:
              - label:
                  text: "Instellingen"
                  align: CENTER
                  text_font: montserrat_22
                  text_color: 0xFFFFFF

              # LVGL widget-ids zijn per pagina, dus de wifi/HA labels van
              # main_page kunnen hier niet hergebruikt worden. Dit zijn
              # aparte widgets die update_connectivity_icons gelijk houdt
              # met hun tegenhangers op de hoofdpagina.
              - label:
                  text: "\U000F05A9"
                  id: lbl_wifistatus_2
                  align: RIGHT_MID
                  x: -55
                  text_font: icons_24
                  text_color: 0xFFFFFF

              - label:
                  text: "\U000F07D0"
                  id: lbl_hastatus_2
                  align: RIGHT_MID
                  x: -15
                  text_font: icons_24
                  text_color: 0xFFFFFF

              - button:
                  align: LEFT_MID
                  x: 5
                  width: 40
                  height: 34
                  bg_opa: TRANSP
                  shadow_width: 0
                  widgets:
                    - label:
                        text: "\U000F0141"
                        align: CENTER
                        text_font: icons_24
                        text_color: 0xFFFFFF
                  on_click:
                    - lvgl.page.show: main_page

        - obj:
            id: main_grid_2
            x: 0
            y: 40
            width: 800
            height: 440
            bg_color: 0xD3D6D9
            pad_all: 8
            scrollable: false
            scrollbar_mode: "off"

            layout:
              type: GRID
              pad_row: 8
              pad_column: 8
              grid_rows:
                - FR(1)
              grid_columns:
                - FR(1)
                - FR(1)

            widgets:

              # =========================
              # SYSTEEM
              #
              # Draagt ook de twee statusregels: de uitkomst van de
              # helper-gezondheidscheck en de ESPHome-versie. Beide gaan
              # over het paneel en zijn verbinding met HA, dus ze horen
              # bij de knoppen die daarop ingrijpen.
              # =========================
              - obj:
                  id: system_buttons_obj
                  bg_color: 0xFFFFFF
                  radius: 6
                  pad_all: 10
                  scrollable: false
                  scrollbar_mode: "off"

                  grid_cell_row_pos: 0
                  grid_cell_column_pos: 0
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH

                  widgets:
                    - label:
                        text: "Systeem"
                        align: TOP_LEFT
                        x: 0
                        y: 0
                        text_font: montserrat_20
                        text_color: 0x0B0A0A

                    # Controleert of de HA-helpers echt bestaan en past
                    # hun waarden opnieuw toe. Start DISABLED: bij boot is
                    # de API nog niet verbonden en is er dus geen gecachete
                    # state om te beoordelen. update_connectivity_icons
                    # zet hem aan zodra de API er is.
                    - button:
                        id: btn_check_settings
                        width: 140
                        height: 46
                        x: -80
                        y: -10
                        align: CENTER
                        state:
                          disabled: true
                        widgets:
                          - label:
                              text: "Check HA"
                              align: CENTER
                              text_font: montserrat_14
                        on_click:
                          - script.execute: check_ha_settings

                    # Herstart het paneel. Rood en bewust niet naast de
                    # Check-knop: de restart-platform reboot direct, er is
                    # geen bevestigingsstap.
                    #
                    # Bewust NIET afhankelijk van api.connected: rebooten
                    # heeft niets van HA nodig en is juist nuttig als de
                    # API-verbinding stuk is.
                    - button:
                        id: btn_reboot_display
                        width: 140
                        height: 46
                        x: 80
                        y: -10
                        align: CENTER
                        bg_color: 0xC62828
                        bg_opa: COVER
                        widgets:
                          - label:
                              text: "Reboot"
                              align: CENTER
                              text_font: montserrat_14
                        on_click:
                          - button.press: btn_restart

                    - label:
                        id: lbl_settings_status
                        text: "HA-instellingen controleren..."
                        text_font: montserrat_14
                        text_color: 0x666666
                        align: BOTTOM_LEFT
                        x: 0
                        y: -18

                    # ESPHOME_VERSION is een compile-time string uit
                    # esphome/core/defines.h, dus dit toont de versie
                    # waarmee de firmware daadwerkelijk gebouwd is - geen
                    # HA-entity of extra text_sensor nodig.
                    - label:
                        id: lbl_esphome_version
                        text: !lambda 'return std::string("ESPHome ") + ESPHOME_VERSION;'
                        text_font: montserrat_12
                        text_color: 0x999999
                        align: BOTTOM_LEFT
                        x: 0
                        y: 0

              # =========================
              # INSTELLINGEN
              #
              # Kolom 0 is CONTENT zodat de labels op hun tekst passen en
              # alle dropdowns op dezelfde x beginnen. De rijen zijn FR(1)
              # met grid_cell_y_align: CENTER; een harde height per rij is
              # korter dan de natuurlijke hoogte van een dropdown en
              # kapte die onderaan af.
              # =========================
              - obj:
                  id: settings_obj
                  bg_color: 0xFFFFFF
                  radius: 6
                  pad_all: 12
                  scrollable: false
                  scrollbar_mode: "off"

                  grid_cell_row_pos: 0
                  grid_cell_column_pos: 1
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH

                  layout:
                    type: GRID
                    pad_row: 6
                    pad_column: 12
                    grid_rows:
                      - CONTENT   # titel
                      - FR(1)     # schermtimeout
                      - FR(1)     # nacht start
                      - FR(1)     # nacht eind
                    grid_columns:
                      - CONTENT
                      - FR(1)

                  widgets:
                    - label:
                        text: "Instellingen"
                        text_font: montserrat_20
                        text_color: 0x0B0A0A
                        grid_cell_row_pos: 0
                        grid_cell_column_pos: 0
                        grid_cell_column_span: 2
                        grid_cell_x_align: START
                        grid_cell_y_align: CENTER

                    - label:
                        text: "Schermtimeout:"
                        text_font: montserrat_16
                        text_color: 0x0B0A0A
                        grid_cell_row_pos: 1
                        grid_cell_column_pos: 0
                        grid_cell_x_align: START
                        grid_cell_y_align: CENTER

                    - dropdown:
                        id: screen_timeout_dropdown
                        width: 130
                        grid_cell_row_pos: 1
                        grid_cell_column_pos: 1
                        grid_cell_x_align: START
                        grid_cell_y_align: CENTER
                        options:
                          - "30 sec"
                          - "1 min"
                          - "2 min"
                          - "5 min"
                          - "10 min"
                          - "30 min"
                        selected_index: 3  # standaard 5 min
                        on_value:
                          - globals.set:
                              id: screen_timeout
                              value: !lambda |-
                                int secs[] = {30, 60, 120, 300, 600, 1800};
                                return secs[(int)x];

                    # Nachtmodus: zolang het huidige uur binnen
                    # [Nacht start, Nacht eind) valt, wekt PIR-beweging het
                    # scherm niet meer. De plafondlamp en aanraken doen dat
                    # nog wel. De optielijst loopt 00:00..23:00, dus de
                    # geselecteerde index is gelijk aan het uur.
                    - label:
                        text: "Nacht start:"
                        text_font: montserrat_16
                        text_color: 0x0B0A0A
                        grid_cell_row_pos: 2
                        grid_cell_column_pos: 0
                        grid_cell_x_align: START
                        grid_cell_y_align: CENTER

                    - dropdown:
                        id: night_mode_start_dropdown
                        width: 130
                        grid_cell_row_pos: 2
                        grid_cell_column_pos: 1
                        grid_cell_x_align: START
                        grid_cell_y_align: CENTER
                        options:
                          - "00:00"
                          - "01:00"
                          - "02:00"
                          - "03:00"
                          - "04:00"
                          - "05:00"
                          - "06:00"
                          - "07:00"
                          - "08:00"
                          - "09:00"
                          - "10:00"
                          - "11:00"
                          - "12:00"
                          - "13:00"
                          - "14:00"
                          - "15:00"
                          - "16:00"
                          - "17:00"
                          - "18:00"
                          - "19:00"
                          - "20:00"
                          - "21:00"
                          - "22:00"
                          - "23:00"
                        selected_index: 22  # standaard 22:00
                        on_value:
                          - globals.set:
                              id: night_mode_start_hour
                              value: !lambda 'return (int)x;'
                          - script.execute: update_screen_state

                    - label:
                        text: "Nacht eind:"
                        text_font: montserrat_16
                        text_color: 0x0B0A0A
                        grid_cell_row_pos: 3
                        grid_cell_column_pos: 0
                        grid_cell_x_align: START
                        grid_cell_y_align: CENTER

                    - dropdown:
                        id: night_mode_end_dropdown
                        width: 130
                        grid_cell_row_pos: 3
                        grid_cell_column_pos: 1
                        grid_cell_x_align: START
                        grid_cell_y_align: CENTER
                        options:
                          - "00:00"
                          - "01:00"
                          - "02:00"
                          - "03:00"
                          - "04:00"
                          - "05:00"
                          - "06:00"
                          - "07:00"
                          - "08:00"
                          - "09:00"
                          - "10:00"
                          - "11:00"
                          - "12:00"
                          - "13:00"
                          - "14:00"
                          - "15:00"
                          - "16:00"
                          - "17:00"
                          - "18:00"
                          - "19:00"
                          - "20:00"
                          - "21:00"
                          - "22:00"
                          - "23:00"
                        selected_index: 7  # standaard 07:00
                        on_value:
                          - globals.set:
                              id: night_mode_end_hour
                              value: !lambda 'return (int)x;'
                          - script.execute: update_screen_state

  # =========================
