                                - button:
                                    id: btn_vent_1
                                    flex_grow: 1
                                    height: 46
                                    bg_color: 0x2F8CD8
                                    bg_opa: COVER
                                    widgets:
                                      - label:
                                          text: "1"
                                          align: CENTER
                                          text_font: montserrat_20
                                    on_click:
                                      - homeassistant.action:
                                          action: fan.set_percentage
                                          data:
                                            entity_id: ${ent_ventilator}
                                            percentage: "25"

                                - button:
                                    id: btn_vent_2
                                    flex_grow: 1
                                    height: 46
                                    bg_color: 0x2F8CD8
                                    bg_opa: COVER
                                    widgets:
