                                          action: fan.set_percentage
                                          data:
                                            entity_id: ${ent_ventilator}
                                            percentage: "50"

                                - button:
                                    id: btn_vent_3
                                    flex_grow: 1
                                    height: 46
                                    bg_color: 0x2F8CD8
                                    bg_opa: COVER
                                    widgets:
                                      - label:
                                          text: "3"
                                          align: CENTER
                                          text_font: montserrat_20
