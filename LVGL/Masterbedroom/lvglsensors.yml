# =========================
# WEATHER DATA FROM HOME ASSISTANT (OpenWeatherMap)
# =========================

# =========================
# BOOT-TIME UI SYNC
# =========================
# Three jobs on boot:
#
# 1. Turn the screen on and start the normal inactivity cycle. The
#    backlight itself comes up via restore_mode: ALWAYS_ON (see
#    LVGL/displayconfig.yml), but that alone would leave it lit forever
#    since update_screen_state only ever runs from a trigger (motion,
#    ceiling light, or the end of wake_screen) and nothing evaluates it
#    after a reboot. Running wake_screen here gives boot the same
#    behaviour as a touch: on now, then after screen_timeout seconds
#    control returns to update_screen_state and the usual motion /
#    ceiling-light / night-mode rules apply again.
#
# 2. Restore the night-mode start/end dropdowns (see
#    LVGL/Masterbedroom/lvglconfig.yml settings_obj) to reflect the
#    globals restored from flash, since LVGL widgets themselves don't
#    persist state across reboots - only the globals do
#    (restore_value: yes). The options lists for both dropdowns are
#    ordered 00:00..23:00, so the selected_index equals the stored hour
#    value directly - no lookup table needed (unlike the
#    screen_timeout_dropdown restoration, which maps through a small
#    array of second values).
#
# 3. Evaluate whether the HA-backed settings helpers actually exist
#    (see evaluate_helper_health). Delayed well past the API handshake
#    so the helpers have had a chance to report before we judge them
#    missing; the 60s interval re-checks from then on.
#
# Runs late (priority -100, after LVGL is set up) and is appended to the
# on_boot automation defined in the main device YAML (ESPHome
# concatenates same-shape on_boot dicts from packages).
esphome:
  on_boot:
    priority: -100
    then:
      # Screen on + start the screen_timeout countdown. Done before the
      # delay below so the timeout starts counting right away.
      - script.execute: wake_screen
      - delay: 2s
      - lvgl.dropdown.update:
          id: night_mode_start_dropdown
          selected_index: !lambda 'return id(night_mode_start_hour);'
      - lvgl.dropdown.update:
          id: night_mode_end_dropdown
          selected_index: !lambda 'return id(night_mode_end_hour);'
      # First health check. The extra delay is deliberate: at 2s the API
      # may not have finished sending initial states, and flagging every
      # helper as missing during a normal boot would train people to
      # ignore the warning.
      - delay: 20s
      - script.execute: evaluate_helper_health

# =========================
# GUARD GLOBALS
# =========================
# Prevents the feedback loop described in esphome/esphome#17161:
# lvgl.widget.update / lvgl.dropdown.update on a widget also fires its
# on_value handler even when the update is purely programmatic (e.g.
# mirroring HA state). Without a guard, every HA-side state change
# (including from other automations) gets echoed straight back to HA as
# a fresh user action, causing the widget to "fight" with whatever just
# changed it.
globals:
  - id: mirroring_light_switches
    type: bool
    restore_value: no
    initial_value: 'false'

  # Same guard, used by the Cover panel's "Default" checkbox and the
  # open/close time dropdowns.
  - id: mirroring_cover_settings
    type: bool
    restore_value: no
    initial_value: 'false'

  # Guard for the cover position dropdowns (pre-open / door-open) in the
  # Settings panel, so HA-driven syncs don't echo back as user actions.
  - id: mirroring_cover_positions
    type: bool
    restore_value: no
    initial_value: 'false'

  # Tracks the cover position the user last requested via the slider
  # (in HA's 0=closed/100=open terms), and whether we're still waiting
  # for the physical cover to reach it. While pending, incoming
  # current_position updates that don't yet match the target are
  # ignored (see ha_cover_position) so the slider doesn't visually jump
  # back to the in-transit position while the cover is still moving.
  - id: cover_target_position
    type: int
    restore_value: no
    initial_value: '0'

  - id: cover_position_pending
    type: bool
    restore_value: no
    initial_value: 'false'

  # Whether the backlight was OFF at the moment the current touch
  # arrived, sampled by wake_screen BEFORE it turns the backlight on.
  # This is what distinguishes a "wake touch" (screen was dark, the
  # touch only served to light it up) from a normal touch on an
  # already-lit screen. A wake touch returns the UI to the main page;
  # a normal touch does not, so the Settings page doesn't jump away
  # from under your finger while you're using it.
  #
  # Must be sampled before light.turn_on, otherwise the state has
  # already flipped and every touch would look like a wake touch.
  - id: screen_was_off
    type: bool
    restore_value: no
    initial_value: 'false'

  # How many of the five HA-backed settings helpers currently have no
  # state at all (see evaluate_helper_health). Zero means every helper
  # is present and reporting.
  #
  # Exists because of a real incident: an HA database corruption removed
  # several input_* helpers, and the panel gave no sign of it. Each
  # dropdown quietly fell back to the YAML default in its widget
  # definition - cover_morning_dropdown has selected_index: 4, so it
  # displayed a confident "8:00" for a helper that no longer existed.
  # Users changed settings that went nowhere, and nothing on screen or
  # in HA indicated why.
  #
  # Starts at -1 rather than 0 to mean "not evaluated yet", so the
  # status label and the HA problem sensor can distinguish "we haven't
  # looked" from "we looked and everything is fine".
  - id: helpers_missing_count
    type: int
    restore_value: no
    initial_value: '-1'

  # Human-readable result of the last evaluate_helper_health run, shown
  # in lbl_settings_status on the Settings page. Held in a global rather
  # than built inline so the label's text and colour can both be driven
  # from lvgl.label.update actions (the same pattern the bulb icons use)
  # instead of raw lv_* calls.
  - id: helpers_status_text
    type: std::string
    restore_value: no
    initial_value: '"Checking HA settings..."'

  # Night-mode PIR screen lockout window (hour of day, 0-23, local/HA
  # time). While the current hour falls within [start, end) - wrapping
  # past midnight when start > end - motion from the PIR sensor
  # (motion_occupancy) will NOT wake the display backlight. The ceiling
  # light still wakes/keeps the screen on at any time, and touching the
  # screen always wakes it (see wake_screen); only the PIR-triggered
  # auto-wake is suppressed. Configurable via the Night start / Night
  # end dropdowns on the Settings panel (second_page, see
  # LVGL/lvglconfig.yml). Persisted across reboots; restored into the
  # dropdowns' visual selection by the on_boot block above.
  #
  # Note: this window does not suppress the boot-time wake in the
  # on_boot block above - a reboot always lights the screen briefly,
  # the same way a touch does, and it then switches off again after
  # screen_timeout.
  - id: night_mode_start_hour
    type: int
    restore_value: yes
    initial_value: '22'  # Default: 22:00

  - id: night_mode_end_hour
    type: int
    restore_value: yes
    initial_value: '7'   # Default: 07:00

# =========================
# BUTTONS
# =========================
button:
  # Reboots the panel. Driven by the Reboot button on the Settings page
  # (see btn_reboot_display in lvglconfig.yml), and also exposed to Home
  # Assistant as a normal button entity so the panel can be restarted
  # remotely without walking to it.
  #
  # The restart platform reboots immediately when pressed; there is no
  # confirmation step, so keep this button visually distinct from and
  # not adjacent to anything routinely tapped.
  - platform: restart
    name: "${friendly_name} Restart"
    id: btn_restart
    entity_category: "diagnostic"

# =========================
# SCRIPTS
# =========================
script:
  # Turn the display backlight on/off based on motion OR ceiling light.
  # Screen is on when the ceiling light is on, OR motion is detected
  # outside the configured night-mode PIR lockout window; otherwise off.
  - id: update_screen_state
    then:
      - if:
          condition:
            lambda: |-
              // Ceiling light always wakes/keeps the screen on, regardless
              // of night mode.
              if (id(ceiling_light_on).state) return true;
              // No light and no motion -> screen off.
              if (!id(motion_occupancy).state) return false;
              // Motion detected: suppress the auto-wake during the
              // configured night-mode hours. If HA time isn't synced yet,
              // fail open (allow the wake) rather than leaving the screen
              // stuck off.
              auto t = id(time_homeassistant).now();
              if (!t.is_valid()) return true;
              int hour = t.hour;
              int start = id(night_mode_start_hour);
              int end = id(night_mode_end_hour);
              bool is_night;
              if (start == end) {
                // Same hour for start/end -> no active restriction window.
                is_night = false;
              } else if (start < end) {
                is_night = (hour >= start && hour < end);
              } else {
                // Window wraps past midnight, e.g. 22:00 -> 07:00.
                is_night = (hour >= start || hour < end);
              }
              return !is_night;
          then:
            - light.turn_on: back_light
            # Apply the ambient-light-based brightness now that the
            # screen is on. Safe to call here: apply_brightness only ever
            # adjusts brightness while back_light is on, it never turns it
            # on or off, so it can't override the decision just made.
            - script.execute: apply_brightness
          else:
            - light.turn_off: back_light

  # Wake the screen on touch and keep it awake for the configured timeout.
  # mode restart -> each touch restarts the timer.
  # After the timeout, re-evaluate: if motion/light keep it on, it stays on; otherwise off.
  # Note: touching the screen always wakes it immediately, even during the
  # night-mode PIR lockout window - only the PIR-triggered auto-wake in
  # update_screen_state is suppressed at night.
  # Also executed once from on_boot, so a reboot/power-up lights the screen
  # and then falls back to the normal rules after screen_timeout.
  - id: wake_screen
    mode: restart
    then:
      # STEP 1 - sample the backlight state BEFORE touching it. Once
      # light.turn_on below has run the "was the screen off?" question
      # can no longer be answered, and every touch would look like a
      # wake touch. Order matters here.
      - if:
          condition:
            light.is_on: back_light
          then:
            - globals.set:
                id: screen_was_off
                value: 'false'
          else:
            - globals.set:
                id: screen_was_off
                value: 'true'

      - light.turn_on: back_light
      # Set brightness to match the current room illuminance as soon as
      # the screen comes on, rather than waiting for the next lux change.
      - script.execute: apply_brightness

      # STEP 2 - a touch that woke the screen from off also brings the UI
      # back to the main page, so the panel is always found in a known
      # state instead of on whatever page it was last left on. A touch on
      # an already-lit screen is deliberately left alone: the user is
      # actively working, and pulling the page out from under them
      # mid-interaction would be worse than doing nothing.
      - if:
          condition:
            lambda: 'return id(screen_was_off);'
          then:
            - script.execute: return_to_main_page_now

      # STEP 3 - (re)start the idle countdown that returns the UI to the
      # main page. wake_screen is mode: restart and runs on every touch,
      # so this restarts the idle timer on the LAST touch, exactly like
      # the screen_timeout delay below.
      - script.execute: return_to_main_page

      - delay: !lambda 'return id(screen_timeout) * 1000;'
      - script.execute: update_screen_state

  # Idle auto-return: 30s after the last touch, switch the UI back from
  # the Settings page to the main page.
  #
  # mode: restart, and wake_screen executes it on every touch, so the
  # countdown always measures time since the LAST touch.
  #
  # The 30s is a literal rather than a global on purpose. screen_timeout
  # is a global only because a dropdown on the Settings page edits it at
  # runtime; that global is declared in the un-versioned per-device main
  # config (see the note in ci-harness.yaml), so adding another one there
  # would mean a change that isn't visible in this repo. Nothing edits
  # this value at runtime, so a literal keeps the feature self-contained.
  # Promote it to a global if a dropdown for it is ever added.
  #
  # Deliberately independent of screen_timeout: the page returns to main
  # after 30s idle, while the backlight may well stay on much longer
  # (default 5 min, or indefinitely while the ceiling light is on).
  # Returning the page is cheap and invisible when nobody is looking;
  # switching the backlight off is not.
  - id: return_to_main_page
    mode: restart
    then:
      - delay: 30s
      # Only act when the main page is NOT already showing. Without this
      # guard the timer would call lvgl.page.show on the already-active
      # main page 30s after every touch, forcing a pointless full 800x480
      # screen load and a possible visible flicker.
      #
      # is_showing() is LvPageType's own accessor for exactly this
      # question (see esphome/components/lvgl/lvgl_esphome.h), so no
      # bookkeeping global is needed that could fall out of sync with
      # reality.
      #
      # NOTE: an earlier version of this compared lv_scr_act() against
      # id(main_page) directly. That does not compile - id(main_page) is
      # an esphome::lvgl::LvPageType*, an ESPHome wrapper, not the raw
      # lv_obj_t* that lv_scr_act() returns:
      #   error: comparison between distinct pointer types 'lv_obj_t*'
      #   and 'esphome::lvgl::LvPageType*' lacks a cast
      # Comparing against id(main_page)->obj would work too, but relies
      # on the wrapper's internal layout; is_showing() states the intent.
      - if:
          condition:
            lambda: 'return !id(main_page)->is_showing();'
          then:
            - script.execute: return_to_main_page_now

  # Immediate, unconditional switch back to the main page. Factored out
  # so the idle timer (return_to_main_page) and the wake-touch path in
  # wake_screen share a single implementation and can't drift apart.
  - id: return_to_main_page_now
    then:
      - lvgl.page.show: main_page

  # =========================
  # HA SETTINGS HEALTH CHECK
  # =========================
  # Counts how many of the five HA-backed settings helpers have no state,
  # and writes a plain-language result to the status label on the
  # Settings page (lbl_settings_status in lvglconfig.yml).
  #
  # WHY THIS EXISTS. An HA database corruption once removed several
  # input_* helpers. The panel showed no sign of it: each dropdown fell
  # back to the YAML default baked into its widget definition, so the
  # screen displayed confident, plausible values - "8:00", "60%" - for
  # entities that no longer existed. People changed settings, nothing
  # happened, and there was no way to tell why from the display. The API
  # was connected the whole time, so the header HA icon stayed white and
  # every existing indicator said "healthy".
  #
  # WHY A RE-SYNC BUTTON DOES NOT SOLVE THAT. Re-copying HA's value onto
  # the display assumes there IS a value. When the helper is gone there
  # is nothing to copy, and a button that silently succeeds is worse than
  # no button at all - it manufactures confidence that the problem was
  # just fixed. Hence reporting, not copying, is the primary job here.
  #
  # This script only reads state and writes one label. It deliberately
  # touches no settings widgets, so it is safe to run on a timer without
  # fighting the user or the normal HA->widget handlers.
  #
  # LIMITATION, and it is a real one: has_state() only catches helpers
  # that have NEVER reported - a missing helper at boot, or one that
  # vanished before the panel connected. It does NOT catch a helper
  # deleted while the panel is running, because the homeassistant sensor
  # keeps its last received value and has_state() stays true. That case
  # needs staleness tracking (time since last update per helper) and is
  # tracked as an open question in issue #40. The boot case is the one
  # that actually occurred.
  - id: evaluate_helper_health
    mode: restart
    then:
      - lambda: |-
          // Names are the Settings-page row labels, not entity_ids, so
          // the warning points at the row the user can actually see.
          struct HelperCheck {
            const char *label;
            bool present;
          };
          const HelperCheck checks[] = {
            {"Open",      id(ha_cover_open_time).has_state()},
            {"Close",     id(ha_cover_close_time).has_state()},
            {"Default",   id(ha_cover_default).has_state()},
            {"Pre-open",  id(ha_cover_preopen_position).has_state()},
            {"Door-open", id(ha_cover_dooropen_position).has_state()},
          };
          const int total = sizeof(checks) / sizeof(checks[0]);

          int missing = 0;
          std::string names;
          for (int i = 0; i < total; i++) {
            if (!checks[i].present) {
              missing++;
              if (!names.empty()) names += ", ";
              names += checks[i].label;
            }
          }
          id(helpers_missing_count) = missing;

          char buf[48];
          if (missing == 0) {
            snprintf(buf, sizeof(buf), "Settings OK (%d/%d)", total, total);
            id(helpers_status_text) = buf;
          } else {
            snprintf(buf, sizeof(buf), "%d/%d missing: ", missing, total);
            id(helpers_status_text) = std::string(buf) + names;
            ESP_LOGW("ha_helpers", "%d of %d HA settings helpers missing: %s",
                     missing, total, names.c_str());
          }
      # Text and colour are applied with lvgl.label.update rather than raw
      # lv_* calls, matching the pattern used by the bulb icons and the
      # connectivity glyphs elsewhere in this file.
      - lvgl.label.update:
          id: lbl_settings_status
          text: !lambda 'return id(helpers_status_text);'
          text_color: !lambda 'return lv_color_hex(id(helpers_missing_count) > 0 ? 0xC62828 : 0x4CAF50);'

  # What the Settings-page button runs: report first, then re-apply.
  #
  # The ordering is the point. evaluate_helper_health decides and
  # displays what is actually wrong; sync_settings_from_ha then does the
  # best it can with whatever state exists. If helpers are missing the
  # user now sees WHICH ones, instead of a button that appears to work
  # and changes nothing.
  - id: check_ha_settings
    mode: restart
    then:
      - script.execute: evaluate_helper_health
      - script.execute: sync_settings_from_ha

  # Re-apply Home Assistant's cached state to the settings widgets.
  #
  # HOME ASSISTANT WINS, ALWAYS. This only ever writes HA state into the
  # widgets; it never pushes a widget value back to HA.
  #
  # WHY IT READS CACHED STATE INSTEAD OF ASKING HA TO RE-SEND:
  # the obvious implementation is to call homeassistant.update_entity on
  # each helper and let the existing on_value handlers do the work. That
  # is unreliable here. ESPHome's homeassistant sensors only fire
  # on_value when the received value DIFFERS from the one they already
  # hold, so re-pushing an identical state fires nothing at all - and an
  # identical-state-but-wrong-widget is exactly the case where a manual
  # re-apply would be wanted. Reading the state each homeassistant sensor
  # already caches needs no round-trip and cannot silently no-op.
  #
  # ORDERING MATTERS, AND IS THE MAIN REASON THIS SCRIPT EXISTS:
  # at boot the helpers arrive independently and their handlers fight.
  # If ha_cover_default lands first it forces the dropdowns to the fixed
  # 8:30/22:00 defaults, and a later-arriving ha_cover_open_time then
  # overwrites that with the helper's own value even though Default is
  # on. Whichever message happens to land last wins. Here the order is
  # fixed - times first, then the Default override - so the result is
  # deterministic.
  #
  # Every write is wrapped in the same mirroring_* guards the normal
  # HA->widget handlers use, so re-applying HA state is not echoed back
  # to HA as a fresh user action (esphome/esphome#17161).
  #
  # Each entity is has_state()-gated: a helper that has never reported
  # leaves its widget alone rather than stamping a default over a
  # possibly-correct value. evaluate_helper_health is what makes that
  # silence visible.
  #
  # NOTE ON SCOPE: only the five HA-backed cover/curtain helpers are
  # re-applied. Screen timeout and night-mode start/end are device-local
  # ESPHome globals with no HA counterpart, so there is nothing to sync
  # them against - they are already authoritative and are left untouched.
  - id: sync_settings_from_ha
    mode: restart
    then:
      # ---- Cover open/close times + the Default flag ----
      - lambda: 'id(mirroring_cover_settings) = true;'

      - if:
          condition:
            lambda: 'return id(ha_cover_open_time).has_state();'
          then:
            - lvgl.dropdown.update:
                id: cover_morning_dropdown
                selected_index: !lambda |-
                  std::vector<std::string> options = {
                    "6:00", "6:30", "7:00", "7:30", "8:00",
                    "8:30", "9:00", "9:30", "10:00"
                  };
                  std::string cur = id(ha_cover_open_time).state;
                  for (size_t i = 0; i < options.size(); i++) {
                    if (options[i] == cur) return (int)i;
                  }
                  return 4;  // Default 8:00

      - if:
          condition:
            lambda: 'return id(ha_cover_close_time).has_state();'
          then:
            - lvgl.dropdown.update:
                id: cover_evening_dropdown
                selected_index: !lambda |-
                  std::vector<std::string> options = {
                    "19:00", "19:30", "20:00", "20:30", "21:00",
                    "21:30", "22:00", "22:30", "23:00"
                  };
                  std::string cur = id(ha_cover_close_time).state;
                  for (size_t i = 0; i < options.size(); i++) {
                    if (options[i] == cur) return (int)i;
                  }
                  return 4;  // Default 21:00

      # The Default checkbox also controls whether the two time dropdowns
      # are selectable, so restore both the checked state and the
      # enabled/disabled state together - exactly as the ha_cover_default
      # handler does. Applied AFTER the times above so the Default
      # override wins, which is the deterministic ordering this script
      # exists to provide.
      - if:
          condition:
            lambda: 'return id(ha_cover_default).has_state();'
          then:
            - lvgl.widget.update:
                id: cover_default_checkbox
                state:
                  checked: !lambda 'return id(ha_cover_default).state;'
            - lvgl.widget.update:
                id: cover_morning_dropdown
                state:
                  disabled: !lambda 'return id(ha_cover_default).state;'
            - lvgl.widget.update:
                id: cover_evening_dropdown
                state:
                  disabled: !lambda 'return id(ha_cover_default).state;'
            # When Default is active the fixed default times win over
            # whatever the input_select helpers hold, matching the
            # ha_cover_default handler's behaviour.
            - if:
                condition:
                  lambda: 'return id(ha_cover_default).state;'
                then:
                  - lvgl.dropdown.update:
                      id: cover_morning_dropdown
                      selected_index: 5  # 8:30
                  - lvgl.dropdown.update:
                      id: cover_evening_dropdown
                      selected_index: 6  # 22:00

      - lambda: 'id(mirroring_cover_settings) = false;'

      # ---- Cover pre-open / door-open positions ----
      - lambda: 'id(mirroring_cover_positions) = true;'

      - if:
          condition:
            lambda: 'return id(ha_cover_preopen_position).has_state();'
          then:
            - lvgl.dropdown.update:
                id: preopen_dropdown
                selected_index: !lambda |-
                  int vals[] = {0, 5, 10, 15, 20, 25, 30, 40, 50};
                  int cur = (int) id(ha_cover_preopen_position).state;
                  for (int i = 0; i < 9; i++) {
                    if (vals[i] == cur) return i;
                  }
                  return 2;  // Default 10%

      - if:
          condition:
            lambda: 'return id(ha_cover_dooropen_position).has_state();'
          then:
            - lvgl.dropdown.update:
                id: dooropen_dropdown
                selected_index: !lambda |-
                  int vals[] = {0, 20, 40, 50, 60, 70, 80, 100};
                  int cur = (int) id(ha_cover_dooropen_position).state;
                  for (int i = 0; i < 8; i++) {
                    if (vals[i] == cur) return i;
                  }
                  return 4;  // Default 60%

      - lambda: 'id(mirroring_cover_positions) = false;'

      # Also refresh the cover slider from HA's current position, and
      # clear any stale in-flight target. If a set_cover_position command
      # was lost, cover_position_pending can otherwise keep ignoring
      # incoming positions until its 20s failsafe expires; a manual check
      # should not have to wait that out.
      - globals.set:
          id: cover_position_pending
          value: 'false'
      - if:
          condition:
            lambda: 'return id(ha_cover_position).has_state();'
          then:
            - lvgl.slider.update:
                id: cover_slider
                value: !lambda 'return 100 - (int) id(ha_cover_position).state;'

  # Ambient-light-driven backlight brightness.
  #
  # Maps the room illuminance (sensor.multisensor2_room_bart_illuminance,
  # mirrored into ha_room_illuminance) to a backlight brightness with a
  # linear ramp between two clamps:
  #   <= 5 lux   -> 20% (dim floor, comfortable in a dark bedroom)
  #   >= 200 lux -> 100% (full brightness in a well-lit room)
  #   in between -> linear interpolation
  #
  # IMPORTANT: this only adjusts brightness while back_light is already
  # ON. It never turns the backlight on or off, so update_screen_state
  # remains the single owner of the on/off decision (motion / ceiling
  # light / night-mode). If the screen is off, this is a no-op and the
  # brightness is instead applied the next time wake_screen /
  # update_screen_state turns it on.
  - id: apply_brightness
    mode: restart
    then:
      - if:
          condition:
            light.is_on: back_light
          then:
            - light.turn_on:
                id: back_light
                brightness: !lambda |-
                  // If the sensor hasn't reported yet (NaN), leave the
                  // backlight at full brightness rather than guessing.
                  float lux = id(ha_room_illuminance).state;
                  if (isnan(lux)) return 1.0f;
                  const float lux_min = 5.0f;    // at/below this -> floor
                  const float lux_max = 200.0f;  // at/above this -> ceiling
                  const float b_min = 0.20f;     // dim floor (20%)
                  const float b_max = 1.00f;     // full (100%)
                  if (lux <= lux_min) return b_min;
                  if (lux >= lux_max) return b_max;
                  float frac = (lux - lux_min) / (lux_max - lux_min);
                  return b_min + frac * (b_max - b_min);

  # Failsafe for the cover position slider: if the cover never reports a
  # current_position matching the requested target (e.g. it stalls, gets
  # manually stopped, or the command is lost), stop ignoring HA position
  # updates after a while so the slider can't get stuck out of sync
  # forever. Restarted on every slider release so only the most recent
  # request counts.
  - id: cover_position_pending_timeout
    mode: restart
    then:
      - delay: 20s
      - globals.set:
          id: cover_position_pending
          value: 'false'

  # Drives the two header status icons on both pages, and the enabled
  # state of the Check button on the Settings page:
  #   - WiFi icon: white wifi glyph while connected to the WiFi network,
  #     red wifi-alert glyph while disconnected.
  #   - HA icon: home-assistant glyph, white while the device has an
  #     active API connection to Home Assistant, red while it doesn't.
  #   - Check button: enabled only while the API is connected.
  # Driven periodically by the interval below.
  - id: update_connectivity_icons
    then:
      # WiFi status - uses lvgl.label.update since `text` (the glyph)
      # is a label-specific property, not a generic widget style
      # property that lvgl.widget.update understands.
      - if:
          condition:
            wifi.connected:
          then:
            - lvgl.label.update:
                id: lbl_wifistatus
                text: "\U000F05A9"
                text_color: 0xFFFFFF
            - lvgl.label.update:
                id: lbl_wifistatus_2
                text: "\U000F05A9"
                text_color: 0xFFFFFF
          else:
            - lvgl.label.update:
                id: lbl_wifistatus
                text: "\U000F16B5"
                text_color: 0xFF0000
            - lvgl.label.update:
                id: lbl_wifistatus_2
                text: "\U000F16B5"
                text_color: 0xFF0000
      # Home Assistant API connectivity status - only the color changes
      # here (the glyph stays the same), so lvgl.widget.update is fine.
      #
      # The Check button's enabled state is driven from the same
      # condition so it can never disagree with the HA status icon
      # sitting a few centimetres away in the header. With the API down
      # there is no cached state to evaluate and nothing to re-apply, so
      # a live-looking button would just be a lie.
      #
      # NOTE this is a different failure from the one the health check
      # addresses. api.connected proves the TRANSPORT is up; it says
      # nothing about whether the entities behind it still exist. During
      # the incident that motivated the health check, HA was connected
      # and this button would have been enabled.
      #
      # The Reboot button is deliberately NOT gated this way: rebooting
      # needs nothing from HA, and is arguably most useful precisely when
      # the API connection has gone bad.
      - if:
          condition:
            api.connected:
          then:
            - lvgl.widget.update:
                id: lbl_hastatus
                text_color: 0xFFFFFF
            - lvgl.widget.update:
                id: lbl_hastatus_2
                text_color: 0xFFFFFF
            - lvgl.widget.update:
                id: btn_check_settings
                state:
                  disabled: false
          else:
            - lvgl.widget.update:
                id: lbl_hastatus
                text_color: 0xFF0000
            - lvgl.widget.update:
                id: lbl_hastatus_2
                text_color: 0xFF0000
            - lvgl.widget.update:
                id: btn_check_settings
                state:
                  disabled: true

  # Drives the two-half bed occupancy icon (mdi:bed-king, see img_bed_king
  # in lvglconfig.yml) on both pages' headers: left half tracks the left
  # pressure sensor, right half tracks the right pressure sensor. White =
  # unoccupied, green = occupied. Runs on every state change of either
  # sensor (see binary_sensor: block below).
  - id: update_bed_occupancy_icons
    then:
      - lvgl.image.update:
          id: img_bed_left
          image_recolor: !lambda 'return lv_color_hex(id(bed_left_occupied).state ? 0x4CAF50 : 0xFFFFFF);'
      - lvgl.image.update:
          id: img_bed_left_2
          image_recolor: !lambda 'return lv_color_hex(id(bed_left_occupied).state ? 0x4CAF50 : 0xFFFFFF);'
      - lvgl.image.update:
          id: img_bed_right
          image_recolor: !lambda 'return lv_color_hex(id(bed_right_occupied).state ? 0x4CAF50 : 0xFFFFFF);'
      - lvgl.image.update:
          id: img_bed_right_2
          image_recolor: !lambda 'return lv_color_hex(id(bed_right_occupied).state ? 0x4CAF50 : 0xFFFFFF);'

# =========================
# INTERVALS
# =========================
interval:
  - interval: 5s
    then:
      - script.execute: update_connectivity_icons

  # Proactive helper health check. The whole point is that nobody should
  # have to press a button to discover a helper has gone missing, so this
  # runs on its own.
  #
  # 60s is deliberately unhurried: helpers do not vanish often, the
  # check is pure state-reading with no HA round-trip, and re-running it
  # is what keeps the warning on screen rather than latching it. Once a
  # helper comes back the label returns to "Settings OK" within a minute
  # without any user action.
  - interval: 60s
    then:
      - script.execute: evaluate_helper_health

text_sensor:
  # Weather condition
  - platform: homeassistant
    id: ha_weather_condition
    entity_id: weather.openweathermap
    on_value:
      then:
        # Update condition name (capitalize first letter)
        - lvgl.label.update:
            id: lbl_weather_forecast_condition_name
            text: !lambda |-
              std::string condition = x;
              if (!condition.empty()) {
                condition[0] = toupper(condition[0]);
              }
              return condition.c_str();
        
        # Update weather icon
        - lvgl.label.update:
            id: lbl_weather_forecast_condition_icon
            text: !lambda |-
              std::map<std::string, std::string> weather_icons = {
                {"clear-night", "\U000F0594"},
                {"cloudy", "\U000F0590"},
                {"exceptional", "\U000F0F2F"},
                {"fog", "\U000F0591"},
                {"hail", "\U000F0592"},
                {"lightning", "\U000F0593"},
                {"lightning-rainy", "\U000F067E"},
                {"partlycloudy", "\U000F0595"},
                {"pouring", "\U000F0596"},
                {"rainy", "\U000F0597"},
                {"snowy", "\U000F0598"},
                {"snowy-rainy", "\U000F067F"},
                {"sunny", "\U000F0599"},
                {"windy", "\U000F059D"},
                {"windy-variant", "\U000F059E"}
              };
              
              std::string condition = x;
              if (weather_icons.count(condition)) {
                return weather_icons[condition].c_str();
              }
              return "\U000F0599";

  # Fan speed state sync (off/low/mid/high) from iFan03's clean text sensor.
  # This reliably highlights the active fan button in red regardless of
  # who changed the fan (display, physical remote, or HA automation).
  # Unselected buttons are reset to the app's blue accent (0x2F8CD8),
  # matching the color they had before this red-highlight logic existed.
  - platform: homeassistant
    id: ha_fan_speed_state
    entity_id: sensor.master_bedroom_sonoff_ifan_ifan03_masterbedroom_fan_speed_state
    on_value:
      then:
        # Reset all buttons to default (blue) style
        - lvgl.widget.update:
            id: fan_off_button
            bg_color: 0x2F8CD8
            bg_opa: COVER
        - lvgl.widget.update:
            id: fan_low_button
            bg_color: 0x2F8CD8
            bg_opa: COVER
        - lvgl.widget.update:
            id: fan_mid_button
            bg_color: 0x2F8CD8
            bg_opa: COVER
        - lvgl.widget.update:
            id: fan_high_button
            bg_color: 0x2F8CD8
            bg_opa: COVER
        # Highlight the active button in red
        - if:
            condition:
              lambda: 'return x == "off";'
            then:
              - lvgl.widget.update:
                  id: fan_off_button
                  bg_color: 0xFF0000
                  bg_opa: COVER
        - if:
            condition:
              lambda: 'return x == "low";'
            then:
              - lvgl.widget.update:
                  id: fan_low_button
                  bg_color: 0xFF0000
                  bg_opa: COVER
        - if:
            condition:
              lambda: 'return x == "mid";'
            then:
              - lvgl.widget.update:
                  id: fan_mid_button
                  bg_color: 0xFF0000
                  bg_opa: COVER
        - if:
            condition:
              lambda: 'return x == "high";'
            then:
              - lvgl.widget.update:
                  id: fan_high_button
                  bg_color: 0xFF0000
                  bg_opa: COVER

  # Cover Open Time helper sync
  - platform: homeassistant
    id: ha_cover_open_time
    entity_id: input_select.master_bedroom_cover_open_time
    on_value:
      then:
        # Guard: this update must not be echoed back to HA via the
        # dropdown's on_value handler (see esphome/esphome#17161).
        - lambda: 'id(mirroring_cover_settings) = true;'
        - lvgl.dropdown.update:
            id: cover_morning_dropdown
            selected_index: !lambda |-
              std::vector<std::string> options = {
                "6:00", "6:30", "7:00", "7:30", "8:00",
                "8:30", "9:00", "9:30", "10:00"
              };
              for (size_t i = 0; i < options.size(); i++) {
                if (options[i] == x) return (int)i;
              }
              return 4;  // Default 8:00
        - lambda: 'id(mirroring_cover_settings) = false;'

  # Cover Close Time helper sync
  - platform: homeassistant
    id: ha_cover_close_time
    entity_id: input_select.master_bedroom_cover_close_time
    on_value:
      then:
        # Guard: this update must not be echoed back to HA via the
        # dropdown's on_value handler (see esphome/esphome#17161).
        - lambda: 'id(mirroring_cover_settings) = true;'
        - lvgl.dropdown.update:
            id: cover_evening_dropdown
            selected_index: !lambda |-
              std::vector<std::string> options = {
                "19:00", "19:30", "20:00", "20:30", "21:00",
                "21:30", "22:00", "22:30", "23:00"
              };
              for (size_t i = 0; i < options.size(); i++) {
                if (options[i] == x) return (int)i;
              }
              return 4;  // Default 21:00
        - lambda: 'id(mirroring_cover_settings) = false;'

  # Climate HVAC mode sync
  - platform: homeassistant
    id: ha_climate_hvac_mode
    entity_id: climate.virtual_thermostat_master_bedroom
    on_value:
      then:
        # Reset all mode buttons
        - lvgl.widget.update:
            id: climate_off_button
            state:
              checked: false
        - lvgl.widget.update:
            id: climate_eco_button
            state:
              checked: false
        - lvgl.widget.update:
            id: climate_warm_button
            state:
              checked: false
        # Highlight Off button if hvac_mode is off
        - if:
            condition:
              lambda: 'return x == "off";'
            then:
              - lvgl.widget.update:
                  id: climate_off_button
                  state:
                    checked: true

  # Climate preset mode sync
  - platform: homeassistant
    id: ha_climate_preset_mode
    entity_id: climate.virtual_thermostat_master_bedroom
    attribute: preset_mode
    on_value:
      then:
        - if:
            condition:
              lambda: 'return x == "eco";'
            then:
              - lvgl.widget.update:
                  id: climate_eco_button
                  state:
                    checked: true
              - lvgl.widget.update:
                  id: climate_warm_button
                  state:
                    checked: false
        - if:
            condition:
              lambda: 'return x == "comfort";'
            then:
              - lvgl.widget.update:
                  id: climate_warm_button
                  state:
                    checked: true
              - lvgl.widget.update:
                  id: climate_eco_button
                  state:
                    checked: false

# =========================
# HOME ASSISTANT LIGHT STATES
# =========================
# =========================
# BINARY SENSOR (status)
# =========================
binary_sensor:
  - platform: status
    name: Status sensor

  # Surfaces the helper health check to Home Assistant, so a missing
  # settings helper can raise a notification instead of waiting to be
  # noticed on the panel. device_class: problem means HA renders it as
  # OK / Problem rather than off / on.
  #
  # This is the half that does not depend on anyone looking at the
  # display. During the incident that motivated it, the panel was showing
  # plausible defaults and nothing anywhere flagged a fault.
  #
  # Reports false (no problem) until the first evaluation completes -
  # helpers_missing_count starts at -1 - so a normal boot doesn't fire
  # a spurious alert before the API has even sent initial states.
  - platform: template
    name: "${friendly_name} HA Settings Helpers Missing"
    id: ha_helpers_missing
    device_class: problem
    entity_category: "diagnostic"
    lambda: 'return id(helpers_missing_count) > 0;'

  # Motion / occupancy sensor - drives the screen backlight
  - platform: homeassistant
    id: motion_occupancy
    entity_id: binary_sensor.multisensor_6_home_security_motion_detection
    on_state:
      then:
        - script.execute: update_screen_state

  # Main light (plafondlamp) status sync
  - platform: homeassistant
    id: ceiling_light_on
    entity_id: light.sonoff_ifan_ifan03_masterbedroom_light
    on_state:
      then:
        # Guard: this update must not be echoed back to HA via the
        # switch's on_value handler (see esphome/esphome#17161).
        - lambda: 'id(mirroring_light_switches) = true;'
        - lvgl.widget.update:
            id: main_light_switch_main
            state:
              checked: !lambda return x;
            shadow_width: !lambda 'return x ? 15 : 0;'
        # Bulb icon: filled amber when on, grey outline when off
        - lvgl.label.update:
            id: lbl_bulb_main
            text: !lambda 'return std::string(x ? "\U000F0335" : "\U000F0336");'
            text_color: !lambda 'return lv_color_hex(x ? 0xFDB813 : 0xBBBBBB);'
        - lambda: 'id(mirroring_light_switches) = false;'
        # Update screen state (light on -> screen on)
        - script.execute: update_screen_state

  # Left light status sync
  - platform: homeassistant
    id: ha_light_left
    entity_id: light.master_bedroom_light_left
    on_state:
      then:
        # Guard: this update must not be echoed back to HA via the
        # switch's on_value handler (see esphome/esphome#17161).
        - lambda: 'id(mirroring_light_switches) = true;'
        - lvgl.widget.update:
            id: main_light_switch_left
            state:
              checked: !lambda return x;
            shadow_width: !lambda 'return x ? 15 : 0;'
        # Bulb icon: filled amber when on, grey outline when off
        - lvgl.label.update:
            id: lbl_bulb_left
            text: !lambda 'return std::string(x ? "\U000F0335" : "\U000F0336");'
            text_color: !lambda 'return lv_color_hex(x ? 0xFDB813 : 0xBBBBBB);'
        - lambda: 'id(mirroring_light_switches) = false;'

  # Right light status sync
  - platform: homeassistant
    id: ha_light_right
    entity_id: light.master_bedroom_light_right
    on_state:
      then:
        # Guard: this update must not be echoed back to HA via the
        # switch's on_value handler (see esphome/esphome#17161).
        - lambda: 'id(mirroring_light_switches) = true;'
        - lvgl.widget.update:
            id: main_light_switch_right
            state:
              checked: !lambda return x;
            shadow_width: !lambda 'return x ? 15 : 0;'
        # Bulb icon: filled amber when on, grey outline when off
        - lvgl.label.update:
            id: lbl_bulb_right
            text: !lambda 'return std::string(x ? "\U000F0335" : "\U000F0336");'
            text_color: !lambda 'return lv_color_hex(x ? 0xFDB813 : 0xBBBBBB);'
        - lambda: 'id(mirroring_light_switches) = false;'

  # Living room lights status sync (second page)
  - platform: homeassistant
    id: livingroom_light_on
    entity_id: light.livingroom_lights
    on_state:
      then:
        # Guard: this update must not be echoed back to HA via the
        # switch's on_value handler (see esphome/esphome#17161).
        - lambda: 'id(mirroring_light_switches) = true;'
        - lvgl.widget.update:
            id: livingroom_light_switch
            state:
              checked: !lambda return x;
            shadow_width: !lambda 'return x ? 15 : 0;'
        # Bulb icon: filled amber when on, grey outline when off
        - lvgl.label.update:
            id: lbl_bulb_livingroom
            text: !lambda 'return std::string(x ? "\U000F0335" : "\U000F0336");'
            text_color: !lambda 'return lv_color_hex(x ? 0xFDB813 : 0xBBBBBB);'
        - lambda: 'id(mirroring_light_switches) = false;'

  # Cover Default Times boolean sync
  - platform: homeassistant
    id: ha_cover_default
    entity_id: input_boolean.master_bedroom_cover_default_times
    on_state:
      then:
        # Guard: this update must not be echoed back to HA via the
        # checkbox's/dropdowns' on_value handlers (see
        # esphome/esphome#17161).
        - lambda: 'id(mirroring_cover_settings) = true;'
        - lvgl.widget.update:
            id: cover_default_checkbox
            state:
              checked: !lambda return x;
        # Grey out (disable) the time dropdowns while Default is active,
        # since any manual selection would just get overwritten the
        # next time this handler fires. Re-enable them as soon as
        # Default is unchecked.
        - lvgl.widget.update:
            id: cover_morning_dropdown
            state:
              disabled: !lambda return x;
        - lvgl.widget.update:
            id: cover_evening_dropdown
            state:
              disabled: !lambda return x;
        # When "Default" is enabled, the open/close dropdowns should
        # reflect the fixed default times (8:30 open / 22:00 close)
        # regardless of whatever the input_select helpers currently
        # hold. Update the dropdown widgets while still under the
        # guard above so this doesn't echo back to HA as a fresh
        # selection.
        - if:
            condition:
              lambda: 'return x;'
            then:
              - lvgl.dropdown.update:
                  id: cover_morning_dropdown
                  selected_index: 5  # 8:30
              - lvgl.dropdown.update:
                  id: cover_evening_dropdown
                  selected_index: 6  # 22:00
        - lambda: 'id(mirroring_cover_settings) = false;'
        # Now (outside the guard) push those same default times to the
        # input_select helpers in HA, so Home Assistant's state matches
        # what the display just showed, no matter what triggered
        # "Default" to be enabled (display tap, HA UI, or an automation).
        - if:
            condition:
              lambda: 'return x;'
            then:
              - homeassistant.action:
                  action: input_select.select_option
                  data:
                    entity_id: input_select.master_bedroom_cover_open_time
                    option: "8:30"
              - homeassistant.action:
                  action: input_select.select_option
                  data:
                    entity_id: input_select.master_bedroom_cover_close_time
                    option: "22:00"

  # Bed occupancy - left side (pressure sensor). Drives img_bed_left /
  # img_bed_left_2 (mdi:bed-king, left half) in lvglconfig.yml via
  # update_bed_occupancy_icons above.
  - platform: homeassistant
    id: bed_left_occupied
    entity_id: binary_sensor.pressure_mayo_occupancy
    on_state:
      then:
        - script.execute: update_bed_occupancy_icons

  # Bed occupancy - right side (pressure sensor). Entity was reported
  # unavailable in HA at time of writing; harmless here - the right icon
  # half simply stays white (unoccupied) until it starts reporting.
  - platform: homeassistant
    id: bed_right_occupied
    entity_id: binary_sensor.pressure_bart_occupancy
    on_state:
      then:
        - script.execute: update_bed_occupancy_icons

# =========================
# SENSORS FROM HOME ASSISTANT
# =========================
sensor:
  # Room illuminance (lux) from the HA multisensor. Drives the
  # ambient-light backlight brightness via apply_brightness. See that
  # script for the lux -> brightness mapping and the on/off-safety note.
  - platform: homeassistant
    id: ha_room_illuminance
    entity_id: sensor.multisensor2_room_bart_illuminance
    on_value:
      then:
        - script.execute: apply_brightness

  # Current temperature (Now)
  - platform: homeassistant
    id: ha_weather_temp_now
    entity_id: weather.openweathermap
    attribute: temperature
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_weather_outdoor_now
            text: !lambda |-
              char buf[16];
              snprintf(buf, sizeof(buf), "%.1f °C", x);
              return buf;

  # Feels like temperature
  - platform: homeassistant
    id: ha_weather_feels_like
    entity_id: weather.openweathermap
    attribute: apparent_temperature
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_weather_forecast_tempap
            text: !lambda |-
              char buf[16];
              snprintf(buf, sizeof(buf), "%.1f °C", x);
              return buf;

  # Cloud coverage for Maximum field
  - platform: homeassistant
    id: ha_weather_cloud
    entity_id: weather.openweathermap
    attribute: cloud_coverage
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_weather_forecast_temphi
            text: !lambda |-
              char buf[16];
              snprintf(buf, sizeof(buf), "%d%%", (int)x);
              return buf;

  # Humidity for Minimum field
  - platform: homeassistant
    id: ha_weather_humidity
    entity_id: weather.openweathermap
    attribute: humidity
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_weather_forecast_templo
            text: !lambda |-
              char buf[16];
              snprintf(buf, sizeof(buf), "%d%%", (int)x);
              return buf;

    # Wind bearing (richting in graden)
  # Wind speed
  - platform: homeassistant
    id: ha_weather_wind_speed
    entity_id: weather.openweathermap
    attribute: wind_speed
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_weather_wind_speed
            text: !lambda |-
              char buf[16];
              snprintf(buf, sizeof(buf), "%.1f km/h", x);
              return buf;

  # Cover position sync from HA (inverted display: 0 = open, 100 = closed).
  # While the user has an in-flight target position (cover_position_pending),
  # intermediate current_position reports that don't yet match the target
  # are ignored so the slider holds steady at the requested position
  # instead of jumping back to wherever the cover currently is mid-travel
  # (see cover_target_position / cover_position_pending_timeout globals).
  - platform: homeassistant
    id: ha_cover_position
    entity_id: cover.cover_master_bedroom
    attribute: current_position
    on_value:
      then:
        - lambda: |-
            if (id(cover_position_pending)) {
              int target = id(cover_target_position);
              if (std::abs((int)x - target) > 2) {
                // Still travelling toward the requested target; skip this
                // intermediate update.
                return;
              }
              // Target reached (within tolerance): resume normal syncing.
              id(cover_position_pending) = false;
            }
        - if:
            condition:
              lambda: 'return !id(cover_position_pending);'
            then:
              - lvgl.slider.update:
                  id: cover_slider
                  value: !lambda 'return 100 - (int)x;'

  # Cover pre-open position helper sync (Settings dropdown).
  # Guarded so the programmatic dropdown update doesn't echo back to HA.
  - platform: homeassistant
    id: ha_cover_preopen_position
    entity_id: input_number.master_bedroom_cover_preopen_position
    on_value:
      then:
        - lambda: 'id(mirroring_cover_positions) = true;'
        - lvgl.dropdown.update:
            id: preopen_dropdown
            selected_index: !lambda |-
              int vals[] = {0, 5, 10, 15, 20, 25, 30, 40, 50};
              for (int i = 0; i < 9; i++) {
                if (vals[i] == (int)x) return i;
              }
              return 2;  // Default 10%
        - lambda: 'id(mirroring_cover_positions) = false;'

  # Cover door-open close position helper sync (Settings dropdown).
  # Guarded so the programmatic dropdown update doesn't echo back to HA.
  - platform: homeassistant
    id: ha_cover_dooropen_position
    entity_id: input_number.master_bedroom_cover_door_open_position
    on_value:
      then:
        - lambda: 'id(mirroring_cover_positions) = true;'
        - lvgl.dropdown.update:
            id: dooropen_dropdown
            selected_index: !lambda |-
              int vals[] = {0, 20, 40, 50, 60, 70, 80, 100};
              for (int i = 0; i < 8; i++) {
                if (vals[i] == (int)x) return i;
              }
              return 4;  // Default 60%
        - lambda: 'id(mirroring_cover_positions) = false;'

  # Climate setpoint sync from HA → Display (number only; °C is a separate label)
  - platform: homeassistant
    id: ha_climate_setpoint
    entity_id: climate.virtual_thermostat_master_bedroom
    attribute: temperature
    on_value:
      then:
        - globals.set:
            id: climate_setpoint_value
            value: !lambda 'return x;'
        - lvgl.label.update:
            id: climate_setpoint_label
            text: !lambda |-
              char buf[16];
              snprintf(buf, sizeof(buf), "%.1f", x);
              return buf;

  # Current temperature
  - platform: homeassistant
    id: ha_climate_current_temp
    entity_id: climate.virtual_thermostat_master_bedroom
    attribute: current_temperature
    on_value:
      then:
        - lvgl.label.update:
            id: climate_current_temp
            text: !lambda |-
              char buf[16];
              snprintf(buf, sizeof(buf), "%.1f °C", x);
              return buf;
