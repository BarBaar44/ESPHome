esphome:
  name: $device_name
  comment: '${device_description}'
  on_boot:
    # Publish an initial fan speed state shortly after boot so consumers
    # (e.g. the LVGL display) always receive a value to sync against,
    # even if the fan is never touched after a restart. Without this the
    # template text_sensor (update_interval: never) would stay empty until
    # the next on_turn_on/off/speed_set event, leaving the display's fan
    # buttons stuck at their default color.
    priority: -100
    then:
      - delay: 5s
      - script.execute: publish_fan_speed_state

esp8266:
  board: esp01_1m

logger:
  level: INFO

button:
  - platform: template
    name: "$device_name Buzzer"
    id: buzzer
    on_press:
      - switch.turn_on: buzzer_switch
      - delay: 50ms
      - switch.turn_off: buzzer_switch

  # =========================
  # FAN SPEED BUTTONS
  #
  # Named-speed entry points for external controllers (the LVGL panel in
  # LVGL/Masterbedroom/lvglconfig.yml). These exist so nothing outside
  # this device has to express a fan speed as a percentage.
  #
  # Why: HA's ESPHome fan integration turns a percentage into a speed with
  #   speed_level = ceil(percentage_to_ranged_value((1, speed_count), pct))
  # With speed_count: 3 the medium/high boundary is 66.67, so
  # fan.set_percentage with 67 yields ceil(2.01) = 3 and the fan runs on
  # HIGH when MID was requested. Sending 66 gives ceil(1.98) = 2 and is
  # correct, but leaves a one-unit margin to a float boundary in a config
  # where the value looks arbitrary.
  #
  # These buttons take percentages out of the loop: the caller asks for a
  # speed by name and the fan's on_speed_set lambda below drives the
  # relays from an integer. This is the same path the RF remote buttons
  # have always used, which is why the physical remote's MEDIUM button
  # never showed this bug.
  #
  # Deliberately buttons and not a select: buttons are stateless, so they
  # add no second source of truth alongside the fan_speed_state
  # text_sensor that the display already uses to colour its fan buttons.
  #
  # Names are hardcoded here (not built from $friendly_name) on purpose:
  # $friendly_name expands to something like "Master Bedroom Sonoff-Ifan
  # iFan03 Masterbedroom", which produced entity_ids like
  # button.master_bedroom_sonoff_ifan_ifan03_masterbedroom_fan_set_high -
  # "Master Bedroom" and "Masterbedroom" both appear, redundantly. Hard-
  # coding "Master Bedroom Fan Set ..." gives short, non-repeating
  # entity_ids (button.master_bedroom_fan_set_high, etc.) and matches
  # what LVGL/Masterbedroom/lvglconfig.yml expects.
  #
  # NOTE: renaming an existing button does NOT change its entity_id in
  # HA's registry - only the displayed friendly name updates. If these
  # buttons were flashed before under the old $friendly_name-based
  # names, fix the Entity ID field manually per button in Settings >
  # Devices & Services > Entities, or delete the old entities so they
  # re-register fresh under the new name.
  # =========================
  - platform: template
    name: "Master Bedroom Fan Set Off"
    id: fan_set_off
    icon: "mdi:fan-off"
    on_press:
      - fan.turn_off: ifan03_fan

  - platform: template
    name: "Master Bedroom Fan Set Low"
    id: fan_set_low
    icon: "mdi:fan-speed-1"
    on_press:
      - fan.turn_on:
          id: ifan03_fan
          speed: 1

  - platform: template
    name: "Master Bedroom Fan Set Mid"
    id: fan_set_mid
    icon: "mdi:fan-speed-2"
    on_press:
      - fan.turn_on:
          id: ifan03_fan
          speed: 2

  - platform: template
    name: "Master Bedroom Fan Set High"
    id: fan_set_high
    icon: "mdi:fan-speed-3"
    on_press:
      - fan.turn_on:
          id: ifan03_fan
          speed: 3

output:
  - platform: gpio
    id: light_relay
    pin: GPIO9
    inverted: true

switch:
  - platform: gpio
    internal: True
    id: buzzer_switch
    name: "Buzzer"
    pin:
      number: GPIO10
      inverted: true

  - platform: gpio
    internal: true
    pin: GPIO14
    id: fan_relay1
    restore_mode: ALWAYS_OFF

  - platform: gpio
    internal: true
    pin: GPIO12
    id: fan_relay2
    restore_mode: ALWAYS_OFF

  - platform: gpio
    internal: true
    pin: GPIO15
    id: fan_relay3
    restore_mode: ALWAYS_OFF

light:
  - platform: binary
    name: "$friendly_name Light"
    output: light_relay
    id: ifan03_light
    restore_mode: $on_boot_light

fan:
  - platform: template
    id: ifan03_fan
    name: "$friendly_name Fan"
    speed_count: 3
    restore_mode: NO_RESTORE # important
    on_turn_on:
      - switch.turn_on: fan_relay1
      - switch.turn_off: fan_relay2
      - switch.turn_off: fan_relay3
      - script.execute: publish_fan_speed_state
    on_turn_off:
      - switch.turn_off: fan_relay1
      - switch.turn_off: fan_relay2
      - switch.turn_off: fan_relay3
      - script.execute: publish_fan_speed_state
    on_speed_set:
      - lambda: |-
          if (id(ifan03_fan).speed == 1) {
            id(fan_relay1).turn_on();
            id(fan_relay2).turn_off();
            id(fan_relay3).turn_off();
          } else if (id(ifan03_fan).speed == 2) {
            id(fan_relay1).turn_on();
            id(fan_relay2).turn_on();
            id(fan_relay3).turn_off();
          } else if (id(ifan03_fan).speed == 3) {
            id(fan_relay1).turn_off();
            id(fan_relay2).turn_off();
            id(fan_relay3).turn_on();
          }
      - script.execute: publish_fan_speed_state

# =========================
# CLEAN FAN SPEED STATE
# Publishes an explicit, unambiguous state that consumers (e.g. the LVGL
# display) can use directly: "off" / "low" / "mid" / "high".
# This avoids relying on the fan.percentage attribute, which lingers stale
# when the fan is off.
# =========================
script:
  - id: publish_fan_speed_state
    then:
      - text_sensor.template.publish:
          id: fan_speed_state
          state: !lambda |-
            if (!id(ifan03_fan).state) return "off";
            switch (id(ifan03_fan).speed) {
              case 1: return "low";
              case 2: return "mid";
              case 3: return "high";
              default: return "off";
            }

text_sensor:
  - platform: template
    id: fan_speed_state
    name: "$friendly_name Fan Speed State"
    update_interval: never

remote_receiver:
  pin: 
    number: GPIO3
    inverted: true
  dump: raw

binary_sensor:
  # remote button row 3 button 1
  - platform: remote_receiver
    name: "$device_name Fan Off"
    id: remote_0
    raw:
      code: [-207, 104, -103, 104, -104, 103, -104, 207, -104, 103, -104, 104, -103, 104, -104, 103, -104, 105, -102, 104, -725, 104, -311, 103, -518, 104, -933, 103, -104, 104, -725, 104, -932, 104, -207, 207, -519]
    on_release:
      then:
        - fan.turn_off: ifan03_fan
        - button.press: buzzer
    internal: true        
  # remote button row 3 button 2    
  - platform: remote_receiver
    name: "$device_name Fan Low"
    id: remote_1
    raw:
      code: [-207, 104, -104, 103, -104, 104, -103, 207, -104, 104, -103, 104, -104, 103, -104, 104, -103, 104, -104, 103, -726, 103, -312, 103, -518, 104, -933, 103, -104, 104, -725, 104, -103, 104, -726, 103, -104, 311, -518]
    on_release:
      then:
        - fan.turn_on:
            id: ifan03_fan
            speed: 1
        - button.press: buzzer
    internal: true    
  # remote button row 2 button 2 
  - platform: remote_receiver
    name: "$device_name Fan Medium"
    id: remote_2
    raw:
      code: [-208, 103, -104, 104, -103, 104, -103, 208, -103, 104, -104, 103, -104, 104, -103, 104, -104, 103, -104, 103, -726, 104, -310, 104, -518, 104, -933, 103, -104, 104, -725, 104, -207, 104, -622, 103, -416, 102, -415]
    on_release:
      then:
        - fan.turn_on:
            id: ifan03_fan
            speed: 2
        - button.press: buzzer
    internal: true    
  # remote button row 2 button 1    
  - platform: remote_receiver
    name: "$device_name Fan High"
    id: remote_3
    raw:
      code: [-207, 104, -104, 103, -104, 104, -103, 208, -103, 104, -104, 103, -104, 104, -103, 104, -104, 103, -104, 103, -726, 104, -311, 104, -518, 103, -934, 103, -103, 104, -726, 103, -104, 207, -622, 104, -103, 104, -207, 104, -415]
    on_release:
      then:
        - fan.turn_on:
            id: ifan03_fan
            speed: 3
        - button.press: buzzer
    internal: true    
  # remote button row 1 button 1    
  - platform: remote_receiver
    name: "$device_name Fan Light"
    id: remote_light
    raw:
      code: [-207, 104, -103, 104, -104, 103, -104, 207, -104, 103, -104, 104, -103, 104, -103, 104, -104, 103, -104, 104, -725, 104, -311, 103, -518, 104, -933, 103, -104, 103, -726, 103, -311, 104, -518, 104, -207, 104, -103, 104, -414]
    on_release:
      then:
        - light.toggle: ifan03_light
        - button.press: buzzer
    internal: true      
  # remote button row 1 button 2 - used to call a home assistant service
  - platform: remote_receiver
    name: "$device_name Spare Button"
    id: remote_spare_button
    raw:
      code: [-207, 104, -103, 104, -104, 103, -104, 207, -104, 103, -104, 103, -104, 104, -103, 104, -103, 104, -104, 107, -721, 105, -206, 207, -518, 105, -931, 104, -104, 103, -725, 104, -104, 103, -725, 104, -104, 103, -207, 104, -414]
    on_release:
      then:
        - homeassistant.action:
            action: light.toggle
            data:
              entity_id: $spare_button_light_entity
        - button.press: buzzer
    internal: true
