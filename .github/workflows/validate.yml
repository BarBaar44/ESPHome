name: Validate ESPHome Configs

on:
  push:
    branches: [main]
    paths:
      - 'DBE/**'
      - 'bluetooth-proxy/**'
      - 'generic/**'
      - 'shelly/**'
      - 'sonoff/**'
      - '.ci/**'
      - 'LVGL/**'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'DBE/**'
      - 'bluetooth-proxy/**'
      - 'generic/**'
      - 'shelly/**'
      - 'sonoff/**'
      - '.ci/**'
      - 'LVGL/**'
      - '.github/workflows/validate.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        harness:
          - .ci/dbe.yaml
          - .ci/bluetooth-proxy.yaml
          - .ci/shelly-one.yaml
          - .ci/shelly-plug_s.yaml
          - .ci/sonoff-basic.yaml
          - .ci/sonoff-ifan03.yaml
          - .ci/generic-sensors.yaml
          - LVGL/Masterbedroom/ci-harness.yaml
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install ESPHome
        run: pip install esphome

      - name: Validate ${{ matrix.harness }}
        run: esphome config ${{ matrix.harness }}
