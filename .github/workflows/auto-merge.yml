# Merges a Dependabot ESPHome bump (requirements.txt) once the validation
# workflow has passed on it. Only pip bumps from Dependabot qualify;
# GitHub Actions bumps and everything else still wait for a manual merge.
#
# --match-head-commit makes sure the commit that passed is the one that
# gets merged: if the branch moved in the meantime, the merge is refused
# and the next validation run decides again.
name: Auto-merge ESPHome bumps

on:
  workflow_run:
    workflows: [Validate ESPHome Configs]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/pip/')
    runs-on: ubuntu-latest
    steps:
      - name: Merge the Dependabot PR
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number')"
          if [ -z "$pr" ]; then
            echo "No open PR for $BRANCH"
            exit 0
          fi
          gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --squash --delete-branch --match-head-commit "$SHA"
