#   schedule_enabled: true
#   schedule_tz: Europe/Amsterdam
#   schedule_last_run: '2026-09-22T08:00:00.110410+00:00'

substitutions:
  device_name: bluetooth-proxy-attic
  device_description: Bluetooth Proxy Attic
  area: Hallway
esphome:
  name: bluetooth-proxy-attic
  comment: ${device_description}
  friendly_name: bluetooth-proxy-attic
  on_boot:
    then:
    - output.turn_on: power_led
esp32:
  board: esp32dev
  framework:
    type: esp-idf
logger: null
api:
  encryption:
    key: !secret 'bluetooth-proxy-attic_key'
  on_client_connected:
    then:
    - output.turn_on: ha_led
  on_client_disconnected:
    then:
    - output.turn_off: ha_led
ota:
#  password: !secret 'bluetooth-proxy-attic_ota'
  platform: esphome
packages:
  Generic_config:
    url: https://github.com/BarBaar44/ESPHome
    files:
    - bluetooth-proxy/proxy.yml
    refresh: 1min
