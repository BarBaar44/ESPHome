# Read by the Fleet for ESPHome add-on. Do not remove.
# esphome-fleet:
#   schedule: 0 10 */7 * *
#   schedule_enabled: true
#   schedule_tz: Europe/Amsterdam
#   schedule_last_run: '2026-10-29T09:00:00.202744+00:00'

substitutions:
  device_name: "bluetooth-proxy-garden"
  device_description: Bluetooth Proxy Garden
  area: "Rear Garden"
  device_key: !secret bluetooth-proxy-garden_key

esphome:
  name: "bluetooth-proxy-garden"
  comment: '${device_description}'
  friendly_name: "bluetooth-proxy-garden"
  on_boot:
    then:
      - output.turn_on: power_led

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:
  on_client_connected:
    then:
      - output.turn_on: ha_led
  on_client_disconnected:
    then:
      - output.turn_off: ha_led

# The one migration upload still needs the old OTA password. Remove
# this block after it.
ota:
  - id: !extend ota_esphome
    password: !secret bluetooth-proxy-garden_ota

packages:
  Generic_config:
    url: https://github.com/BarBaar44/ESPHome
    files: [bluetooth-proxy/proxy.yml, generic/api_ota.yml]
    refresh: 1min