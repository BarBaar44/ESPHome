substitutions:
  device_name: dbemasleft
  device_description: "DBE Master Left"
  dallas_1_ID: "0x5400000094412128"
  dallas_2_ID: "0x70000000943c0f28"
  WIFI_passwd: !secret wifi_password
  fallback_passwd: !secret wifi_bck
  friendly_name: "DBE Master Left"
  device_key: !secret dbemasleft_key
  area: "Master Bedroom"

esphome:
  name: dbe-mas-left
  friendly_name: '${device_description}'
  comment: '${device_description}'

esp8266:
  board: d1_mini

# Enable logging
logger:
  level: DEBUG

packages:
  Generic_config:
    url: https://github.com/BarBaar44/ESPHome
    files: [generic/wifi.yml, generic/generic_sensors.yml, DBE/DBEmain.yml]
    refresh: 1min