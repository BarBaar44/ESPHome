# Read by the Fleet for ESPHome add-on. Do not remove.
# esphome-fleet:
#   schedule: 0 10 */7 * *
#   schedule_enabled: true
#   schedule_tz: Europe/Amsterdam
#   schedule_last_run: '2026-09-22T08:00:00.172829+00:00'

substitutions:
  device_name: "bluetooth-proxy-hallway"
  device_description: "Bluetooth Proxy Hallway"
  area: "Hallway"

esphome:
  name: "bluetooth-proxy-hallway"
  comment: '${device_description}'
  friendly_name: "bluetooth-proxy-hallway"
  on_boot:
    then:
      - output.turn_on: power_led

esp32:
  board: esp32dev
  framework:
    type: esp-idf
     
# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret bluetooth-proxy-hallway_key

# ha_led on only while Home Assistant (a state-subscribing API client) is
# connected. on_client_connected/disconnected fired for every API client,
# so a log viewer or Fleet check disconnecting turned the LED off.
interval:
  - interval: 5s
    then:
      - if:
          condition:
            api.connected:
              state_subscription_only: true
          then:
            - output.turn_on: ha_led
          else:
            - output.turn_off: ha_led

ota:
  password: !secret bluetooth-proxy-hallway_ota
  platform: esphome

packages:
  Generic_config:
    url: https://github.com/BarBaar44/ESPHome
    files: [bluetooth-proxy/proxy.yml]
    refresh: 1min