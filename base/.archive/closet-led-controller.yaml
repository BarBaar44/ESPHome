# distributed-esphome:
#   schedule: 0 10 * * 2
#   schedule_enabled: true
#   schedule_tz: Europe/Amsterdam
#   schedule_last_run: '2026-04-22T08:00:00.074508+00:00'

substitutions:
  device_name: closetled
  friendly_name: "Closet LED Controller"
  device_description: Closet LED Controller
  WIFI_passwd: !secret wifi_password
  fallback_passwd: "!paniek!"
  area: "Living Room"

esphome:
  name: '${device_name}'
  comment: '${device_description}'
  friendly_name: '${friendly_name}'
  area: "Livingroom"

esp8266:
  board: esp8285

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "YA13ac/aLk6cmAF6uhF4HdPaWGLxXcnp2KCyjaOU088="

packages:
  Generic_config:
    url: https://github.com/BarBaar44/ESPHome
    files: [generic/generic_sensors.yml, generic/wifi.yml]
    refresh: 1min

light:
  - platform: rgbw
    name: Nice Friendly Name
    red: pwm_r
    green: pwm_g
    blue: pwm_b
    white: pwm_w
    restore_mode: ALWAYS_ON

output:
  - platform: esp8266_pwm
    pin: GPIO12
    frequency: 1000 Hz
    id: pwm_r

  - platform: esp8266_pwm
    pin: GPIO5
    frequency: 1000 Hz
    id: pwm_g

  - platform: esp8266_pwm
    pin: GPIO13
    frequency: 1000 Hz
    id: pwm_b

  - platform: esp8266_pwm
    pin: GPIO15
    frequency: 1000 Hz
    id: pwm_w