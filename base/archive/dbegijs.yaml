substitutions:
  device_name: dbegijs

esp32:
  board: esp32dev
  framework:
    type: arduino

esphome:
  name: '${device_name}'

wifi:
  ssid: "BarBaar_IoT"
  password: !secret wifipass
  fast_connect: on
  power_save_mode: light
  
# Set some global vars to prevent inital devision by zero's
globals:
  - id: fanspeed
    type: float
    restore_value: no
    initial_value: '1'
  - id: fanspeedmax
    type: float
    restore_value: no
    initial_value: '0.7'
  - id: delta_temp
    type: float
    restore_value: no
    initial_value: '1'

# Enable logging
logger:
  level: INFO
  on_message:
    - level: ERROR
      then:
        - mqtt.publish:
            topic: '${device_name}/error'
            payload: !lambda |-
              return "Triggered on_message with level " + to_string(level) + ", tag " + tag + " and message " + message;
    - level: WARN
      then:
        - mqtt.publish:
            topic: '${device_name}/warn'
            payload: !lambda |-
              return "Triggered on_message with level " + to_string(level) + ", tag " + tag + " and message " + message;


captive_portal:

ota:

api:

dallas:
  - pin: 23
    id: dallas_1
    update_interval: 30s
  - pin: 18
    id: dallas_2
    update_interval: 30s
  
sensor:
# Dallas Sensor 1
  - platform: dallas
    address: 0x730300A2792C4828
    name: '${device_name} Dallas 1'
    id: temp_1
    dallas_id: dallas_1
    accuracy_decimals: 1
    unit_of_measurement: "°C"
    icon: "mdi:fan"
    device_class: "temperature"
    state_class: "measurement"
    filters:
      - filter_out: nan
    on_value:
      then:
        - lambda: |-
            id(fanspeed) = (id(temp_2).state - id(temp_1).state) * 0.09;
            if (id(fanspeed) < 0) {
              id(fanspeed) = abs(id(fanspeed));
            }
        - logger.log:
            format: "fanspeed is %.1f, Fanspeedmax is %.1f"
            args: [ 'id(fanspeed)', 'id(fanspeedmax)' ]
        - if:
            condition:
              lambda: 'return id(fanspeed) > id(fanspeedmax);'
            then:
              - output.set_level:
                  id: ledc_speed
                  level: 0.7
              - logger.log: "Above 0.7"
              - switch.template.publish:
                  id: speedswitch
                  state: !lambda 'return true;'
        - if:
            condition:
              lambda: 'return id(fanspeed) < 0.1;'
            then:
              - output.set_level:
                  id: ledc_speed
                  level: 0
              - logger.log: "Stop fans"       
            else:
              - output.set_level:
                  id: ledc_speed
                  level: !lambda "return id(fanspeed);"
              - logger.log: "Below 0.7"
              - switch.template.publish:
                  id: speedswitch
                  state: !lambda 'return false;'

  - platform: dallas
# Dallas sensor 2
    address: 0x760300A279204728
    name: '${device_name} Dallas 2'
    id: temp_2
    dallas_id: dallas_2
    icon: "mdi:fan"
    accuracy_decimals: 1
    unit_of_measurement: "°C"
    device_class: "temperature"
    state_class: "measurement"
    filters:
      - filter_out: nan
  
  - platform: pulse_counter
    pin: 22
    name: '${device_name} Fan Speed'
    unit_of_measurement: 'RPM'
    filters:
      - multiply: 0.5
      

output:
  - platform: ledc
    pin: 21
    id: ledc_speed
    frequency: 25000
    
switch:
  - platform: template
    name: '${device_name} Fan Speed Control'
    id: speedswitch
    optimistic: true
    turn_on_action:
      - globals.set:
          id: fanspeedmax
          value: '1'
    turn_off_action:
      - globals.set:
          id: fanspeedmax
          value: '0.7'

button:
  - platform: restart
    name: '${device_name} restart'
    
mqtt:
 port: 1883
 broker: 192.168.0.221
 username: "mqtt"
 password: !secret mqttpass
 client_id: '${device_name}'