esphome:
  name: dbetim
  platform: ESP32
  board: esp32dev

wifi:
  ssid: "BarBaar_IoT"
  password: "Ergopower99"
  fast_connect: on
  power_save_mode: light
  
# Set some global vars to prevent inital devision by zero's
globals:
  - id: fanspeed
    type: float
    restore_value: no
    initial_value: '1'
  - id: fanspeeddef
    type: float
    restore_value: no
    initial_value: '1'
  - id: fanpower
    type: float
    restore_value: no
    initial_value: '0'
  - id: delta_temp
    type: float
    restore_value: no
    initial_value: '1'

# Enable logging
logger:
  level: INFO

ota:

dallas:
  - pin: 18
    id: dallas_1
    update_interval: 30s
  - pin: 23
    id: dallas_2
    update_interval: 30s
  
sensor:
# Sensor for outgoing water
  - platform: dallas
    address: 0x760300A279F92528
    name: "DBE Tim Temp Out"
    id: temp_out
    dallas_id: dallas_1
    accuracy_decimals: 1
    unit_of_measurement: "°C"
    device_class: "temperature"
    state_class: "measurement"
    on_value:
      then:
# Do not start the fans when tempdifference is below 2 degrees. Also prevents negative values
# Else start. Multiply by 0.03. 30 degrees is the maximum difference between tempIn and TempOut.
# Fanspeed must be a value between 0 and 1
#              id(fanspeed) = (0.09 * id(delta_temp));
        - lambda: |-
            id(delta_temp) = id(temp_in).state - id(temp_out).state;
              id(fanspeed) = (0.09 * id(delta_temp));
            if (id(fanspeed) < 0.1) {
              id(fanspeeddef) = 0;
            } else if (id(fanspeed) > 0.7) {
              id(fanspeeddef) = 0.7;
            } else {
              id(fanspeeddef) = id(fanspeed);
            }
            if (id(fanspeeddef) == 0) {
               id(fanpower) = 0;
            } else {
               id(fanpower) = 1;
            }
        - logger.log: 
            format: " Fan speed: %.3f Fan speed def: %.3f delta_temp: %.3f Fan power: %.3f"
            args: [  'id(fanspeed)', 'id(fanspeeddef)', 'id(delta_temp)', 'id(fanpower)' ]
        - output.set_level:
            id: gpio_19
            level: !lambda "return id(fanspeeddef);"
  - platform: dallas
# Sensor for incoming water
    address: 0xA20300A279AD9628
    name: "DBE Tim Temp In"
    id: temp_in
    dallas_id: dallas_2
    accuracy_decimals: 1
    unit_of_measurement: "°C"
    device_class: "temperature"
    state_class: "measurement"
  
  - platform: pulse_counter
    pin: 22
    name: "DBE Tim Fan Speed"
    unit_of_measurement: 'RPM'
    filters:
      - multiply: 0.5
      
output:
  - platform: ledc
    pin: 26
    id: gpio_19
    frequency: 25000

switch:
  - platform: restart
    name: "DBE Tim Restart"
  - platform: gpio
    id: gpio_5
    pin: 5
    
mqtt:
 port: 1883
 broker: 192.168.0.221
 username: "mqtt"
 password: "ergopower"
 client_id: dbetim