substitutions:
  device_name: shelly1-tim
  device_description: "Shelly Switch Tim"
  channel_1: Shelly1-tim
  WIFI_passwd: !secret wifi_password
  fallback_passwd: !secret wifi_bck
  device_key: !secret shelly1-tim_key
  friendly_name: "Shelly Switch Tim"
  area: "Room Tim"

packages:
  Generic_config:
    url: https://github.com/BarBaar44/ESPHome
    files: [generic/generic_sensors.yml, generic/wifi.yml, shelly/one.yml]
    refresh: 1min

# Debounce the wall-switch input. The first switch-on after the light has
# been off a while turned it straight back off 0.5 s later (the single-click
# delay): most likely a short spike on the SW wire read as a click. Real
# presses last 100 ms or more.
binary_sensor:
  - id: !extend button
    filters:
      - delayed_on: 50ms
