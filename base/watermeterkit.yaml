# Read by the Fleet for ESPHome add-on. Do not remove.
# esphome-fleet:
#   schedule: 0 10 */7 * *
#   schedule_enabled: true
#   schedule_tz: Europe/Amsterdam
#   schedule_last_run: '2026-09-01T08:00:01.246901+00:00'

#Name of device
substitutions:
  device_name: "watermeterkit"
  friendly_name: Water-Meter-Kit
  watermeterkit_software_version: "2023.10"
  WIFI_passwd: !secret wifi_password
  fallback_passwd: !secret wifi_bck
  device_key: !secret watermeterkit_key
  device_description: Watermeter
  area: "Hallway"

esphome:
  name: ${device_name}
  comment: '${device_description}'
  friendly_name: ${friendly_name}
  project:
    name: "smarthomeshop.watermeterkit"
    version: ${watermeterkit_software_version}

esp8266:
  board: esp01_1m
  restore_from_flash: true

# Enable logging
logger:
  
dashboard_import:
  package_import_url: github://smarthomeshop/watermeterkit/watermeterkit.yaml@main

packages:
  Generic_config:
    url: https://github.com/BarBaar44/ESPHome
    files: [generic/generic_sensors.yml, generic/wifi.yml]
    refresh: 1min

#Enable web server      
web_server:
  port: 80

# Status LED of ESP
status_led:
  pin: GPIO12

# Button to restart the watermeter
button:
  - platform: restart
    id: button_restart
    name: '${friendly_name} Restart'
  
# I²C Bus
#
# This component sets up the I²C bus for the ESP8266.
#
# https://esphome.io/components/i2c.html
#
i2c:
  sda: GPIO04
  scl: GPIO05

#LED for measure status
output:
  - platform: esp8266_pwm
    id: output_led_green
    pin: GPIO14
  - platform: esp8266_pwm
    id: output_led_blue
    pin: GPIO16
light:
  - platform: monochromatic
    id: light_led_green
    output: output_led_green
  - platform: monochromatic
    id: light_led_blue
    output: output_led_blue
  
sensor:
  #Wifi signal
  - platform: wifi_signal
    name: "${friendly_name} WiFi Signal"
    update_interval: 300s
    id: sensor_wifi_signal

  #Pulse meter part
  - platform: pulse_meter
    id: sensor_pulse_meter
    name: "${friendly_name} Current Usage"
    icon: "mdi:water-pump"
    unit_of_measurement: "L/min"
    internal_filter_mode: PULSE
    timeout: 2min
    internal_filter: 200ms
    accuracy_decimals: 1
    total:
      id: sensor_pulse_meter_total
      name: "${friendly_name} Total Consumption"
      icon: "mdi:cube-outline"
      unit_of_measurement: "m³"
      state_class: total_increasing
      device_class: water
      accuracy_decimals: 3
      filters:
        - multiply: 0.001
    pin: GPIO13
    on_value:
      then:
        - light.turn_on:
            id: light_led_green
            flash_length: 1s

  #HDC1080 temp & hum sensor
  - platform: hdc1080
    temperature:
      id: sensor_temperature
      name: "Temperature"
      filters:
        offset: -5.5
    humidity:
      id: sensor_humidity
      name: "Humidity"
      filters:
        offset: 12
    update_interval: 60s
    
text_sensor:
  # IP address #
  - platform: wifi_info
    ip_address:
      name: "${friendly_name} IP address"
      icon: "mdi:network-outline"
    ssid:
      name: "${friendly_name} Connected SSID"
    bssid:
      name: "${friendly_name} Connected BSSID"
  - platform: version
    id: text_sensor_version
    name: "${friendly_name} ESPHome Version"
  - platform: template
    id: text_sensor_watermeterkit_version
    name: "${friendly_name} Software version"
    update_interval: 5h
    lambda: |-
      return {"${watermeterkit_software_version}"};