# Read by the Fleet for ESPHome add-on. Do not remove.
# esphome-fleet:
#   schedule_last_run: '2026-09-08T08:00:01.200716+00:00'

########################################################################
# Water filter controller — both probes confirmed
#
# STATE: both QDY30A probes read real centimetres on one shared
# MAX485 bus, verified in water.
#
#   Modbus address 1 = UPPER chamber
#   Modbus address 2 = LOWER chamber
#
# Label the physical probes. They are otherwise indistinguishable, and
# an unlabelled swap is silent: the fill logic treats the two chambers
# completely differently.
#
# There is still NO fill/stop decision logic here. This config reads
# and reports; it does not decide anything.
#
# Board: ESP32 DevKit (ESP-WROOM-32), pin map per wiring-overview.html.
#
# Register map, confirmed empirically on BOTH probes:
#   0x0002 unit code   -> 17 (cm)
#   0x0003 decimals    -> 1
#   0x0004 measurement -> signed word, divide by 10
#   0x0000 slave address (writable, FC06)
#   0x000F save to user area (write 0, FC06)
#
# ADDRESSING, the thing that cost an evening: both probes were found
# already on address 2, contradicting every document in this project.
# The symptom was byte-perfect outgoing frames and zero bytes ever
# received. If that ever recurs, scan addresses before measuring
# anything. The renumbering buttons that fixed it have been removed
# from this file deliberately, so a stray press cannot rewrite an
# address in service. They are recorded in HANDOVER.md under "The
# addressing trap" if they are ever needed again.
########################################################################

esphome:
  name: waterfilter-controller
  friendly_name: Water Filter Controller

esp32:
  board: esp32dev
  framework:
    type: arduino

# --- Networking ---------------------------------------------------

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Waterfilter Fallback"
    password: !secret wifi_bck

captive_portal:

api:
  encryption:
    key: !secret waterlevel_key

ota:
  - platform: esphome
    password: !secret waterlevel_ota

# --- Logging --------------------------------------------------------
# Back down to INFO for day-to-day use.
#
# To chase a frame-level Modbus fault again, set level: VERBOSE and
# uncomment the logs: block below. The global level: is a CEILING —
# anything above it is compiled out of the firmware entirely, so
# modbus: VERBOSE under logs: does nothing unless level: is VERBOSE
# too. An earlier revision with level: DEBUG and modbus: VERBOSE
# printed no frame hex at all, which wasted real time.

logger:
  level: INFO
  # level: VERBOSE
  # logs:
  #   wifi: INFO
  #   api: INFO
  #   api.service: INFO
  #   sensor: INFO
  #   pulse_counter: INFO
  #   switch: INFO
  #   esp32: INFO
  #   component: INFO
  #   scheduler: INFO
  #   modbus: VERBOSE
  #   modbus_controller: DEBUG

# --- Modbus bus -----------------------------------------------------
# TX2/RX2 on the ESP32, matching wiring-overview.html.
# Probe wiring: blue to A, yellow to B. The MAX485 card in an earlier
# revision of wiring-overview.html said the opposite; it was wrong and
# has been corrected.

uart:
  id: modbus_uart
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1
  # Workaround for issue #17180. Forces the IDF UART to hand bytes over
  # one at a time instead of in batches, so the inter-frame timer does
  # not fire in the middle of a reply.
  rx_full_threshold: 1
  rx_timeout: 2
  # Do not add a debug: block here. It is not a passive observer; it
  # competes for the same incoming bytes. Use the logger logs: block
  # above instead, which prints frames without stealing them.

modbus:
  id: modbus_bus
  uart_id: modbus_uart
  flow_control_pin: GPIO4
  send_wait_time: 500ms
  # Spacing between consecutive commands on the shared bus. This moved
  # here from modbus_controller's command_throttle, which became a
  # no-op in 2026.x and is removed in 2027.2.0. Two probes share this
  # bus, so the gap matters. Raise to 300ms if intermittent timeouts
  # ever appear.
  turnaround_time: 200ms

modbus_controller:
  - id: probe_upper
    address: 0x01
    modbus_id: modbus_bus
    setup_priority: -10
    update_interval: 10s

  - id: probe_lower
    address: 0x02
    modbus_id: modbus_bus
    setup_priority: -10
    update_interval: 10s

# --- Sensors --------------------------------------------------------
#
# force_new_range: true is MANDATORY on every sensor. These probes
# reject multi-register reads with a clean Modbus exception, and
# modbus_controller merges adjacent registers into one read unless
# told not to. Do not remove it on any sensor added later.
#
# The /10 divisor comes from register 3 (decimals = 1), confirmed on
# both units. If a probe is ever swapped, re-enable the diagnostic
# sensors below and confirm 17 and 1 before trusting the divisor.

sensor:
  - platform: modbus_controller
    modbus_controller_id: probe_upper
    name: "Upper chamber level"
    id: upper_level
    register_type: holding
    address: 0x0004
    value_type: S_WORD
    force_new_range: true
    unit_of_measurement: "cm"
    accuracy_decimals: 1
    filters:
      - lambda: return x / 10.0;

  - platform: modbus_controller
    modbus_controller_id: probe_lower
    name: "Lower chamber level"
    id: lower_level
    register_type: holding
    address: 0x0004
    value_type: S_WORD
    force_new_range: true
    unit_of_measurement: "cm"
    accuracy_decimals: 1
    filters:
      - lambda: return x / 10.0;

  # --- Diagnostics, off by default --------------------------------
  # Unit code and decimal count for each probe. Both confirmed as 17
  # (cm) and 1. Kept here rather than deleted so a probe swap is a
  # two-minute check instead of a retype from the protocol PDF.
  #
  # - platform: modbus_controller
  #   modbus_controller_id: probe_upper
  #   name: "Upper unit code"
  #   register_type: holding
  #   address: 0x0002
  #   value_type: S_WORD
  #   force_new_range: true
  #   entity_category: diagnostic
  #
  # - platform: modbus_controller
  #   modbus_controller_id: probe_upper
  #   name: "Upper decimals"
  #   register_type: holding
  #   address: 0x0003
  #   value_type: S_WORD
  #   force_new_range: true
  #   entity_category: diagnostic
  #
  # - platform: modbus_controller
  #   modbus_controller_id: probe_lower
  #   name: "Lower unit code"
  #   register_type: holding
  #   address: 0x0002
  #   value_type: S_WORD
  #   force_new_range: true
  #   entity_category: diagnostic
  #
  # - platform: modbus_controller
  #   modbus_controller_id: probe_lower
  #   name: "Lower decimals"
  #   register_type: holding
  #   address: 0x0003
  #   value_type: S_WORD
  #   force_new_range: true
  #   entity_category: diagnostic

  # Hall-effect pulse counter on GPIO27, through the voltage divider.
  # Raw pulses for now. Litres per minute comes later, once the
  # pulses-per-litre figure is calibrated against a kitchen scale.
  # Currently off the breadboard — this sensor simply reads zero until
  # it is wired back in.
  - platform: pulse_counter
    pin:
      number: GPIO27
      mode:
        input: true
    unit_of_measurement: "pulses/min"
    name: "Flow sensor pulses"
    id: flow_pulses
    update_interval: 5s