#    - lambda: return (x / 477.0) * 60.0;
#    unit_of_measurement: "L/hr"

  - platform: modbus_controller
    modbus_controller_id: qd
    name: "Water level"
    id: modbus_water_level
    register_type: holding
    address: 0x0004
    unit_of_measurement: "mm"
    value_type: U_WORD

# water level sensor
# https://esphome.io/components/sensor/modbus_controller.html
uart:
  id: mod_bus
  tx_pin: GPIO21
  rx_pin: GPIO19
  baud_rate: 9600
  data_bits: 8
  stop_bits: 1
  parity: NONE
  #debug: 

modbus:
  id: modbus1
  uart_id: mod_bus
  flow_control_pin: GPIO18

modbus_controller:
  - id: qd
    address: 0x01
    modbus_id: modbus1
    setup_priority: -10
    update_interval: 5s