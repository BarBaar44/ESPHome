########################################################################
# Water filter controller — bring-up config
#
# Purpose: get logs flowing and confirm each piece of hardware responds,
# stage by stage, matching the wiring-plan.md build order. This is NOT
# the final fill-control logic — there's no fill/stop decision-making
# here yet. It just proves each component is wired correctly and
# readable, so problems get caught one stage at a time.
#
# Board: ESP32 DevKit (ESP-WROOM-32), matches the pin map in
# wiring-overview.html.
#
# Before flashing:
#   1. Create a file called secrets.yaml in the same folder as this
#      file (see the template at the bottom of this file's comments).
#   2. Adjust the register addresses in the modbus_controller section
#      once the seller sends the QDY30A register map — the ones below
#      are best-guess placeholders based on the common register layout
#      for this class of sensor, not confirmed for your exact unit.
########################################################################

esphome:
  name: waterfilter-controller
  friendly_name: Water Filter Controller

esp32:
  board: esp32dev
  framework:
    type: arduino

# --- Networking ---------------------------------------------------

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Falls back to a hotspot if it can't join your network — lets you
  # connect directly and fix the WiFi settings without a USB cable.
  ap:
    ssid: "Waterfilter Fallback"
    password: !secret wifi_bck

captive_portal:

api:
  encryption:
    key: !secret waterlevel_key

ota:
  - platform: esphome
    password: !secret waterlevel_ota

# --- Logging --------------------------------------------------------
# This board has its own USB-to-serial chip, so the logger runs on
# UART0 with no special settings, leaving UART1 and UART2 completely
# free for Modbus. Set to DEBUG while bringing components up; turn
# down to INFO once everything works, to reduce log noise.

logger:
  level: DEBUG

# --- Modbus bus (shared, one MAX485 module, both probes) -----------
# TX2/RX2 on the ESP32, matching wiring-overview.html.
# flow_control_pin drives RE+DE together on the MAX485 module.
 
uart:
  id: modbus_uart
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 9600
  stop_bits: 1
  rx_full_threshold: 1
  rx_timeout: 2
  # NOTE: the debug: block that used to sit here has been removed.
  # It taps into the same bytes the manual read below consumes —
  # turns out that's not a passive observer, it's a second consumer
  # racing the lambda's read_byte() calls for the same incoming
  # stream. That's a strong suspect for the specific, localized
  # corruption seen near the start of every reply all night, which
  # survived every module swap, resistor change, and timeout change:
  # all of those tests ran with this debug block active the whole
  # time. The lambda below now logs the raw bytes itself instead, so
  # nothing else touches the UART while a read is in progress.
 
# --- Manual Modbus read, bypassing modbus:/modbus_controller: -------
#
# Why this exists: every reply from this probe arrives with a variable
# number of leading junk bytes (6-8, changes between reads) in front
# of an otherwise perfect Modbus frame. Confirmed NOT caused by: the
# MAX485 module (swapped for a spare, no change), bias resistor value
# (68kΩ vs 680Ω, no change), send_wait_time (2000/2500/4000ms, all the
# same), rx_full_threshold/rx_timeout (added, no change), or which
# physical probe is wired in (both units show it). Since the junk
# length varies, a fixed "skip N bytes" filter isn't reliable — but
# the real frame's header (address 1, function 3, byte count 0x14)
# never varies. So instead of fighting modbus_controller's strict
# framing, this reads the raw bytes directly and searches for that
# exact header, ignoring anything before it.
#
# flow_control_pin (RE+DE) is now driven manually here instead of by
# a modbus: block, since that block has been removed entirely.
 
output:
  - platform: gpio
    pin: GPIO4
    id: rs485_direction
 
sensor:
  # This one sensor does all the work: on its own 10s poll cycle it
  # sends the Modbus request, reads the raw reply, finds the real
  # frame inside it, verifies the CRC, and returns the live register
  # value. Folded into a standard template sensor's update_interval +
  # lambda rather than a separate top-level interval: component, since
  # that component wasn't recognised by the Fleet validator — this
  # does exactly the same thing through an ordinary, already-supported
  # sensor pattern.
  #
  # Wrapped in a retry loop: the first real run tonight showed the
  # leading corruption is intermittent, not fixed — one cycle can fail
  # to find a clean 01 03 14 header (or fail CRC) while the very next
  # cycle succeeds. So instead of giving up after one bad attempt,
  # this tries up to 3 times within the same 10s poll before reporting
  # comms failure. A UART "timed out at byte 0" warning may appear in
  # the log during a failed attempt — that's the low-level driver
  # noticing a gap during our own manual polling, not a new fault on
  # top of the framing issue.
  - platform: template
    id: probe_1_level_raw
    name: "Probe 1 level (raw register 9)"
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      auto *uart = id(modbus_uart);
      // Request: address 1, function 3, start at register 9, read 1
      // register. Changed from the original 10-register burst read
      // after the probe rejected that with a clean Modbus exception
      // (function 0x83, code 1 = "Illegal Function") — this device
      // apparently doesn't support reading 10 registers in one go.
      // Register 9 is the one confirmed live during the reg0-reg9 scan.
      const uint8_t request[8] = {0x01, 0x03, 0x00, 0x09, 0x00, 0x01, 0x54, 0x08};
 
      for (int attempt = 0; attempt < 3; attempt++) {
        // Discard anything left over from a previous, abandoned cycle
        // so we always start reading a fresh reply from byte zero.
        uint8_t junk;
        while (uart->available()) {
          uart->read_byte(&junk);
        }
 
        id(rs485_direction).turn_on();   // DE/RE high = transmit
        delay(2);
        uart->write_array(request, 8);
        uart->flush();
        delay(2);
        id(rs485_direction).turn_off();  // DE/RE low = listen
 
        // --- Collect bytes for a fixed 1-second window per attempt.
        // Earlier version waited a full 3 seconds and reset the timer
        // on every byte, bailing after only 60ms of silence — that bug
        // made the wait far too short in practice. The ~2050ms figure
        // this project was built around all night looks like it was
        // itself an artifact of the old uart debug: block's logging
        // delay, not the probe's real behaviour — genuine replies seem
        // to land within a few hundred ms. 1 second per attempt gives
        // comfortable margin over that without holding the ESP32's
        // main loop hostage for long stretches: 3 failed attempts now
        // costs ~3s worst case instead of ~9s, which is very likely
        // what caused an OTA rollback when this was still 3000ms.
        std::vector<uint8_t> buf;
        uint32_t loop_start = millis();
        while (millis() - loop_start < 1000) {
          uint8_t b;
          if (uart->read_byte(&b)) {
            buf.push_back(b);
            if (buf.size() > 64) break;  // safety cap
          } else {
            delay(2);
          }
        }
 
        // --- Log the raw bytes ourselves, now that nothing else is
        // reading this UART at the same time. This replaces the
        // visibility the old debug: block gave us.
        {
          std::string hex;
          char tmp[4];
          for (size_t i = 0; i < buf.size(); i++) {
            sprintf(tmp, "%02X ", buf[i]);
            hex += tmp;
          }
          ESP_LOGD("probe1", "Attempt %d raw (%d bytes): %s", attempt + 1, buf.size(), hex.c_str());
        }
 
        // --- Check for a Modbus exception reply first: address, then
        // function code with the high bit set (0x83 = 0x03 | 0x80).
        // This is what the probe sent back when we asked for 10
        // registers at once — a clean, valid, CRC-correct rejection,
        // not corruption. Logging it distinctly so a real exception
        // doesn't get lumped in with "couldn't find a frame at all."
        for (size_t i = 0; i + 1 < buf.size(); i++) {
          if (buf[i] == 0x01 && buf[i + 1] == 0x83) {
            uint8_t code = (i + 2 < buf.size()) ? buf[i + 2] : 0xFF;
            ESP_LOGW("probe1", "Attempt %d: probe returned Modbus exception, code %d", attempt + 1, code);
            break;
          }
        }
 
        // --- Search the buffer for the real frame header: 01 03 02.
        // Byte count is 0x02 here (one register = 2 data bytes),
        // different from the 0x14 used when this requested 10
        // registers at once.
        int frame_start = -1;
        for (size_t i = 0; i + 2 < buf.size(); i++) {
          if (buf[i] == 0x01 && buf[i + 1] == 0x03 && buf[i + 2] == 0x02) {
            frame_start = i;
            break;
          }
        }
 
        // Full frame: addr(1) + func(1) + bytecount(1) + data(2) + CRC(2) = 7 bytes.
        if (frame_start < 0 || (size_t)(frame_start + 7) > buf.size()) {
          ESP_LOGW("probe1", "Attempt %d: no valid frame header found in %d bytes", attempt + 1, buf.size());
          delay(50);
          continue;  // try again
        }
 
        // Frame layout from frame_start: addr, func, bytecount(0x02),
        // 2 data bytes, then 2 CRC bytes.
        const uint8_t *f = &buf[frame_start];
 
        // --- Verify CRC16/Modbus over the 5 bytes before it, so a
        // frame that merely starts with the right header by chance
        // still gets rejected if the data is corrupt.
        uint16_t crc = 0xFFFF;
        for (int i = 0; i < 5; i++) {
          crc ^= f[i];
          for (int b = 0; b < 8; b++) {
            if (crc & 1) { crc = (crc >> 1) ^ 0xA001; }
            else { crc >>= 1; }
          }
        }
        uint8_t crc_lo = crc & 0xFF;
        uint8_t crc_hi = (crc >> 8) & 0xFF;
 
        if (f[5] != crc_lo || f[6] != crc_hi) {
          ESP_LOGW("probe1", "Attempt %d: CRC mismatch, discarding frame", attempt + 1);
          delay(50);
          continue;  // try again
        }
 
        // --- The single requested register's value is right after
        // the byte-count byte, at f[3] and f[4].
        uint16_t reg9 = (f[3] << 8) | f[4];
 
        if (attempt > 0) {
          ESP_LOGI("probe1", "Succeeded on attempt %d", attempt + 1);
        }
        id(probe_1_comms_ok).publish_state(1);
        return reg9;
      }
 
      // All 3 attempts failed this cycle.
      ESP_LOGW("probe1", "All 3 attempts failed this cycle");
      id(probe_1_comms_ok).publish_state(0);
      return {};
 
  - platform: template
    id: probe_1_comms_ok
    name: "Probe 1 comms OK"
    accuracy_decimals: 0
 
  # --- Flow sensor ---------------------------------------------------
  # Hall-effect pulse counter on GPIO27, arriving through the voltage
  # divider. Shows raw pulses per update interval — blow through the
  # sensor or spin the rotor by hand to confirm it counts. Converting
  # this to litres/min comes later, once you've calibrated the actual
  # pulses-per-litre figure against a kitchen scale.
  - platform: pulse_counter
    pin:
      number: GPIO27
      mode:
        input: true
    unit_of_measurement: "pulses/min"
    name: "Flow sensor pulses"
    id: flow_pulses
    update_interval: 5s
 
# --- Relay / valve ----------------------------------------------------
# inverted: true because this relay module is active-low (pulling the
# input pin low energises the coil). restore_mode ALWAYS_OFF means
# after any reboot the valve starts closed and stays closed until you
# explicitly command it open — never defaults to open.
#
# Wired so that de-energised = valve closed (see wiring-plan.md,
# "why the valve fails closed"). Toggling this switch in Home
# Assistant or the ESPHome dashboard should physically turn the valve.
 
switch:
  - platform: gpio
    pin: GPIO25
    id: fill_valve
    name: "Fill Valve"
    inverted: true
    restore_mode: ALWAYS_OFF
########################################################################
# secrets.yaml template — create this as a separate file in the same
# folder, filled in with your own values. Never commit this file or
# share it; it contains your WiFi password and device credentials.
#
# wifi_ssid: "your-wifi-name"
# wifi_password: "your-wifi-password"
# fallback_ap_password: "pick-any-password-8-chars-plus"
# api_encryption_key: "generate one at https://esphome.io/components/api.html#generating-an-encryption-key"
# ota_password: "pick-any-password"
########################################################################