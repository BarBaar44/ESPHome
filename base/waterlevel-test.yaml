########################################################################
# Water filter controller — bring-up config
#
# Purpose: get logs flowing and confirm each piece of hardware responds,
# stage by stage, matching the wiring-plan.md build order. This is NOT
# the final fill-control logic — there's no fill/stop decision-making
# here yet. It just proves each component is wired correctly and
# readable, so problems get caught one stage at a time.
#
# Board: ESP32 DevKit (ESP-WROOM-32), matches the pin map in
# wiring-overview.html.
#
# Before flashing:
#   1. Create a file called secrets.yaml in the same folder as this
#      file (see the template at the bottom of this file's comments).
#   2. Adjust the register addresses in the modbus_controller section
#      once the seller sends the QDY30A register map — the ones below
#      are best-guess placeholders based on the common register layout
#      for this class of sensor, not confirmed for your exact unit.
########################################################################

esphome:
  name: waterfilter-controller
  friendly_name: Water Filter Controller

esp32:
  board: esp32dev
  framework:
    type: arduino

# --- Networking ---------------------------------------------------

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Falls back to a hotspot if it can't join your network — lets you
  # connect directly and fix the WiFi settings without a USB cable.
  ap:
    ssid: "Waterfilter Fallback"
    password: !secret wifi_bck

captive_portal:

api:
  encryption:
    key: !secret waterlevel_key

ota:
  - platform: esphome
    password: !secret waterlevel_ota

# --- Logging --------------------------------------------------------
# This board has its own USB-to-serial chip, so the logger runs on
# UART0 with no special settings, leaving UART1 and UART2 completely
# free for Modbus. Set to DEBUG while bringing components up; turn
# down to INFO once everything works, to reduce log noise.

logger:
  level: DEBUG

# --- Modbus bus (shared, one MAX485 module, both probes) -----------
# TX2/RX2 on the ESP32, matching wiring-overview.html.
# flow_control_pin drives RE+DE together on the MAX485 module.
 
uart:
  id: modbus_uart
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1
  rx_full_threshold: 1
  rx_timeout: 2
  # NOTE: the debug: block that used to sit here has been removed.
  # It taps into the same bytes the manual read below consumes —
  # turns out that's not a passive observer, it's a second consumer
  # racing the lambda's read_byte() calls for the same incoming
  # stream. That's a strong suspect for the specific, localized
  # corruption seen near the start of every reply all night, which
  # survived every module swap, resistor change, and timeout change:
  # all of those tests ran with this debug block active the whole
  # time. The lambda below now logs the raw bytes itself instead, so
  # nothing else touches the UART while a read is in progress.
 
# --- Manual Modbus read, bypassing modbus:/modbus_controller: -------
#
# See the header at the top of this file for the full story. Short
# version: the read logic below sends one request at a time, waits,
# then searches the received bytes for a valid 01 03 02 frame and
# verifies its CRC before trusting anything. Searching for the frame
# rather than assuming it starts at byte zero makes this tolerant of
# any stray bytes on the line, which is worth keeping regardless of
# what caused them.
#
# RE+DE (GPIO4) is driven manually below, since there's no modbus:
# block to handle flow control anymore.
 
output:
  - platform: gpio
    pin: GPIO4
    id: rs485_direction
 
globals:
  # Decimal-place count from holding register 3, read once on the
  # first successful poll and cached. -1 means "not read yet".
  # Per the protocol doc this is 0-4, and the raw measurement from
  # register 4 must be divided by 10^(this value).
  - id: probe_1_decimals
    type: int
    restore_value: false
    initial_value: '-1'
 
sensor:
  # This one sensor does all the work: on its own 10s poll cycle it
  # sends the Modbus request, reads the raw reply, finds the real
  # frame inside it, verifies the CRC, and returns the live register
  # value. Folded into a standard template sensor's update_interval +
  # lambda rather than a separate top-level interval: component, since
  # that component wasn't recognised by the Fleet validator — this
  # does exactly the same thing through an ordinary, already-supported
  # sensor pattern.
  #
  # Wrapped in a retry loop for resilience against occasional bad
  # reads. Two real bugs were found and fixed before this worked:
  # (1) the old uart debug: block was reading the same bytes at the
  # same time as this lambda, corrupting the stream — removed; (2)
  # this originally requested 10 registers starting at 0 (a guess
  # from watching which register changed in a bucket test), which the
  # probe correctly rejected with a Modbus exception. The manufacturer's
  # own protocol PDF documents register 4 as the actual measurement
  # register, read one at a time — that's what's used now.
  - platform: template
    id: probe_1_level_raw
    name: "Probe 1 level"
    # Unit assumed to be cm. Per the protocol doc, holding register 2
    # carries the real unit code (17 = cm, 16 = m, 18 = mm, and a long
    # list of pressure units besides). Worth reading register 2 once
    # on the bench to confirm before trusting this label — if it comes
    # back as something other than 17, change this and the fill logic
    # that eventually depends on it.
    unit_of_measurement: "cm"
    accuracy_decimals: 1
    update_interval: 10s
    lambda: |-
      auto *uart = id(modbus_uart);
      // Request: address 1, function 3, start at register 4, read 1
      // register. Straight from the manufacturer's protocol PDF
      // (holding register 0x0004 = "Pressure/temperature measurement
      // output value"), CRC bytes copied verbatim from their worked
      // example "01 03 00 04 00 01 C5 CB" rather than recalculated.
      const uint8_t request[8] = {0x01, 0x03, 0x00, 0x04, 0x00, 0x01, 0xC5, 0xCB};
 
      // Request for register 3 (decimal-place count, 0-4) — also from
      // the doc's own example: "01 03 00 03 00 01 74 0A". The raw
      // value from register 4 must be divided by 10^(this), NOT a
      // hardcoded 10: the manufacturer's example happens to use 1
      // decimal place, but this probe could be configured differently
      // and the scaling would be silently wrong.
      const uint8_t request_dp[8] = {0x01, 0x03, 0x00, 0x03, 0x00, 0x01, 0x74, 0x0A};
 
      // --- One reusable read: sends an 8-byte request, waits, finds
      // the 01 03 02 frame, verifies CRC, returns true + the value.
      // Used for both the decimal-place register and the measurement
      // register so there's only one copy of the tricky logic.
      auto read_register = [&](const uint8_t *req, int16_t &out) -> bool {
        for (int attempt = 0; attempt < 3; attempt++) {
          uint8_t junk;
          while (uart->available()) {
            uart->read_byte(&junk);
          }
 
          id(rs485_direction).turn_on();   // DE/RE high = transmit
          delay(2);
          uart->write_array(req, 8);
          uart->flush();
          delay(2);
          id(rs485_direction).turn_off();  // DE/RE low = listen
 
          // Fixed 1s window per attempt. An earlier version waited 3s
          // and reset its timer on every byte while bailing after 60ms
          // of silence — that bug made the real wait far too short, and
          // the 3s version blocked the main loop long enough to trigger
          // an OTA rollback. 1s is comfortable margin without that risk.
          std::vector<uint8_t> buf;
          uint32_t loop_start = millis();
          while (millis() - loop_start < 1000) {
            uint8_t b;
            if (uart->read_byte(&b)) {
              buf.push_back(b);
              if (buf.size() > 64) break;
            } else {
              delay(2);
            }
          }
 
          {
            std::string hex;
            char tmp[4];
            for (size_t i = 0; i < buf.size(); i++) {
              sprintf(tmp, "%02X ", buf[i]);
              hex += tmp;
            }
            ESP_LOGD("probe1", "Attempt %d raw (%d bytes): %s", attempt + 1, buf.size(), hex.c_str());
          }
 
          // Modbus exception reply? (function code with high bit set)
          for (size_t i = 0; i + 1 < buf.size(); i++) {
            if (buf[i] == 0x01 && buf[i + 1] == 0x83) {
              uint8_t code = (i + 2 < buf.size()) ? buf[i + 2] : 0xFF;
              ESP_LOGW("probe1", "Attempt %d: probe returned Modbus exception, code %d", attempt + 1, code);
              break;
            }
          }
 
          // Find the real frame: addr 01, func 03, byte count 02.
          int frame_start = -1;
          for (size_t i = 0; i + 2 < buf.size(); i++) {
            if (buf[i] == 0x01 && buf[i + 1] == 0x03 && buf[i + 2] == 0x02) {
              frame_start = i;
              break;
            }
          }
 
          // Full frame: addr + func + bytecount + 2 data + 2 CRC = 7.
          if (frame_start < 0 || (size_t)(frame_start + 7) > buf.size()) {
            ESP_LOGW("probe1", "Attempt %d: no valid frame found in %d bytes", attempt + 1, buf.size());
            delay(50);
            continue;
          }
 
          const uint8_t *f = &buf[frame_start];
 
          uint16_t crc = 0xFFFF;
          for (int i = 0; i < 5; i++) {
            crc ^= f[i];
            for (int b = 0; b < 8; b++) {
              if (crc & 1) { crc = (crc >> 1) ^ 0xA001; }
              else { crc >>= 1; }
            }
          }
          if (f[5] != (crc & 0xFF) || f[6] != ((crc >> 8) & 0xFF)) {
            ESP_LOGW("probe1", "Attempt %d: CRC mismatch, discarding frame", attempt + 1);
            delay(50);
            continue;
          }
 
          out = (int16_t)((f[3] << 8) | f[4]);
          if (attempt > 0) {
            ESP_LOGI("probe1", "Succeeded on attempt %d", attempt + 1);
          }
          return true;
        }
        return false;
      };
 
      // --- Read the decimal-place count once, then cache it. Doing
      // this on the first poll rather than every cycle keeps the
      // normal path to a single request.
      if (id(probe_1_decimals) < 0) {
        int16_t dp = 0;
        if (read_register(request_dp, dp)) {
          if (dp >= 0 && dp <= 4) {
            id(probe_1_decimals) = dp;
            ESP_LOGI("probe1", "Decimal places (register 3) = %d", dp);
          } else {
            ESP_LOGW("probe1", "Register 3 returned %d, outside documented 0-4 range; assuming 1", dp);
            id(probe_1_decimals) = 1;
          }
        } else {
          ESP_LOGW("probe1", "Could not read decimal-place register yet, will retry next cycle");
          id(probe_1_comms_ok).publish_state(0);
          return {};
        }
      }
 
      // --- Read the actual measurement and scale it.
      int16_t raw = 0;
      if (!read_register(request, raw)) {
        ESP_LOGW("probe1", "All attempts failed this cycle");
        id(probe_1_comms_ok).publish_state(0);
        return {};
      }
 
      float divisor = powf(10.0f, (float)id(probe_1_decimals));
      id(probe_1_comms_ok).publish_state(1);
      return raw / divisor;
 
  - platform: template
    id: probe_1_comms_ok
    name: "Probe 1 comms OK"
    accuracy_decimals: 0
 
  # --- Flow sensor ---------------------------------------------------
  # Hall-effect pulse counter on GPIO27, arriving through the voltage
  # divider. Shows raw pulses per update interval — blow through the
  # sensor or spin the rotor by hand to confirm it counts. Converting
  # this to litres/min comes later, once you've calibrated the actual
  # pulses-per-litre figure against a kitchen scale.
  - platform: pulse_counter
    pin:
      number: GPIO27
      mode:
        input: true
    unit_of_measurement: "pulses/min"
    name: "Flow sensor pulses"
    id: flow_pulses
    update_interval: 5s
 
# --- Relay / valve ----------------------------------------------------
# inverted: true because this relay module is active-low (pulling the
# input pin low energises the coil). restore_mode ALWAYS_OFF means
# after any reboot the valve starts closed and stays closed until you
# explicitly command it open — never defaults to open.
#
# Wired so that de-energised = valve closed (see wiring-plan.md,
# "why the valve fails closed"). Toggling this switch in Home
# Assistant or the ESPHome dashboard should physically turn the valve.
 
switch:
  - platform: gpio
    pin: GPIO25
    id: fill_valve
    name: "Fill Valve"
    inverted: true
    restore_mode: ALWAYS_OFF
    
########################################################################
# secrets.yaml template — create this as a separate file in the same
# folder, filled in with your own values. Never commit this file or
# share it; it contains your WiFi password and device credentials.
#
# wifi_ssid: "your-wifi-name"
# wifi_password: "your-wifi-password"
# fallback_ap_password: "pick-any-password-8-chars-plus"
# api_encryption_key: "generate one at https://esphome.io/components/api.html#generating-an-encryption-key"
# ota_password: "pick-any-password"
########################################################################