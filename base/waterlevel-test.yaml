########################################################################
# Water filter controller — bring-up config
#
# Purpose: get logs flowing and confirm each piece of hardware responds,
# stage by stage, matching the wiring-plan.md build order. This is NOT
# the final fill-control logic — there's no fill/stop decision-making
# here yet. It just proves each component is wired correctly and
# readable, so problems get caught one stage at a time.
#
# Board: ESP32 DevKit (ESP-WROOM-32), matches the pin map in
# wiring-overview.html.
#
# Before flashing:
#   1. Create a file called secrets.yaml in the same folder as this
#      file (see the template at the bottom of this file's comments).
#   2. Adjust the register addresses in the modbus_controller section
#      once the seller sends the QDY30A register map — the ones below
#      are best-guess placeholders based on the common register layout
#      for this class of sensor, not confirmed for your exact unit.
########################################################################

esphome:
  name: waterfilter-controller
  friendly_name: Water Filter Controller

esp32:
  board: esp32dev
  framework:
    type: arduino

# --- Networking ---------------------------------------------------

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Falls back to a hotspot if it can't join your network — lets you
  # connect directly and fix the WiFi settings without a USB cable.
  ap:
    ssid: "Waterfilter Fallback"
    password: !secret wifi_bck

captive_portal:

api:
  encryption:
    key: !secret waterlevel_key

ota:
  - platform: esphome
    password: !secret waterlevel_ota

# --- Logging --------------------------------------------------------
# This board has its own USB-to-serial chip, so the logger runs on
# UART0 with no special settings, leaving UART1 and UART2 completely
# free for Modbus. Set to DEBUG while bringing components up; turn
# down to INFO once everything works, to reduce log noise.

# --- Logging --------------------------------------------------------
# This board has its own USB-to-serial chip, so the logger runs on
# UART0 with no special settings, leaving UART1 and UART2 free.
#
# modbus at VERBOSE prints every frame sent and received as hex. That
# is what you want during bring-up: if the probe answers with an
# exception rather than data, you will see the raw bytes rather than
# just a timeout. Turn this back down to INFO once it reads reliably.
 
logger:
  # IMPORTANT: the global level: is a ceiling. Anything above it is
  # compiled out of the firmware entirely, so a per-component entry of
  # VERBOSE under logs: does nothing unless level: is VERBOSE too.
  # That is why an earlier revision of this file, with level: DEBUG and
  # modbus: VERBOSE, printed no frame hex at all.
  level: VERBOSE
  logs:
    # Everything that is not modbus gets turned back down, otherwise
    # VERBOSE globally is unreadable.
    wifi: INFO
    api: INFO
    api.service: INFO
    sensor: INFO
    pulse_counter: INFO
    switch: INFO
    esp32: INFO
    component: INFO
    scheduler: INFO
    # These two are the point of the exercise. modbus at VERBOSE prints
    # every frame written and every frame received, as hex.
    modbus: VERBOSE
    modbus_controller: DEBUG
 
# --- Modbus bus -----------------------------------------------------
# TX2/RX2 on the ESP32, matching wiring-overview.html.
 
uart:
  id: modbus_uart
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1
  # Workaround for issue #17180. Forces the IDF UART to hand bytes over
  # one at a time instead of in batches, so the inter-frame timer does
  # not fire in the middle of a reply.
  rx_full_threshold: 1
  rx_timeout: 2
  # Do not add a debug: block here. It is not a passive observer; it
  # competes for the same incoming bytes. Use logger logs: modbus:
  # VERBOSE above instead, which prints frames without stealing them.
 
modbus:
  id: modbus_bus
  uart_id: modbus_uart
  # Drives RE and DE together on the MAX485 module. With this set, the
  # component handles direction switching, which also removes the
  # self-inflicted break bytes the hand-rolled version produced: while
  # RE is high the MAX485's RO floats, the divider pulls the ESP32 RX
  # pin low, and a held-low RX line reads out as a run of 0x00 bytes.
  flow_control_pin: GPIO4
  send_wait_time: 500ms
 
modbus_controller:
  - id: probe1
    address: 0x01          # both probes ship as address 1
    modbus_id: modbus_bus
    setup_priority: -10
    update_interval: 10s
 
# --- Sensors --------------------------------------------------------
 
sensor:
  # The measurement, scaled to real centimetres. Register 3 (decimals)
  # was confirmed to read 1 during bring-up, and register 2 (unit) was
  # confirmed to read 17, cm, matching wiring-overview.html's original
  # assumption. Both are hardcoded below rather than polled every
  # cycle, since they are configuration data on the probe, not a
  # changing measurement — see probe1_decimals / probe1_unit further
  # down for the one-off sensors that established these values.
  #
  # If a probe is ever swapped for a different unit or a different
  # decimal-place setting, re-enable the register 2/3 sensors below,
  # confirm the new values in the log, and update the divisor here.
  - platform: modbus_controller
    modbus_controller_id: probe1
    name: "Probe 1 level"
    id: probe1_level
    register_type: holding
    address: 0x0004
    value_type: S_WORD
    force_new_range: true
    unit_of_measurement: "cm"
    accuracy_decimals: 1
    filters:
      - lambda: return x / 10.0;
 
  # Decimal-place count and unit code, confirmed once (1 and 17 / cm)
  # during bring-up and disabled here rather than deleted, so a future
  # probe swap can re-enable them for a quick sanity check instead of
  # retyping the register addresses from the protocol PDF.
  #
  # - platform: modbus_controller
  #   modbus_controller_id: probe1
  #   name: "Probe 1 decimals"
  #   id: probe1_decimals
  #   register_type: holding
  #   address: 0x0003
  #   value_type: S_WORD
  #   force_new_range: true
  #
  # - platform: modbus_controller
  #   modbus_controller_id: probe1
  #   name: "Probe 1 unit code"
  #   id: probe1_unit
  #   register_type: holding
  #   address: 0x0002
  #   value_type: S_WORD
  #   force_new_range: true
 
  # Hall-effect pulse counter on GPIO27, through the voltage divider.
  # Raw pulses for now. Blow through the sensor or spin the rotor by
  # hand to confirm it counts. Litres per minute comes later, once the
  # pulses-per-litre figure is calibrated against a kitchen scale.
  - platform: pulse_counter
    pin:
      number: GPIO27
      mode:
        input: true
    unit_of_measurement: "pulses/min"
    name: "Flow sensor pulses"
    id: flow_pulses
    update_interval: 5s
 
# --- Relay / valve ---------------------------------------------------
# inverted: true because this relay module is active-low (pulling the
# input pin low energises the coil). restore_mode ALWAYS_OFF means the
# valve starts closed after any reboot and stays closed until it is
# explicitly commanded open. It never defaults to open.
#
# Wired so that de-energised equals valve closed (see wiring-plan.md,
# "why the valve fails closed").
 
switch:
  - platform: gpio
    pin: GPIO25
    id: fill_valve
    name: "Fill Valve"
    inverted: true
    restore_mode: ALWAYS_OFF
 