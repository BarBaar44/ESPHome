substitutions:
  device_name: waterlevel
  device_description: "Water level controller"
  name: "waterlevel-test"
  WIFI_passwd: !secret wifi_password
  fallback_passwd: !secret wifi_bck
  device_key: !secret waterlevel_key
  friendly_name: "Water Level Controller"
  area: "Kitchen"

esphome:
 name: '${name}'
 comment: '${device_description}'
 friendly_name: "${friendly_name}"

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
logger:
  level: DEBUG

packages:
  Generic_config:
    url: https://github.com/BarBaar44/ESPHome
    files: [generic/wifi.yml, generic/generic_sensors.yml]
    refresh: 1min

web_server:
  port: 80

## --- Modbus bus (shared, one MAX485 module, both probes) -----------
# TX2/RX2 on the ESP32, matching wiring-overview.html.
# flow_control_pin drives RE+DE together on the MAX485 module.
 
uart:
  id: modbus_uart
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 9600
  stop_bits: 1
 
modbus:
  id: modbus_hub
  uart_id: modbus_uart
  flow_control_pin: GPIO4

  # --- Probe 1 (whichever one is currently wired to the bus) ----------
# Factory default Modbus address is usually 1. If you've already
# renumbered a probe per the seller's instructions, change the
# address below to match.
 
modbus_controller:
  - id: probe_1
    address: 0x01
    modbus_id: modbus_hub
    update_interval: 10s
 
sensor:
  # --- Register scan block, for finding the real register map -------
  # Reads holding registers 0 through 9 in one pass. Move the probe up
  # and down in a bucket of water and watch the logs: exactly one or
  # two of these should change while the rest stay flat. That tells
  # you which register holds the live value, without guessing one
  # address at a time and reflashing between each try.
  #
  # Once you know which register is the real value, you can delete the
  # ones that never move and keep just the one(s) that matter.
  - platform: modbus_controller
    modbus_controller_id: probe_1
    id: probe_1_reg0
    name: "Probe 1 reg 0"
    register_type: holding
    address: 0x00
    value_type: U_WORD
  - platform: modbus_controller
    modbus_controller_id: probe_1
    id: probe_1_reg1
    name: "Probe 1 reg 1"
    register_type: holding
    address: 0x01
    value_type: U_WORD
  - platform: modbus_controller
    modbus_controller_id: probe_1
    id: probe_1_reg2
    name: "Probe 1 reg 2"
    register_type: holding
    address: 0x02
    value_type: U_WORD
  - platform: modbus_controller
    modbus_controller_id: probe_1
    id: probe_1_reg3
    name: "Probe 1 reg 3"
    register_type: holding
    address: 0x03
    value_type: U_WORD
  - platform: modbus_controller
    modbus_controller_id: probe_1
    id: probe_1_reg4
    name: "Probe 1 reg 4"
    register_type: holding
    address: 0x04
    value_type: U_WORD
  - platform: modbus_controller
    modbus_controller_id: probe_1
    id: probe_1_reg5
    name: "Probe 1 reg 5"
    register_type: holding
    address: 0x05
    value_type: U_WORD
  - platform: modbus_controller
    modbus_controller_id: probe_1
    id: probe_1_reg6
    name: "Probe 1 reg 6"
    register_type: holding
    address: 0x06
    value_type: U_WORD
  - platform: modbus_controller
    modbus_controller_id: probe_1
    id: probe_1_reg7
    name: "Probe 1 reg 7"
    register_type: holding
    address: 0x07
    value_type: U_WORD
  - platform: modbus_controller
    modbus_controller_id: probe_1
    id: probe_1_reg8
    name: "Probe 1 reg 8"
    register_type: holding
    address: 0x08
    value_type: U_WORD
  - platform: modbus_controller
    modbus_controller_id: probe_1
    id: probe_1_reg9
    name: "Probe 1 reg 9"
    register_type: holding
    address: 0x09
    value_type: U_WORD
 
  # Once you've identified which register holds the raw value, and
  # (if the sensor works this way) which two hold the unit code and
  # decimal-place count, replace probe_1_raw_value / _decimals below
  # with the real addresses you found above, and delete the reg0-reg9
  # scan block — it's only needed for this initial discovery step.
  - platform: modbus_controller
    modbus_controller_id: probe_1
    id: probe_1_raw_value
    name: "Probe 1 raw value (guess: reg 4)"
    register_type: holding
    address: 0x04
    value_type: U_WORD
 
  - platform: modbus_controller
    modbus_controller_id: probe_1
    id: probe_1_decimals
    name: "Probe 1 decimal places (guess: reg 3)"
    register_type: holding
    address: 0x03
    value_type: U_WORD
 
  - platform: modbus_controller
    modbus_controller_id: probe_1
    id: probe_1_unit_code
    name: "Probe 1 unit code (guess: reg 2)"
    register_type: holding
    address: 0x02
    value_type: U_WORD
 
  # Computed reading: raw value divided by 10^(decimal places).
  # Will show "NA" for the first update cycle until the two source
  # sensors above have reported at least once. That's expected.
  - platform: template
    name: "Probe 1 level (computed)"
    id: probe_1_level
    unit_of_measurement: "units"
    update_interval: 10s
    lambda: |-
      if (isnan(id(probe_1_raw_value).state) || isnan(id(probe_1_decimals).state)) {
        return {};
      }
      return id(probe_1_raw_value).state / pow(10, id(probe_1_decimals).state);
 
  # --- Flow sensor ---------------------------------------------------
  # Hall-effect pulse counter on GPIO27, arriving through the voltage
  # divider. Shows raw pulses per update interval — blow through the
  # sensor or spin the rotor by hand to confirm it counts. Converting
  # this to litres/min comes later, once you've calibrated the actual
  # pulses-per-litre figure against a kitchen scale.
  - platform: pulse_counter
    pin:
      number: GPIO27
      mode:
        input: true
    unit_of_measurement: "pulses/min"
    name: "Flow sensor pulses"
    id: flow_pulses
    update_interval: 5s
 
# --- Relay / valve ----------------------------------------------------
# inverted: true because this relay module is active-low (pulling the
# input pin low energises the coil). restore_mode ALWAYS_OFF means
# after any reboot the valve starts closed and stays closed until you
# explicitly command it open — never defaults to open.
#
# Wired so that de-energised = valve closed (see wiring-plan.md,
# "why the valve fails closed"). Toggling this switch in Home
# Assistant or the ESPHome dashboard should physically turn the valve.
 
switch:
  - platform: gpio
    pin: GPIO25
    id: fill_valve
    name: "Fill Valve"
    inverted: true
    restore_mode: ALWAYS_OFF
