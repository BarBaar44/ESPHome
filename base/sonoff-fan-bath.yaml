substitutions:
  device_name: sonoff-fb
  device_description: Fan Bathroom
  channel_1: sonoff-fb
  WIFI_passwd: !secret wifi_password
  fallback_passwd: !secret wifi_bck
  device_key: !secret sonoff-fb_key
  friendly_name: "Fan Bathroom"
  area: "Bathroom"

packages:
  Generic_config:
    url: https://github.com/BarBaar44/ESPHome
    files: [generic/generic_sensors.yml, generic/wifi.yml, sonoff/basic.yml]
    refresh: 1min

switch:
  - id: !extend light_1
    icon: "mdi:fan"