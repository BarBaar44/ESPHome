substitutions:
  device_name: dberoomtim
  device_description: "DBE Room Tim"
  dallas_1_ID: "0xf50000007a84ce28"
  dallas_2_ID: "0x120000007bd32928"
  WIFI_passwd: !secret wifi_password
  fallback_passwd: !secret wifi_bck
  friendly_name: "DBE Room Tim"
  device_key: !secret dberoomtim_key
  area: "Room Tim"

esphome:
  name: dbe-room-tim
  friendly_name: '${device_description}'

esp8266:
  board: d1_mini

# Enable logging
logger:
  level: DEBUG

packages:
  Generic_config:
    url: https://github.com/BarBaar44/ESPHome
    files: [generic/wifi.yml, generic/generic_sensors.yml, DBE/DBEmain.yml]
    refresh: 1min