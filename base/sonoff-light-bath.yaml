substitutions:
  device_name: sonoff-lb
  device_description: Light Closet Bathroom
  channel_1: sonoff-lb
  WIFI_passwd: !secret wifi_password
  fallback_passwd: !secret wifi_bck
  device_key: !secret sonoff-lb_key
  friendly_name: "Light Closet Bathroom"
  area: "Bathroom"

packages:
  Generic_config:
    url: https://github.com/BarBaar44/ESPHome
    files: [generic/generic_sensors.yml, generic/wifi.yml, sonoff/basic.yml]
    refresh: 1min